# Render.com blueprint — creates the VMMS backend service.
# In Render: New + → Blueprint → connect the vmms repository → Apply.
# Region is Singapore (ap-southeast-1) so the backend sits close to the
# Supabase database (Seoul) and to the Singapore-based users.
services:
  - type: web
    name: vmms-backend-sg
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: SUPABASE_URL
        sync: false   # paste in the Render dashboard
      - key: SUPABASE_ANON_KEY
        sync: false   # paste in the Render dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false   # paste in the Render dashboard (server-side only)

<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#C00000"><title>VCMS — Project Schedule</title>
  <link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><link rel="stylesheet" href="css/app.css">
  <script src="js/config.js"></script><script src="js/auth.js"></script>
  <style>
    .wbs-row{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:7px 0}.wbs-code{font-weight:800;color:#991b1b}.wbs-actions button{padding:6px 9px;border:1px solid #d1d5db;border-radius:8px;background:#fff}.muted{color:#6b7280;font-size:12px}
  </style>
</head><body class="bg-gray-100 min-h-screen flex flex-col">
  <header class="bg-red-700 text-white p-4 shadow flex items-center gap-3 sticky top-0 z-10"><a href="home.html" class="text-2xl font-bold">‹</a><div class="flex-1"><h1 class="text-lg font-bold">Project Schedule</h1><p class="text-red-100 text-xs" id="subtitle">WBS foundation</p></div><button id="add" class="hidden bg-white text-red-800 font-bold px-4 py-2 rounded-lg">+ WBS</button></header>
  <main class="flex-1 p-4 max-w-5xl mx-auto w-full"><div id="loading" class="text-center text-gray-500 py-10">Loading schedule…</div><div id="empty" class="hidden bg-white rounded-2xl p-8 text-center"><h2 class="font-bold text-lg">No WBS yet</h2><p class="muted mt-2">Add the first project phase to begin planning.</p></div><div id="tree"></div></main>
  <div id="modal" class="hidden fixed inset-0 bg-black/50 z-30 flex items-end sm:items-center justify-center"><form id="form" class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-6"><h2 id="form-title" class="font-bold text-lg mb-4">Add WBS</h2><label class="text-sm font-medium">Parent</label><select id="parent" class="w-full border rounded-lg p-3 mb-3 bg-white"><option value="">Top level</option></select><label class="text-sm font-medium">Code</label><input id="code" required maxlength="60" class="w-full border rounded-lg p-3 mb-3 uppercase"><label class="text-sm font-medium">Name</label><input id="name" required maxlength="240" class="w-full border rounded-lg p-3 mb-3"><label class="text-sm font-medium">Description</label><textarea id="description" class="w-full border rounded-lg p-3 mb-3"></textarea><p id="error" class="hidden text-red-700 text-sm mb-3"></p><div class="flex gap-3"><button type="button" id="cancel" class="flex-1 border rounded-lg py-3">Cancel</button><button class="flex-1 bg-red-700 text-white font-bold rounded-lg py-3">Save</button></div></form></div>
  <script src="js/schedule-wbs.js"></script>
</body></html>

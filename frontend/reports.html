<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#C00000">
  <title>VCMS — Reports</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="js/core-bundle.js?v=20260828-shell2"></script>
  <script src="js/auth.js?v=20260813-8"></script><script src="js/ui.js?v=20260825-ui5"></script>
  <style>
    .report-attendance-row > label { display:block; min-width:0; }
    @media (max-width:899px) { .report-attendance-row > label > span { display:none; } }
    @media print {
      header, #controls, #actions { display: none !important; }
      body { background: white; }
      #tablebox { box-shadow: none; }
    }
    @media (min-width:900px) {
      body.vcms-shelled .reports-page-title { gap:12px; }
      body.vcms-shelled .reports-page-title h1 { font-size:22px; line-height:1.2; }
      body.vcms-shelled .reports-page-title p { margin:0; padding-left:12px; border-left:1px solid #D1D5DB; line-height:22px; }
      #reports-main { max-width:none !important; margin:0 !important; padding:28px 34px 40px !important; }
      #controls { display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:16px; padding:22px 24px; margin-bottom:18px; }
      #controls > * { margin:0 !important; }
      #controls .report-kind { grid-column:1 / 5; }
      #controls .report-date-row { grid-column:5 / 9; }
      #controls .report-attendance-row { grid-column:9 / 13; }
      #controls #wsearch { grid-column:1 / 9; min-height:44px; }
      #controls .run-report { grid-column:9 / 13; min-height:44px; }
      #controls .report-attendance-row { align-items:end; }
      #controls .report-attendance-row > label { min-width:0; }
      #controls .report-attendance-row select { width:100%; height:44px; box-sizing:border-box; }
      #controls .report-date-row input, #controls .report-kind select { height:44px; box-sizing:border-box; }
      #monthly-timesheet-link { display:none !important; }
      #actions { max-width:560px; margin-left:auto; }
      #summary { grid-template-columns:repeat(8,minmax(0,1fr)) !important; gap:12px; }
      #summary > div { min-height:82px; display:flex; flex-direction:column; justify-content:center; }
      #tablebox { min-height:260px; border:1px solid #E5E7EB; }
      #tbl { font-size:13px; }
      #tbl th,#tbl td { padding:12px 14px; white-space:nowrap; }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <header class="bg-red-700 text-white p-4 shadow flex items-center gap-3 sticky top-0 z-10">
    <a href="home.html" class="text-2xl font-bold leading-none">‹</a>
    <div class="flex-1 reports-page-title">
      <h1 class="text-lg font-bold">Reports</h1>
      <p class="text-red-100 text-xs" id="count">Set filters and Run</p>
    </div>
  </header>

  <main id="reports-main" class="flex-1 p-4 max-w-2xl mx-auto w-full pb-10">
    <div id="controls" class="bg-white rounded-xl shadow p-4 mb-4 space-y-3">
      <div class="report-kind"><label class="text-xs text-gray-500">Report</label><select id="report-type" class="w-full border border-gray-300 rounded-lg p-2 bg-white"><option value="attendance">Workforce attendance</option></select></div>
      <div class="flex gap-2 report-date-row">
        <div class="flex-1">
          <label class="text-xs text-gray-500">From</label>
          <input id="from" type="date" class="w-full border border-gray-300 rounded-lg p-2">
        </div>
        <div class="flex-1">
          <label class="text-xs text-gray-500">To</label>
          <input id="to" type="date" class="w-full border border-gray-300 rounded-lg p-2">
        </div>
      </div>
      <div class="flex gap-2 report-attendance-row">
        <label class="flex-1"><span class="text-xs text-gray-500">Site</span><select id="site" class="flex-1 border border-gray-300 rounded-lg p-2 bg-white">
          <option value="">All sites</option>
        </select></label>
        <label class="flex-1"><span class="text-xs text-gray-500">View</span><select id="view" class="flex-1 border border-gray-300 rounded-lg p-2 bg-white">
          <option value="detail">Detail (day by day)</option>
          <option value="worker">Summary by worker</option>
          <option value="site">Summary by site</option>
        </select></label>
      </div>
      <input id="wsearch" type="search" placeholder="Filter by worker name (optional)"
             class="w-full border border-gray-300 rounded-lg p-2">
      <button onclick="run()" class="run-report w-full bg-red-700 hover:bg-red-800 text-white font-bold py-3 rounded-lg">Run Report</button>
      <a id="monthly-timesheet-link" href="timesheet.html" class="block text-center border-2 border-red-700 text-red-700 font-bold py-2.5 rounded-lg">Monthly Timesheet →</a>
    </div>

    <div id="actions" class="hidden flex gap-3 mb-3">
      <button onclick="exportXlsx()" class="flex-1 border-2 border-green-700 text-green-700 font-bold py-2 rounded-lg text-sm">Export Excel</button>
      <button onclick="downloadPdf()" class="flex-1 bg-red-700 hover:bg-red-800 text-white font-bold py-2 rounded-lg text-sm">Download PDF</button>
      <button onclick="window.print()" class="flex-1 border-2 border-gray-500 text-gray-600 font-bold py-2 rounded-lg text-sm">Print</button>
    </div>

    <div id="summary" class="hidden grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3"></div>

    <div id="tablebox" class="bg-white rounded-xl shadow overflow-x-auto">
      <table class="w-full text-xs" id="tbl"></table>
    </div>
  </main>

  <script>
    requireLogin();
    let DATA = [], HEADERS = [], ROWS = [], REPORT_META = null;

    function fmtD(iso) { const [y,m,d] = iso.split("-"); return `${d}/${m}/${y}`; }

    async function boot() {
      const me = await vmmsApi("/api/v1/me");
      if (!me.ok) { vmmsLogout(); return; }
      const today = new Date().toISOString().slice(0,10);
      document.getElementById("from").value = today.slice(0,8) + "01";
      document.getElementById("to").value = today;
      if(window.innerWidth>=900 && !document.querySelector('#report-type option[value="monthly_timesheet"]')) document.getElementById("report-type").insertAdjacentHTML("beforeend",'<option value="monthly_timesheet">Monthly attendance sheet</option>');
      const rs = await vmmsApi("/api/v1/sites");
      if (rs.ok) {
        const sites = (await rs.json()).filter(s => s.status === "active");
        document.getElementById("site").innerHTML =
          '<option value="">All sites</option>' +
          sites.map(s => `<option value="${s.id}">${esc(s.site_name)}</option>`).join("");
      }
    }

    async function run() {
      const f = document.getElementById("from").value, t = document.getElementById("to").value;
      const sid = document.getElementById("site").value;
      const r = await vmmsApi(`/api/v1/reports/attendance?dfrom=${f}&dto=${t}${sid ? "&site_id=" + sid : ""}`);
      if (!r.ok) { const e = await r.json(); alert(e.detail || "Failed"); return; }
      DATA = await r.json();
      REPORT_META=null;document.getElementById("summary").classList.add("hidden");
      const q = document.getElementById("wsearch").value.trim().toLowerCase();
      if (q) DATA = DATA.filter(x => x.worker.toLowerCase().includes(q));
      render();
    }

    function renderTable(){document.getElementById("count").textContent=`${ROWS.length} rows`;document.getElementById("actions").classList.remove("hidden");document.getElementById("tbl").innerHTML="<thead class='bg-gray-50 text-gray-500'><tr>"+HEADERS.map(h=>`<th class="text-left p-2">${esc(h)}</th>`).join("")+"</tr></thead><tbody>"+ROWS.map(r=>"<tr class='border-t border-gray-100'>"+r.map(c=>`<td class="p-2">${esc(c)}</td>`).join("")+"</tr>").join("")+"</tbody>";}

    function render() {
      const view = document.getElementById("view").value;
      if (view === "detail") {
        HEADERS = ["Date", "Site", "ID", "Worker", "Attendance", "Shift", "Start", "End", "Normal", "OT", "Day"];
        ROWS = DATA.map(x => [fmtD(x.date), x.site, x.worker_code, x.worker,
                              x.present === null ? "-" : (x.present ? (x.partial_leave ? `Worked + ½ ${x.partial_leave.toUpperCase()}` : "Worked") : (x.absence ? x.absence.toUpperCase() : "Absent")),
                              (x.shift_type||"").toUpperCase(),x.start,x.end+(x.end_next_day?" (+1 day)":""),x.nh,x.ot,x.day_type]);
      } else if (view === "worker") {
        const agg = {};
        DATA.forEach(x => {
          if (!x.present) return;
          const a = agg[x.worker_code] ??= { name: x.worker, days: 0, nh: 0, ot: 0 };
          a.days++; a.nh += x.nh; a.ot += x.ot;
        });
        HEADERS = ["ID", "Worker", "Days", "Normal h", "OT h"];
        ROWS = Object.entries(agg).sort((a,b) => a[1].name.localeCompare(b[1].name))
          .map(([c, a]) => [c, a.name, a.days, a.nh.toFixed(1), a.ot.toFixed(1)]);
      } else {
        const agg = {};
        DATA.forEach(x => {
          if (!x.present) return;
          const a = agg[x.site] ??= { days: new Set(), workers: new Set(), nh: 0, ot: 0 };
          a.days.add(x.date); a.workers.add(x.worker_code); a.nh += x.nh; a.ot += x.ot;
        });
        HEADERS = ["Site", "Attendance days", "Workers", "Normal h", "OT h"];
        ROWS = Object.entries(agg).sort()
          .map(([s, a]) => [s, a.days.size, a.workers.size, a.nh.toFixed(1), a.ot.toFixed(1)]);
      }
      renderTable();
    }

    function downloadPdf() {
      if (!ROWS.length) { alert("Run a report first."); return; }
      vmmsDownloadPdf("tablebox", "VCMS_Report", { landscape: HEADERS.length > 6 });
    }

    function exportXlsx() {
      const ws = XLSX.utils.aoa_to_sheet([
        ["VCMS Report", "", "Generated: " + new Date().toLocaleString("en-SG")],
        [], HEADERS, ...ROWS]);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Report");
      XLSX.writeFile(wb, "VCMS_Report.xlsx");
    }

    document.getElementById("view").addEventListener("change", () => { if (DATA.length) render(); });
    document.getElementById("report-type").addEventListener("change",e=>{if(e.target.value==="monthly_timesheet"&&window.innerWidth>=900){location.href="timesheet.html";return;}const project=e.target.value!=="attendance";document.body.classList.toggle("project-report",project);document.getElementById("project-controls").classList.toggle("hidden",!project);document.querySelector(".report-attendance-row").classList.toggle("hidden",project);document.getElementById("wsearch").classList.toggle("hidden",project);});
    boot();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#C00000">
  <title>VMMS — Home</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>window.esc=window.esc||function(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});};window.VMMS_TIER=window.VMMS_TIER||{full:["admin","general_manager","operation_manager","hr_assistant"],manager:["main_sup","wshc_lead"],supervisor:["site_sup","safety_sup","wshc","logistics_sup"]};window.isFull=window.isFull||function(r){return VMMS_TIER.full.indexOf(r)!==-1};window.isManager=window.isManager||function(r){return VMMS_TIER.manager.indexOf(r)!==-1};window.isSupervisor=window.isSupervisor||function(r){return VMMS_TIER.supervisor.indexOf(r)!==-1};window.isCoordinator=window.isCoordinator||function(r){return isFull(r)||isManager(r)};</script>
  <style>
    /* ---- Icon-grid home (option B) ---- */
    body.grid-home { background: #F3F4F6; min-height: 100vh; }
    .panel { background:#fff; border:1px solid #E5E7EB; border-radius:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .app-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px 10px; }
    @media (min-width:640px){ .app-grid{ grid-template-columns:repeat(4,1fr); gap:20px 12px; } }
    @media (min-width:1024px){ .app-grid{ grid-template-columns:repeat(6,1fr); } }
    .app-tile { display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px;
                text-decoration:none; -webkit-tap-highlight-color:transparent; }
    .app-ico { width:60px; height:60px; border-radius:18px; display:flex; align-items:center; justify-content:center;
               box-shadow:0 5px 12px rgba(0,0,0,.14); transition:transform .14s ease, box-shadow .14s ease; }
    .app-tile:hover .app-ico { transform:translateY(-3px); box-shadow:0 10px 18px rgba(0,0,0,.2); }
    .app-tile:active .app-ico { transform:translateY(0); }
    .app-lbl { font-size:12.5px; color:#374151; line-height:1.25; max-width:82px; }
    .app-tile.locked { opacity:.4; }
    .app-tile.locked .app-lbl::after { content:""; }
  </style>
</head>
<body class="grid-home min-h-screen flex flex-col">

  <header class="bg-red-700 text-white p-4 shadow flex items-center justify-between md:px-8 sticky top-0 z-10">
    <div class="flex items-center gap-3">
      <img src="https://www.vortex.sg/images/Vortex-Logo_Type.png" alt="Vortex"
           class="h-9 bg-white rounded-lg p-1" onerror="this.style.display='none'">
      <div>
        <h1 class="text-xl font-bold">VMMS</h1>
        <p class="text-red-100 text-sm" id="who">Loading…</p>
      </div>
    </div>
    <button onclick="vmmsLogout()" class="bg-red-900 hover:bg-red-950 text-white text-sm font-bold px-4 py-2 rounded-lg mr-12">
      Log Out
    </button>
  </header>

  <main class="flex-1 p-4 max-w-md md:max-w-4xl mx-auto w-full">
    <div id="loading" class="text-center text-gray-500 mt-10">Checking your account…</div>

    <div id="content" class="hidden">
      <div class="panel p-5 mt-4">
        <p class="text-xl font-bold text-gray-900" id="greet">—</p>
        <p class="text-sm text-gray-500" id="name">—</p>
        <span id="role-chip" class="inline-block mt-2 text-xs font-bold px-3 py-1 rounded-full bg-red-700 text-white">—</span>
      </div>

      <div id="switcher" class="hidden panel p-3 mt-3 flex items-center gap-2">
        <span class="text-sm text-gray-600 whitespace-nowrap">Acting as:</span>
        <select id="viewrole" class="border border-gray-300 rounded-lg p-2 text-sm bg-white flex-1">
          <option value="admin">Administrator</option>
          <option value="general_manager">General Manager</option>
          <option value="operation_manager">Operation Manager</option>
          <option value="hr_assistant">HR Assistant</option>
          <option value="main_sup">Site Manager</option>
          <option value="wshc_lead">WSHC Lead</option>
          <option value="site_sup">Site Supervisor</option>
          <option value="safety_sup">Safety Supervisor</option>
          <option value="wshc">WSHC</option>
          <option value="logistics_sup">Logistics Supervisor</option>
          <option value="payroll">Payroll</option>
        </select>
      </div>

      <div class="mt-6 app-grid" id="menu"></div>
    </div>

    <div id="noprofile" class="hidden panel p-6 mt-10 text-center">
      <div class="text-4xl mb-3">⚠️</div>
      <p class="font-bold text-gray-800 mb-2">Login works, but no VMMS role is linked yet.</p>
      <p class="text-sm text-gray-500">Ask the administrator to link your account (Phase 3 guide, Step 3).</p>
      <button onclick="vmmsLogout()" class="mt-5 bg-red-700 text-white font-bold px-6 py-2 rounded-lg">Back to Login</button>
    </div>
  </main>

  <footer class="p-4 flex items-center justify-center text-xs text-gray-500">
    <span>Vortex Engineering Pte Ltd</span>
  </footer>

  <script>
    requireLogin();

    const ROLE_LABELS = {
      admin:"Administrator", general_manager:"General Manager", operation_manager:"Operation Manager",
      hr_assistant:"HR Assistant", main_sup:"Site Manager", wshc_lead:"WSHC Lead",
      site_sup:"Site Supervisor", safety_sup:"Safety Supervisor", wshc:"WSHC",
      logistics_sup:"Logistics Supervisor", payroll:"Payroll",
    };

    const ROLE_TIER = {
      admin:"full", general_manager:"full", operation_manager:"full", hr_assistant:"full",
      main_sup:"manager", wshc_lead:"manager",
      site_sup:"supervisor", safety_sup:"supervisor", wshc:"supervisor", logistics_sup:"supervisor",
      payroll:"payroll",
    };

    const TIER_MENU = {
      full: [["Workers", 4, "workers.html"], ["Sites", 5, "sites.html"], ["Daily Allocation", 6, "allocation.html"], ["Attendance", 7, "attendance.html"], ["End-Time Verification", 7, "verify.html"], ["WhatsApp Messages", 9, "whatsapp.html"], ["Dashboard", 10, "dashboard.html"], ["Reports", 11, "reports.html"], ["Monthly Timesheet", 11, "timesheet.html"], ["Users & Access", 3, "users.html"], ["Settings", 12, "settings.html"], ["How to Use", 1, "help.html"]],
      manager: [["Request Manpower (next day)", 6, "request.html"], ["Attendance", 7, "attendance.html"], ["End-Time Verification", 7, "verify.html"], ["WhatsApp (Site Update)", 9, "whatsapp.html"], ["Dashboard", 10, "dashboard.html"], ["Reports", 11, "reports.html"], ["Monthly Timesheet", 11, "timesheet.html"], ["Settings", 12, "settings.html"], ["How to Use", 1, "help.html"]],
      supervisor: [["Request Manpower (next day)", 6, "request.html"], ["My Site — Attendance", 7, "attendance.html"], ["WhatsApp Update", 9, "whatsapp.html"], ["Dashboard (my sites)", 10, "dashboard.html"], ["Reports (my sites)", 11, "reports.html"], ["How to Use", 1, "help.html"]],
      payroll: [["End-Time Verification", 7, "verify.html"], ["Reports", 11, "reports.html"], ["Monthly Timesheet", 11, "timesheet.html"], ["Monthly Man-Hours", 12, "manhours.html"], ["How to Use", 1, "help.html"]],
    };
    function menuFor(role) { return TIER_MENU[ROLE_TIER[role] || "supervisor"] || []; }
    const ALL_MENU = [["Workers", 4, "workers.html"], ["Sites", 5, "sites.html"], ["Daily Allocation", 6, "allocation.html"], ["Request Manpower", 6, "request.html"], ["Attendance", 7, "attendance.html"], ["End-Time Verification", 7, "verify.html"], ["WhatsApp Messages", 9, "whatsapp.html"], ["Dashboard", 10, "dashboard.html"], ["Reports", 11, "reports.html"], ["Monthly Timesheet", 11, "timesheet.html"], ["Monthly Man-Hours", 12, "manhours.html"], ["Users & Access", 3, "users.html"], ["Settings", 12, "settings.html"], ["How to Use", 1, "help.html"]];
    const DONE_PHASE = 12;
    let ALLOWED = null;

    // Short, tidy labels under each icon (full label kept as tooltip)
    const SHORT = {
      "Daily Allocation":"Allocation", "Request Manpower (next day)":"Request",
      "Request Manpower":"Request", "End-Time Verification":"End-Time",
      "WhatsApp Messages":"WhatsApp", "WhatsApp (Site Update)":"WhatsApp", "WhatsApp Update":"WhatsApp",
      "Monthly Timesheet":"Timesheet", "Monthly Man-Hours":"Man-Hours", "Users & Access":"Users",
      "My Site — Attendance":"Attendance", "Dashboard (my sites)":"Dashboard", "Reports (my sites)":"Reports",
    };

    // Icon colour per page (rounded app-tile background)
    const COLORS = {
      "workers.html":"#2563EB", "sites.html":"#4F46E5", "allocation.html":"#C00000",
      "request.html":"#C00000", "attendance.html":"#16A34A", "verify.html":"#0D9488",
      "whatsapp.html":"#059669", "dashboard.html":"#7C3AED", "reports.html":"#D97706",
      "timesheet.html":"#EA580C", "manhours.html":"#E11D48", "users.html":"#475569",
      "settings.html":"#6B7280", "help.html":"#0EA5E9",
    };
    // Inline SVG glyph per page (stroke = white, set on the <svg>)
    const ICONS = {
      "workers.html":'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3.3 2.7-5.2 5.5-5.2s5.5 1.9 5.5 5.2"/><circle cx="17.5" cy="9" r="2.3"/><path d="M16 14.8c2.4.2 4 2 4 4.2"/>',
      "sites.html":'<path d="M4 20V6l6-2 6 2v14"/><path d="M3 20h18"/><path d="M9 20v-4h2v4"/><path d="M7 9h.5M7 12h.5M13 9h.5M13 12h.5"/>',
      "allocation.html":'<rect x="6" y="4.5" width="12" height="15" rx="2"/><rect x="9" y="3" width="6" height="3" rx="1"/><path d="M9 10h6M9 13h6M9 16h4"/>',
      "request.html":'<rect x="6" y="4.5" width="12" height="15" rx="2"/><rect x="9" y="3" width="6" height="3" rx="1"/><path d="M12 9.5v5M9.5 12h5"/>',
      "attendance.html":'<circle cx="12" cy="12" r="8.5"/><path d="M8 12.5l2.5 2.5L16 9.5"/>',
      "verify.html":'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
      "whatsapp.html":'<path d="M20 12a8 8 0 01-11.6 7.1L4 20l.9-4.3A8 8 0 1120 12z"/>',
      "dashboard.html":'<path d="M5 20V11M10 20V5M15 20v-6M20 20v-9"/>',
      "reports.html":'<path d="M7 3.5h7l4 4V20.5H7z"/><path d="M14 3.5v4h4"/><path d="M9.5 12h5M9.5 15h5"/>',
      "timesheet.html":'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9.5h16M8.5 3v4M15.5 3v4"/>',
      "manhours.html":'<circle cx="12" cy="13" r="7"/><path d="M12 9.5V13l2.5 1.5"/><path d="M9.5 3.5h5"/>',
      "users.html":'<path d="M12 3.5l7 2.8v5.2c0 4.2-3 7-7 8.5-4-1.5-7-4.3-7-8.5V6.3z"/><path d="M9.5 12l1.8 1.8L15 10"/>',
      "settings.html":'<circle cx="12" cy="12" r="3"/><path d="M12 4v2.5M12 17.5V20M4 12h2.5M17.5 12H20M6.3 6.3l1.8 1.8M15.9 15.9l1.8 1.8M17.7 6.3l-1.8 1.8M8.1 15.9l-1.8 1.8"/>',
      "help.html":'<circle cx="12" cy="12" r="8.5"/><path d="M9.7 9.2a2.4 2.4 0 114.3 1.5c-.8.9-1.8 1.1-1.8 2.5"/><path d="M12 16.4h.01"/>',
      _default:'<circle cx="12" cy="12" r="8"/>',
    };

    function renderMenu(role) {
      const menu = document.getElementById("menu");
      menu.innerHTML = "";
      const src = ALLOWED
        ? ALL_MENU.filter(([l, p, pg]) => pg === "help.html" || ALLOWED.indexOf(pg) !== -1)
        : menuFor(role);
      src.forEach(([label, phase, page]) => {
        const unlocked = phase <= DONE_PHASE;
        const el = document.createElement(unlocked ? "a" : "div");
        if (unlocked) el.href = page;
        el.className = "app-tile" + (unlocked ? "" : " locked");
        el.title = label;
        const color = COLORS[page] || "#6B7280";
        const icon = ICONS[page] || ICONS._default;
        const short = SHORT[label] || label;
        el.innerHTML =
          `<span class="app-ico" style="background:${color}">
             <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icon}</svg>
           </span>
           <span class="app-lbl">${esc(short)}</span>`;
        menu.appendChild(el);
      });
    }

    async function load() {
      try {
        const r = await vmmsApi("/api/v1/me");
        if (r.status === 403) {
          document.getElementById("loading").classList.add("hidden");
          document.getElementById("noprofile").classList.remove("hidden");
          return;
        }
        if (!r.ok) throw new Error("NOT_SIGNED_IN");
        const me = await r.json();

        document.getElementById("who").textContent = me.email || "";
        const hr = new Date().getHours();
        const greet = hr < 12 ? "Good morning" : (hr < 17 ? "Good afternoon" : "Good evening");
        const first = (me.name || "").trim().split(/\s+/)[0] || "";
        document.getElementById("greet").textContent = `${greet}, ${first}`;
        document.getElementById("name").textContent = me.name;
        document.getElementById("role-chip").textContent = ROLE_LABELS[me.role] || me.role;

        let viewRole = me.role;
        if (me.role === "admin") {
          viewRole = localStorage.getItem("vmms_view_role") || "admin";
          const sw = document.getElementById("switcher");
          const sel = document.getElementById("viewrole");
          sel.value = viewRole;
          sw.classList.remove("hidden");
          sel.addEventListener("change", () => {
            localStorage.setItem("vmms_view_role", sel.value);
            renderMenu(sel.value);
          });
        }
        renderMenu(viewRole);

        document.getElementById("loading").classList.add("hidden");
        document.getElementById("content").classList.remove("hidden");
      } catch (ex) {
        vmmsLogout();
      }
    }
    load();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>

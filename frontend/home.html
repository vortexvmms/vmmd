<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#C00000">
  <title>VCMS — Home</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>window.esc=window.esc||function(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});};window.VMMS_TIER=window.VMMS_TIER||{full:["admin","general_manager","operation_manager","hr_assistant"],manager:["main_sup","wshc_lead"],supervisor:["site_sup","safety_sup","wshc","logistics_sup"]};window.isFull=window.isFull||function(r){return VMMS_TIER.full.indexOf(r)!==-1};window.isCoordinator=window.isCoordinator||function(r){return isFull(r)||["main_sup","wshc_lead"].indexOf(r)!==-1};</script>
  <style>
    :root{ --brand:#C00000; --brand2:#A50E0E; --ink:#1F2328; --muted:#6B7280; --line:#E5E7EB; --bg:#E4E7EC; }
    body.shell{ margin:0; background:var(--bg); color:var(--ink); font-family:Arial,system-ui,sans-serif; }
    /* full-width brand header */
    .brand{ height:60px; background:var(--brand); color:#fff; display:flex; align-items:center; gap:14px; padding:0 64px 0 12px; position:sticky; top:0; z-index:50; }
    .brand .logo{ height:40px; width:auto; background:#fff; border-radius:8px; padding:3px; flex:none; }
    .brand .bt{ font-size:22px; font-weight:800; letter-spacing:.02em; }
    .brand-center{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:17px; font-weight:800; color:#fff; white-space:nowrap; pointer-events:none; }
    @media(max-width:1300px){ .brand-center{ display:none; } }
    .brand .grow{ flex:1; }
    .hsearch{ position:relative; }
    .hsearch input{ border:none; border-radius:10px; height:40px; box-sizing:border-box; padding:0 12px 0 32px; font-size:13px; width:190px; background:#fff; color:#111; }
    .hsearch svg{ position:absolute; left:10px; top:12px; width:15px; height:15px; color:#9CA3AF; }
    .hres{ position:absolute; top:40px; left:0; right:0; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.2); overflow:hidden; display:none; z-index:60; }
    .hres a{ display:block; padding:9px 12px; font-size:13px; color:#334155; text-decoration:none; } .hres a:hover{ background:#F3F4F6; }
    .gcard{ background:#fff; color:#111; border-radius:10px; height:40px; box-sizing:border-box; padding:0 8px 0 14px; display:flex; align-items:center; gap:10px; max-width:340px; }
    .gcard .g1{ font-weight:800; font-size:14.5px; line-height:1.1; white-space:nowrap; } .gcard .g2{ font-size:11.5px; color:#6B7280; white-space:nowrap; }
    .gcard .chip{ background:var(--brand); color:#fff; font-size:11px; font-weight:700; padding:3px 11px; border-radius:20px; white-space:nowrap; }
    .rswitch{ border:none; border-radius:8px; padding:7px 9px; font-size:12px; font-weight:700; background:#fff; color:#111; }
    .logout{ background:var(--brand2); color:#fff; border:none; border-radius:9px; padding:8px 15px; font-weight:700; font-size:13px; cursor:pointer; flex:none; }
    .burger{ display:none; background:none; border:none; font-size:22px; color:#fff; cursor:pointer; }
    /* layout below header */
    .layout{ display:flex; }
    .side{ width:236px; flex:none; background:#fff; border-right:1px solid var(--line); display:flex; flex-direction:column; position:sticky; top:60px; height:calc(100vh - 60px); }
    .nav{ flex:1; overflow:auto; padding:8px 10px 16px; }
    .nav .grp{ font-size:10.5px; font-weight:700; color:#9AA1AB; letter-spacing:.06em; text-transform:uppercase; padding:13px 8px 5px; }
    .nav a{ display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:10px; color:#3A3D42; font-size:14px; text-decoration:none; margin:1px 0; transition:transform .14s ease, box-shadow .14s ease, background .14s ease; }
    .nav a:hover{ background:#F6F7F9; transform:translateX(3px); box-shadow:0 4px 12px rgba(0,0,0,.07); }
    .nav a.on{ background:#FDE8E8; color:var(--brand); font-weight:700; } .nav a.on:hover{ background:#FBDCDC; } .nav a svg{ width:19px; height:19px; flex:none; }
    .main{ flex:1; min-width:0; }
    .content{ padding:18px; width:100%; }
    .home-wrap{ display:grid; grid-template-columns:1fr 320px; gap:16px; max-width:1320px; margin:0 auto; }
    .SECT{ font-size:12px; color:#8A92A0; font-weight:700; letter-spacing:.04em; margin:2px 2px 8px; }
    .kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    .kpi{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 15px; text-decoration:none; color:inherit; display:block; transition:transform .14s ease, box-shadow .14s ease; }
    .kpi:hover{ transform:translateY(-2px); box-shadow:0 8px 18px rgba(0,0,0,.09); }
    .kpi .ico{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:#fff; margin-bottom:8px; } .kpi .ico svg{ width:18px; height:18px; }
    .kpi .n{ font-size:26px; font-weight:800; } .kpi .l{ font-size:12.5px; color:#475569; } .kpi .d{ font-size:11px; color:#9CA3AF; margin-top:4px; }
    .updates{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
    .upd{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; }
    .upd h4{ margin:0 0 10px; font-size:13px; font-weight:800; }
    .pill{ font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px; margin-right:6px; } .p-pend{ background:#FEF3C7; color:#92400E; } .p-done{ background:#DCFCE7; color:#166534; }
    .rbtn{ font-size:12px; font-weight:700; border-radius:8px; padding:7px 12px; cursor:pointer; border:none; }
    .panel{ background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
    table.dt{ width:100%; font-size:13px; border-collapse:collapse; } table.dt th{ font-size:11px; text-transform:uppercase; color:#64748B; background:#F8FAFC; padding:9px 12px; text-align:left; } table.dt td{ padding:9px 12px; border-top:1px solid #F1F5F9; } .dt .r{ text-align:right; }
    .tasks{ background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; position:sticky; top:76px; align-self:start; }
    .tasks .th{ background:var(--brand); color:#fff; font-weight:800; font-size:15px; padding:13px 15px; display:flex; align-items:center; justify-content:space-between; }
    .tasks .tb{ padding:12px 14px; }
    .tsec{ font-size:11px; font-weight:700; color:#9AA1AB; text-transform:uppercase; letter-spacing:.04em; margin:10px 0 5px; }
    .titem{ display:flex; gap:8px; align-items:flex-start; font-size:13px; padding:4px 0; } .titem .dot{ width:8px; height:8px; border-radius:50%; margin-top:5px; flex:none; }
    .tbtn{ display:block; text-align:center; background:#111827; color:#fff; text-decoration:none; font-weight:700; font-size:13px; padding:10px; border-radius:10px; margin-top:12px; }
    .backdrop{ display:none; } .mgreet{ display:none; }
    .mnav{ display:none; }
    .mnav .msec{ font-size:11px; font-weight:800; color:#9AA1AB; text-transform:uppercase; letter-spacing:.05em; margin:16px 2px 8px; }
    .mnav .mgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .mnav a{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 6px; text-align:center; text-decoration:none; color:#3A3D42; font-size:12px; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:7px; }
    .mnav a:active{ background:#FDE8E8; } .mnav a svg{ width:23px; height:23px; color:var(--brand); }
    .mrswitch{ display:none; }
    @media (max-width:1000px){ .home-wrap{ grid-template-columns:1fr; } .tasks{ position:static; } }
    @media (max-width:900px){
      .side{ display:none !important; } .burger{ display:none !important; }
      .brand{ padding:0 52px 0 12px; gap:9px; height:54px; } .brand .logo{ height:32px; } .brand .bt{ font-size:19px; }
      .hsearch{ display:none; } .gcard{ display:none; } #rswitch{ display:none !important; } .logout{ padding:7px 12px; }
      .mgreet{ display:block; } .mnav{ display:block; margin-bottom:6px; } .mrswitch{ display:block; }
      .kpis{ grid-template-columns:repeat(2,1fr); } .updates{ grid-template-columns:1fr; } .content{ padding:13px; }
      .home-wrap{ gap:12px; }
    }
  </style>
</head>
<body class="shell">
  <div class="backdrop" onclick="toggleNav(false)"></div>

  <header class="brand">
    <button class="burger" onclick="toggleNav(true)" aria-label="Menu">☰</button>
    <img class="logo" src="https://www.vortex.sg/images/Vortex-Logo_Type.png" onerror="this.style.display='none'">
    <div class="bt">VCMS</div>
    <div class="brand-center">Vortex Construction Management System</div>
    <div class="grow"></div>
    <div class="gcard">
      <div><div class="g1" id="greet">—</div><div class="g2" id="fullname"></div></div>
      <span class="chip" id="rolechip">—</span>
    </div>
    <select id="rswitch" class="rswitch" style="display:none" onchange="onRoleSwitch()"></select>
    <button class="logout" onclick="vmmsLogout()">Log Out</button>
  </header>

  <div class="layout">
    <aside class="side" id="side"><nav class="nav" id="nav"></nav></aside>
    <div class="main">
      <div class="content">
        <div class="home-wrap">
          <div>
            <div class="mgreet" style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:12px">
              <div style="font-size:19px;font-weight:800" id="mgreet">—</div>
              <div style="font-size:12.5px;color:#6B7280" id="mfull"></div>
              <div style="margin-top:7px"><span class="chip" id="mchip"></span></div>
              <select id="mrswitch" class="mrswitch" onchange="onRoleSwitch(this.value)" style="margin-top:10px;width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;font-size:13px;font-weight:700;background:#fff;color:#111"></select>
            </div>
            <div class="mnav" id="mnav"></div>
            <div class="SECT" id="subgreet"></div>
            <div class="kpis" id="kpis"></div>
            <div class="SECT" style="margin-top:18px">UPDATES FOR THIS DAY</div>
            <div class="updates">
              <div class="upd"><h4>🌅 Morning · attendance</h4>
                <div><span class="pill p-pend">PENDING</span><span id="m-pend" style="font-size:12.5px;color:#374151"></span></div>
                <div style="margin-top:8px"><span class="pill p-done">DONE</span><span id="m-done" style="font-size:12.5px;color:#374151"></span></div>
                <div id="m-remind" class="hidden" style="display:flex;gap:8px;margin-top:10px"><button class="rbtn" style="background:#111827;color:#fff" onclick="copyReminder('morning')">Copy reminder</button><button class="rbtn" style="background:#16A34A;color:#fff" onclick="shareReminder('morning')">Share to WhatsApp</button></div>
              </div>
              <div class="upd"><h4>🌙 Evening · end times</h4>
                <div><span class="pill p-pend">PENDING</span><span id="e-pend" style="font-size:12.5px;color:#374151"></span></div>
                <div style="margin-top:8px"><span class="pill p-done">DONE</span><span id="e-done" style="font-size:12.5px;color:#374151"></span></div>
                <div id="e-remind" class="hidden" style="display:flex;gap:8px;margin-top:10px"><button class="rbtn" style="background:#111827;color:#fff" onclick="copyReminder('evening')">Copy reminder</button><button class="rbtn" style="background:#16A34A;color:#fff" onclick="shareReminder('evening')">Share to WhatsApp</button></div>
              </div>
            </div>
            <div class="SECT" style="margin-top:18px">SITE SUMMARY · MONTH TO DATE</div>
            <div class="panel" style="overflow:auto">
              <table class="dt"><thead><tr><th>Site</th><th class="r">On day</th><th class="r">Normal h</th><th class="r">OT h</th></tr></thead><tbody id="sites"></tbody><tfoot id="sites-foot"></tfoot></table>
            </div>
          </div>
          <div class="tasks">
            <div class="th">Today tasks for you<a href="todo.html" style="color:#fff;font-size:12px;font-weight:700;text-decoration:none;opacity:.9">Edit ›</a></div>
            <div class="tb" id="tasks-body"><p style="color:#9CA3AF;font-size:13px">Loading…</p></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    requireLogin();
    function toggleNav(on){ document.body.classList.toggle("navopen", on); }
    function fmtDMY(iso){ if(!iso) return ""; const p=String(iso).split("-"); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:iso; }
    const ROLE_LABELS={admin:"Administrator",general_manager:"General Manager",operation_manager:"Operation Manager",hr_assistant:"HR Assistant",main_sup:"Site Manager",wshc_lead:"WSHC Lead",site_sup:"Site Supervisor",safety_sup:"Safety Supervisor",wshc:"WSHC",logistics_sup:"Logistics Supervisor",payroll:"Payroll"};
    const TIER={admin:"full",general_manager:"full",operation_manager:"full",hr_assistant:"full",main_sup:"manager",wshc_lead:"manager",site_sup:"supervisor",safety_sup:"supervisor",wshc:"supervisor",logistics_sup:"supervisor",payroll:"payroll"};
    const IC={home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',check:'<circle cx="12" cy="12" r="8.5"/><path d="M8 12.5l2.5 2.5L16 9.5"/>',user:'<circle cx="9" cy="8" r="3"/><path d="M3.5 20c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/>',bld:'<path d="M4 20V6l6-2 6 2v14M3 20h18"/>',cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9.5h16M8.5 3v4M15.5 3v4"/>',clk:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',grid:'<rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M3.5 9h17M9 9v10.5M14.5 9v10.5"/>',doc:'<path d="M7 3.5h8l3.5 3.5V20.5H7z"/><path d="M9.5 12h5M9.5 15h5"/>',list:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 12.5h8M8 16h5"/>',chart:'<path d="M5 20V11M10 20V5M15 20v-8M20 20v-5"/>',cart:'<path d="M6 6h13l-1.5 8H8z"/><circle cx="9" cy="19" r="1.3"/><circle cx="16" cy="19" r="1.3"/>',chat:'<path d="M20 12a8 8 0 01-11.6 7.1L4 20l.9-4.3A8 8 0 1120 12z"/>',shield:'<path d="M12 3.5l7 2.8v5.2c0 4.2-3 7-7 8.5-4-1.5-7-4.3-7-8.5V6.3z"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 4v2.5M12 17.5V20M4 12h2.5M17.5 12H20"/>',help:'<circle cx="12" cy="12" r="8.5"/><path d="M9.7 9.2a2.4 2.4 0 114.3 1.5c-.8.9-1.8 1.1-1.8 2.5"/><path d="M12 16.4h.01"/>'};
    function navFor(role){
      const t=TIER[role]||"full";
      if(t==="supervisor") return [
        { items:[["Home","home.html","home"],["To-do","todo.html","check"]] },
        { grp:"Daily", items:[["Request manpower","request.html","cal"],["Attendance","attendance.html","chk"],["WhatsApp","whatsapp.html","chat"]] },
        { grp:"Site progress", items:[["Daily report","dpr.html","doc"],["DPR history","dprlist.html","list"],["Dashboard","dashboard.html","chart"],["Reports","reports.html","doc"]] },
        { grp:"Procurement", items:[["New PR","pr-new.html","cart"]] },
        { grp:"More", items:[["Settings","settings.html","gear"],["How to use","help.html","help"]] } ];
      return [
        { items:[["Home","home.html","home"],["To-do","todo.html","check"]] },
        { grp:"Manpower", items:[["Workers","workers.html","user"],["Sites","sites.html","bld"],["Allocation","allocation.html","cal"],["Attendance","attendance.html","chk"],["End-time","verify.html","clk"],["Timesheet","timesheet.html","grid"],["Dashboard","dashboard.html","chart"]] },
        { grp:"Site progress", items:[["Daily report","dpr.html","doc"],["DPR history","dprlist.html","list"],["Resource summary","resource-summary.html","grid"],["Site board","site-dashboard.html","chart"],["Reports","reports.html","doc"]] },
        { grp:"Procurement", items:[["PR directory","pr-directory.html","list"],["New PR","pr-new.html","cart"],["PR board","pr-dashboard.html","chart"]] },
        { grp:"More", items:[["WhatsApp","whatsapp.html","chat"],["Users","users.html","shield"],["Settings","settings.html","gear"],["How to use","help.html","help"]] } ];
    }
    let NAVITEMS=[];
    function renderNav(role){
      const cur=location.pathname.split("/").pop()||"home.html";
      const nav=navFor(role); NAVITEMS=[];
      nav.forEach(s=>s.items.forEach(it=>NAVITEMS.push(it)));
      document.getElementById("nav").innerHTML=nav.map(s=>(s.grp?`<div class="grp">${s.grp}</div>`:"")+s.items.map(([l,h,ic])=>`<a href="${h}" class="${h===cur?"on":""}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[ic]||IC.home}</svg>${esc(l)}</a>`).join("")).join("");
      renderMobileMenu(role);
    }
    /* mobile home menu — grouped into 3 sections (like old layout) */
    function mobileSections(role){
      const nav=navFor(role);
      const labeled=nav.slice(1);                          // skip Home/To-do row
      const todo=nav[0].items.filter(it=>it[1]!=="home.html");
      const s1={ name:labeled[0].grp, items:[...labeled[0].items, ...todo] };
      const s2=labeled[1]?{ name:labeled[1].grp, items:[...labeled[1].items] }:{ name:"", items:[] };
      const rest=labeled.slice(2);
      const s3={ name:rest.map(g=>g.grp).join(" & ")||"More", items:[].concat(...rest.map(g=>g.items)) };
      return [s1,s2,s3].filter(s=>s.items.length);
    }
    function renderMobileMenu(role){
      const mn=document.getElementById("mnav"); if(!mn) return;
      mn.innerHTML=mobileSections(role).map(s=>
        `<div class="msec">${esc(s.name)}</div><div class="mgrid">`+
        s.items.map(([l,h,ic])=>`<a href="${h}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[ic]||IC.home}</svg>${esc(l)}</a>`).join("")+
        `</div>`).join("");
    }
    /* header search — quick jump across nav pages */
    function onSearch(){
      const q=document.getElementById("hsearch").value.trim().toLowerCase();
      const box=document.getElementById("hres");
      if(!q){ box.style.display="none"; return; }
      const m=NAVITEMS.filter(it=>it[0].toLowerCase().includes(q)).slice(0,8);
      box.innerHTML=m.map(it=>`<a href="${it[1]}">${esc(it[0])}</a>`).join("")||'<a style="color:#9CA3AF">No match</a>';
      box.style.display="block";
    }
    function goFirst(){ if(NAVITEMS.length){ const q=document.getElementById("hsearch").value.trim().toLowerCase(); const m=NAVITEMS.find(it=>it[0].toLowerCase().includes(q)); if(m) location.href=m[1]; } }

    function kcard(label,val,color,icon){ return `<a class="kpi" href="dashboard.html"><span class="ico" style="background:${color}"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icon}</svg></span><div class="n">${val}</div><div class="l">${label}</div><div class="d">tap for details ›</div></a>`; }
    const KI={u:'<circle cx="9" cy="8" r="3"/><path d="M3.5 20c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/>',lv:'<path d="M20 8s-4 0-8 4M4 20c6-2 8-6 8-8"/>',st:'<path d="M4 20V6l6-2 6 2v14M3 20h18"/>',cl:'<rect x="6" y="4.5" width="12" height="15" rx="2"/><path d="M9 10h6M9 13h6"/>',med:'<rect x="5" y="8" width="14" height="12" rx="2"/><path d="M12 11v6M9 14h6M9 4h6v4H9z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/>',mn:'<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>',ck:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',bo:'<path d="M13 3L4 14h6l-1 7 9-11h-6z"/>',sg:'<path d="M4 6h16M4 6l6 6-6 6h16"/>'};

    let MPEND=[], EPEND=[], RDATE="", ME=null;
    function reminderText(stage){ const arr=stage==="morning"?MPEND:EPEND; const head=stage==="morning"?"*MORNING ATTENDANCE REMINDER*":"*END TIME REMINDER*"; const ask=stage==="morning"?"These sites have NOT marked morning attendance. Please mark present / absent:":"These sites have NOT submitted end times. Please submit:"; const lines=[head,"*"+fmtDMY(RDATE)+"*","",ask]; arr.forEach((s,i)=>lines.push(`${i+1}. ${s}`)); return lines.join("\n"); }
    function copyReminder(stage){ const t=reminderText(stage); (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert("Reminder copied — paste it in the group")).catch(()=>window.prompt("Copy this reminder:",t)); }
    function shareReminder(stage){ window.open("https://wa.me/?text="+encodeURIComponent(reminderText(stage)),"_blank"); }

    function onRoleSwitch(v){ v=v||(document.getElementById("rswitch")||{}).value; try{ localStorage.setItem("vmms_view_role",v);}catch(e){} const d=document.getElementById("rswitch"); if(d) d.value=v; const m=document.getElementById("mrswitch"); if(m) m.value=v; renderNav(v); }

    async function boot(){
      const r=await vmmsApi("/api/v1/me"); if(!r.ok){ vmmsLogout(); return; }
      ME=await r.json();
      let viewRole=ME.role;
      const msel=document.getElementById("mrswitch");
      if(ME.role==="admin"){
        const opts=Object.keys(ROLE_LABELS).map(k=>`<option value="${k}">Acting as: ${ROLE_LABELS[k]}</option>`).join("");
        const sel=document.getElementById("rswitch");
        sel.innerHTML=opts; msel.innerHTML=opts;
        try{ viewRole=localStorage.getItem("vmms_view_role")||"admin"; }catch(e){}
        sel.value=viewRole; sel.style.display="inline-block";
        msel.value=viewRole;
      } else { msel.style.display="none"; }
      renderNav(viewRole);
      const first=(ME.name||"").trim().split(/\s+/)[0]||"";
      const hr=new Date().getHours(); const g=hr<12?"Good morning":(hr<17?"Good afternoon":"Good evening");
      document.getElementById("greet").textContent=g;
      document.getElementById("fullname").textContent=ME.name||"";
      document.getElementById("rolechip").textContent=ROLE_LABELS[ME.role]||ME.role;
      document.getElementById("mgreet").textContent=g;
      document.getElementById("mfull").textContent=ME.name||"";
      document.getElementById("mchip").textContent=ROLE_LABELS[ME.role]||ME.role;
      document.getElementById("subgreet").textContent=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short",year:"numeric"}).toUpperCase()+" · YOUR SITE OVERVIEW";
      loadTasks();

      const dr=await vmmsApi("/api/v1/dashboard?date="+new Date().toISOString().slice(0,10));
      if(dr.ok){
        const d=await dr.json();
        const mt=(Number(d.month_normal_hours||0)+Number(d.month_ot_hours||0)).toFixed(1);
        let c="";
        if(!d.scoped){ c+=kcard("Active workers",d.total_workers,"#2563EB",KI.u); c+=kcard("On leave",d.on_leave,"#D97706",KI.lv); }
        c+=kcard(d.scoped?"My sites":"Active sites",d.total_sites,"#4F46E5",KI.st);
        c+=kcard("Allocated this day",d.today_allocated,"#C00000",KI.cl);
        c+=kcard("MC this day",d.today_mc??0,"#CA8A04",KI.med);
        c+=kcard("AL this day",d.today_al??0,"#0284C7",KI.sun);
        c+=kcard("UL this day",d.today_ul??0,"#EA580C",KI.mn);
        c+=kcard("Month normal hours",d.month_normal_hours,"#059669",KI.ck);
        c+=kcard("Month OT hours",d.month_ot_hours,"#E11D48",KI.bo);
        c+=kcard("Total man-hours (month)",mt,"#0D9488",KI.sg);
        document.getElementById("kpis").innerHTML=c;
        const nl=x=>x.toUpperCase()!=="HOME LEAVE";
        const mp=(d.morning_pending||[]).filter(nl), md=(d.morning_completed||[]).filter(nl);
        const ep=(d.evening_pending||d.pending_updates||[]).filter(nl), ed=(d.evening_completed||d.completed_updates||[]).filter(nl);
        document.getElementById("m-pend").textContent=mp.length?mp.join(", "):"None — all marked ✓";
        document.getElementById("m-done").textContent=md.length?md.join(", "):"None yet";
        document.getElementById("e-pend").textContent=ep.length?ep.join(", "):"None — all submitted ✓";
        document.getElementById("e-done").textContent=ed.length?ed.join(", "):"None yet";
        MPEND=mp; EPEND=ep; RDATE=d.date;
        const canR=isCoordinator(ME.role);
        document.getElementById("m-remind").classList.toggle("hidden", !(canR&&mp.length));
        document.getElementById("e-remind").classList.toggle("hidden", !(canR&&ep.length));
        const ss=d.site_summary||[];
        document.getElementById("sites").innerHTML=ss.map(s=>`<tr><td style="font-weight:600;color:#111827">${esc(s.site_name)}</td><td class="r">${s.today}</td><td class="r">${s.month_nh}</td><td class="r" style="${s.month_ot>0?'color:#A32D2D;font-weight:700':''}">${s.month_ot}</td></tr>`).join("");
        const tDay=ss.reduce((a,s)=>a+s.today,0), tNh=ss.reduce((a,s)=>a+s.month_nh,0), tOt=ss.reduce((a,s)=>a+s.month_ot,0);
        document.getElementById("sites-foot").innerHTML=`<tr style="font-weight:800;background:#F8FAFC"><td>Total</td><td class="r">${tDay}</td><td class="r">${Math.round(tNh*10)/10}</td><td class="r">${Math.round(tOt*10)/10}</td></tr>`;
      } else { document.getElementById("kpis").innerHTML='<p style="color:#9CA3AF">Manpower dashboard unavailable.</p>'; }
    }
    async function loadTasks(){
      const r=await vmmsApi("/api/v1/todos"); const todos=r.ok?await r.json():[];
      const open=todos.filter(t=>!t.done);
      const groups=[["q1","Do first","#C00000"],["q2","Schedule","#2563EB"],["q3","Delegate","#D97706"]];
      let html="";
      groups.forEach(([q,name,c])=>{ const items=open.filter(t=>(t.quadrant||"inbox")===q); if(!items.length) return; html+=`<div class="tsec">${name}</div>`+items.map(t=>`<div class="titem"><span class="dot" style="background:${c}"></span><span>${esc(t.text)}</span></div>`).join(""); });
      const inbox=open.filter(t=>(t.quadrant||"inbox")==="inbox");
      if(inbox.length) html+=`<div class="tsec">To sort</div>`+inbox.map(t=>`<div class="titem"><span class="dot" style="background:#9CA3AF"></span><span>${esc(t.text)}</span></div>`).join("");
      if(!open.length) html=`<p style="color:#9CA3AF;font-size:13px">No tasks yet. Plan your day in the to-do board.</p>`;
      document.getElementById("tasks-body").innerHTML=html+`<a class="tbtn" href="todo.html">Open to-do board</a>`;
    }
    boot();
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>

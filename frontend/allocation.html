<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#C00000">
  <title>VCMS — Daily Allocation</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/core-bundle.js?v=20260904-history1"></script>
  <script src="js/auth.js?v=20260813-8"></script><script src="js/ui.js?v=20260825-ui5"></script>
  <script>window.esc=window.esc||function(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});};window.VMMS_TIER=window.VMMS_TIER||{full:["admin","general_manager","operation_manager","hr_assistant"],manager:["main_sup","wshc_lead"],supervisor:["site_sup","safety_sup","wshc","logistics_sup"]};window.isFull=window.isFull||function(r){return VMMS_TIER.full.indexOf(r)!==-1};window.isManager=window.isManager||function(r){return VMMS_TIER.manager.indexOf(r)!==-1};window.isSupervisor=window.isSupervisor||function(r){return VMMS_TIER.supervisor.indexOf(r)!==-1};window.isCoordinator=window.isCoordinator||function(r){return isFull(r)||isManager(r)};</script>
  <style>
    .alloc-kpis,.alloc-side{display:none}
    .copy-controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:end}
    .copy-date{display:block;width:100%;height:48px;min-height:48px;margin-top:6px;padding:0 12px;box-sizing:border-box;border:1px solid #d6b96b;border-radius:10px;background:#fff;color:#111827;font-size:16px;font-weight:700;text-align:center;-webkit-appearance:none;appearance:none}
    .copy-action{width:100%;height:48px;min-height:48px;padding:0 12px;border:0;border-radius:10px;background:#252b35;color:#fff;font-size:15px;font-weight:800;white-space:nowrap;box-shadow:0 3px 8px rgba(15,23,42,.14)}
    .copy-action:active{transform:translateY(1px)}
    @media(max-width:430px){.copy-controls{grid-template-columns:1fr}.copy-action{margin-top:0}}
    @media(min-width:900px){
      body{background:linear-gradient(135deg,#eef1f5,#e4e8ef)}
      body>header>div{max-width:none!important;width:100%!important}
      #alloc-main{max-width:none!important;width:100%;padding:20px 24px 92px}
      .alloc-kpis{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px;margin-bottom:14px}
      .alloc-kpi{background:#fff;border:1px solid #dce1e8;border-top:3px solid #c00000;border-radius:12px;padding:12px 14px;box-shadow:0 4px 12px rgba(15,23,42,.06);transition:.18s}
      .alloc-kpi:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(15,23,42,.11)}
      .alloc-kpi b{display:block;font-size:23px;color:#171b23}.alloc-kpi span{font-size:11px;font-weight:800;color:#687386;text-transform:uppercase;letter-spacing:.04em}
      .alloc-workspace{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start}
      .alloc-centre{min-width:0}
      .alloc-side{display:block;position:sticky;top:76px;background:#fff;border:1px solid #dce1e8;border-radius:14px;overflow:hidden;box-shadow:0 8px 20px rgba(15,23,42,.08)}
      .alloc-side h2{background:#252b35;color:#fff;padding:13px 15px;font-size:14px;font-weight:800}
      #alloc-exceptions{padding:8px 14px 14px}.alloc-ex{padding:10px 0;border-bottom:1px solid #edf0f4;font-size:12px;color:#4b5563}.alloc-ex:last-child{border:0}.alloc-ex b{display:block;color:#202631;margin-bottom:2px}
      #list{grid-template-columns:repeat(3,minmax(0,1fr))!important}
      body>div.fixed.bottom-0>div{max-width:none!important;padding-left:24px;padding-right:24px}
    }
    @media(min-width:1500px){.alloc-workspace{grid-template-columns:minmax(0,1fr) 330px}#list{grid-template-columns:repeat(4,minmax(0,1fr))!important}}
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <header class="vcms-page-header">
    <div class="vcms-page-header__row max-w-6xl mx-auto w-full">
      <a href="home.html" class="vcms-page-header__back" aria-label="Back to home">‹</a>
      <div class="vcms-page-header__title">
        <h1>Daily Allocation</h1>
        <p id="summary">Loading…</p>
      </div>
    </div>

    <!-- View toggle -->
    <div class="vcms-segmented mx-4 md:mx-6 max-w-6xl md:mx-auto" id="allocation-tabs">
      <button id="tab-requests" onclick="setMode('requests')"
              class="flex-1 rounded-lg py-2 text-sm font-bold">Requests</button>
      <button id="tab-worker" onclick="setMode('worker')"
              class="flex-1 rounded-lg py-2 text-sm font-bold">By Worker</button>
      <button id="tab-site" onclick="setMode('site')"
              class="flex-1 rounded-lg py-2 text-sm font-bold">By Site</button>
    </div>

    <div class="vcms-page-toolbar max-w-6xl mx-auto w-full mt-2">
      <input id="date" type="date"
             class="vcms-control">
      <select id="site" class="hidden vcms-control"></select>
    </div>
  </header>

  <main id="alloc-main" class="vcms-supervisor-main flex-1 max-w-md md:max-w-6xl">
    <div id="alloc-kpis" class="alloc-kpis"></div>
    <div class="alloc-workspace"><div class="alloc-centre">
    <!-- Primary day status remains first; Admin recovery tools are secondary. -->
    <div id="statusbar" class="hidden rounded-lg shadow-sm p-3 mb-3 text-sm font-bold text-center"></div>

    <!-- Undo copy / clear the whole day (for light days like Sunday) -->
    <div id="clearbar" class="hidden text-center mb-3">
      <button onclick="clearDay()" class="text-xs font-bold text-red-700 border border-red-300 hover:bg-red-50 rounded-lg px-3 py-2">↺ Undo copy / Clear this day</button>
    </div>

    <details id="copybar" class="hidden bg-amber-50 border border-amber-300 rounded-xl shadow-sm p-3 mb-3">
      <summary class="text-sm font-bold text-amber-900 cursor-pointer">Admin tool · Copy a previous allocation</summary>
      <p class="text-xs text-amber-800 mt-2 mb-2">Existing allocations stay unchanged. Only active, currently unallocated workers are added.</p>
      <div class="copy-controls">
        <label class="text-xs font-bold text-amber-900">Copy from date
          <input id="copyfrom" type="date" class="copy-date">
        </label>
        <button onclick="copyDay()" class="copy-action">Copy and merge</button>
      </div>
    </details>

    <div id="filterbar" class="flex flex-wrap items-center gap-2 mb-3">
      <input id="search" type="search" placeholder="Search worker…"
             class="w-full md:flex-1 md:min-w-[200px] border border-gray-300 rounded-lg p-3 text-base focus:outline-none focus:ring-2 focus:ring-red-600">
      <button id="f-unalloc" type="button" onclick="toggleFilter('unalloc')"
              class="filt border border-gray-300 text-gray-700 text-sm font-bold px-3 py-2 rounded-full whitespace-nowrap">Unallocated only</button>
      <button id="f-multi" type="button" onclick="toggleFilter('multi')"
              class="filt border border-gray-300 text-gray-700 text-sm font-bold px-3 py-2 rounded-full whitespace-nowrap">Requested by 2+ sites</button>
      <button id="f-allochere" type="button" onclick="toggleFilter('allochere')"
              class="filt hidden border border-gray-300 text-gray-700 text-sm font-bold px-3 py-2 rounded-full whitespace-nowrap">Allocated to this site</button>
    </div>

    <div id="list" class="space-y-2 md:space-y-0 md:grid md:grid-cols-2 lg:grid-cols-3 md:gap-2"></div>
    <p id="empty" class="hidden text-center text-gray-400 mt-10">No workers.</p>
    </div><aside class="alloc-side"><h2>Allocation exceptions</h2><div id="alloc-exceptions"></div></aside></div>
  </main>

  <div class="vcms-mobile-actions">
    <div class="vcms-mobile-actions__inner max-w-md md:max-w-6xl">
      <p class="text-sm text-gray-600 flex-1" id="selcount">0 selected</p>
      <button id="save" onclick="save()" class="vcms-btn vcms-btn-primary">
        Save All
      </button>
    </div>
  </div>

  <div id="toast" class="vcms-toast hidden"></div>

  <script>
    requireLogin();

    let ME = null, SITES = [], ALL_SITES = [], WORKERS = [], ALLOC = [];
    let MODE = "requests";             // "requests" (default) · "worker" · "site"
    let SELECTED = new Set();          // site-mode: workers ticked for the chosen site
    let ASSIGN = {}, ORIG = {};        // worker-mode: worker_id -> site_id ("" = not working)
    let REQBYSITE = {}, REQANY = {};   // requests: site_id -> Set(worker_id) ; worker_id -> [site_name]
    let SITE_OFF = new Set();          // site_ids marked "not working" for this date
    let REQROWS = [], ALLOCMAP = {};   // raw request rows ; worker_id -> {site_id, site_name} (where allocated)

    // ---- Filter pill toggles (By Worker + By Site) ----
    const FILTER = { unalloc: false, multi: false, allochere: false };
    function toggleFilter(k) { FILTER[k] = !FILTER[k]; paintFilters(); render(); }
    function paintFilters() {
      [["f-unalloc", "unalloc"], ["f-multi", "multi"], ["f-allochere", "allochere"]].forEach(([id, k]) => {
        const b = document.getElementById(id); if (!b) return;
        const on = FILTER[k] ? "bg-red-700 text-white border-red-700" : "border-gray-300 text-gray-700";
        b.className = "filt border text-sm font-bold px-3 py-2 rounded-full whitespace-nowrap " + on +
          (id === "f-allochere" && MODE !== "site" ? " hidden" : "");
      });
    }

    function toast(msg, long = false, ok = false) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.background = ok ? "#16a34a" : "";
      t.classList.remove("hidden");
      setTimeout(() => t.classList.add("hidden"), long ? 6000 : 2500);
    }

    function fmtDate(d) { return d.toISOString().slice(0, 10); }
    function siteName(id) { const s = SITES.find(x => x.id === id); return s ? s.site_name : "?"; }

    async function boot() {
      const r = await vmmsApi("/api/v1/me");
      if (!r.ok) { vmmsLogout(); return; }
      ME = await r.json();
      if (!isFull(ME.role)) {
        document.body.innerHTML = '<p class="p-8 text-center text-gray-500">Only management (Admin / GM / OM / HR) can open the allocation page.</p>';
        return;
      }
      // default date: tomorrow (evening allocation is for the next day)
      const tmr = new Date(Date.now() + 24 * 3600 * 1000);
      document.getElementById("date").value = fmtDate(tmr);

      const [rs, rw] = await Promise.all([vmmsApi("/api/v1/sites"), vmmsApi("/api/v1/workers")]);
      ALL_SITES = await rs.json();
      SITES = VCMS_SITES.forOperationalDate(ALL_SITES, document.getElementById("date").value, []);
      WORKERS = (await rw.json()).filter(w => w.status !== "inactive");
      document.getElementById("site").innerHTML =
        SITES.map(s => `<option value="${s.id}">${esc(s.site_name)}</option>`).join("");
      await loadDay();          // fetches the day, then renders in the current MODE
      applyModeChrome();        // set toggle button styles + labels
    }

    function applyModeChrome() {
      const on = "bg-white text-red-700", off = "bg-red-800 text-white";
      const cls = m => "flex-1 rounded-lg py-2 text-sm font-bold " + (MODE === m ? on : off);
      document.getElementById("tab-worker").className = cls("worker");
      document.getElementById("tab-site").className   = cls("site");
      document.getElementById("tab-requests").className = cls("requests");
      [["tab-requests","requests"],["tab-worker","worker"],["tab-site","site"]].forEach(([id,mode])=>
        document.getElementById(id).setAttribute("aria-selected", String(MODE === mode)));
      document.getElementById("site").classList.toggle("hidden", MODE !== "site");
      document.getElementById("filterbar").classList.toggle("hidden", MODE === "requests");
      // Save stays visible everywhere — in Requests it saves the multi-site decisions
      document.getElementById("save").classList.remove("hidden");
      if (MODE !== "site") FILTER.allochere = false;   // that filter only applies to By Site
      paintFilters();
      // NOTE: the Save button label is owned entirely by updateStatus()
      // (Pending / Save Changes / Allocation Done ✓) — don't set it here.
    }

    function setMode(m) {
      MODE = m;
      applyModeChrome();
      snapshotAssign();          // all edit modes now share the ASSIGN model
      render();
    }

    function snapshotAssign() {
      ASSIGN = {}; ORIG = {};
      WORKERS.filter(w => w.status === "active").forEach(w => { ASSIGN[w.id] = ""; ORIG[w.id] = ""; });
      ALLOC.forEach(a => { if (a.worker_id in ASSIGN) { ASSIGN[a.worker_id] = a.site_id; ORIG[a.worker_id] = a.site_id; } });
    }

    async function loadDay() {
      const date = document.getElementById("date").value;
      const [r, rq, so] = await Promise.all([
        vmmsApi(`/api/v1/allocations?date=${date}`),
        vmmsApi(`/api/v1/requests?date=${date}`),
        vmmsApi(`/api/v1/site_off?date=${date}`),
      ]);
      SITE_OFF = new Set(so.ok ? await so.json() : []);
      ALLOC = r.ok ? await r.json() : [];
      ALLOCMAP = {};
      ALLOC.forEach(a => { ALLOCMAP[a.worker_id] = { site_id: a.site_id, site_name: a.site_name }; });
      // requested workers for this date (what each site asked for)
      REQROWS = rq.ok ? await rq.json() : [];
      REQBYSITE = {}; REQANY = {};
      REQROWS.forEach(x => {
        (REQBYSITE[x.site_id] = REQBYSITE[x.site_id] || new Set()).add(x.worker_id);
        (REQANY[x.worker_id] = REQANY[x.worker_id] || []).push(x.site_name);
      });
      // Completed/archived sites remain visible on historical days where they
      // actually had allocations, requests or a site-off record. They are still
      // hidden for current/future operational work.
      const previousSite=document.getElementById("site").value;
      const historicalSiteIds=[...ALLOC.map(x=>x.site_id),...REQROWS.map(x=>x.site_id),...SITE_OFF];
      SITES=VCMS_SITES.forOperationalDate(ALL_SITES,date,historicalSiteIds);
      document.getElementById("site").innerHTML=SITES.map(s=>`<option value="${s.id}">${esc(VCMS_SITES.label(s))}</option>`).join("");
      if(previousSite && SITES.some(s=>String(s.id)===String(previousSite))) document.getElementById("site").value=previousSite;
      // Copy is an Admin recovery tool and remains available even when the
      // target day already contains allocations; the server performs a safe merge.
      document.getElementById("copybar").classList.toggle("hidden", ME.role !== "admin");
      document.getElementById("clearbar").classList.toggle("hidden", ALLOC.length === 0);
      fillCopyFrom();
      snapshotAssign();
      render();
    }

    function render() {
      if (MODE === "requests") renderRequests();
      else if (MODE === "site") renderSite();
      else renderWorker();
      updateStatus();
      updateDesktopSummary();
    }

    function updateDesktopSummary(){
      const active=WORKERS.filter(w=>w.status==="active");
      const requested=new Set(Object.keys(REQANY));
      const allocated=active.filter(w=>ASSIGN[w.id]).length;
      const conflicts=active.filter(w=>(REQANY[w.id]||[]).length>1);
      const shortage=active.filter(w=>requested.has(String(w.id)) && !ASSIGN[w.id]);
      const unallocated=active.length-allocated;
      const sitePending=SITES.filter(s=>!SITE_OFF.has(s.id)&&(!REQBYSITE[s.id]||!REQBYSITE[s.id].size));
      const vals=[[active.length,"Active workers"],[requested.size,"Requested"],[allocated,"Allocated"],[unallocated,"Unallocated"],[conflicts.length,"Conflicts"],[shortage.length,"Shortage"]];
      const k=document.getElementById("alloc-kpis"); if(k) k.innerHTML=vals.map(x=>`<div class="alloc-kpi"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("");
      const e=document.getElementById("alloc-exceptions"); if(!e)return;
      const rows=[];
      if(shortage.length) rows.push(`<div class="alloc-ex"><b>${shortage.length} requested worker(s) unallocated</b>${shortage.slice(0,6).map(w=>esc(w.name)).join(", ")}</div>`);
      if(conflicts.length) rows.push(`<div class="alloc-ex"><b>${conflicts.length} multi-site request(s)</b>${conflicts.slice(0,6).map(w=>esc(w.name)).join(", ")}</div>`);
      if(sitePending.length) rows.push(`<div class="alloc-ex"><b>${sitePending.length} site request(s) pending</b>${sitePending.slice(0,6).map(s=>esc(s.site_name)).join(", ")}</div>`);
      if(!rows.length) rows.push('<div class="alloc-ex"><b style="color:#15803d">✓ No allocation exceptions</b>All requests are covered for this date.</div>');
      e.innerHTML=rows.join("");
    }

    /* Is the current view different from what's saved in the database?
       (All edit modes now share the ASSIGN model.) */
    function dayHasChanges() {
      return changeCount() > 0;
    }

    /* One place that decides the status banner + Save-button wording/colour */
    function updateStatus() {
      const done = ALLOC.length > 0;             // any allocation exists for the day
      const changes = dayHasChanges();
      const bar = document.getElementById("statusbar");
      const save = document.getElementById("save");
      const btn = base => "font-bold px-6 py-3 rounded-lg disabled:opacity-60 " + base;

      if (changes) {
        bar.className = "rounded-lg shadow-sm p-3 mb-3 text-sm font-bold text-center bg-yellow-50 border border-yellow-300 text-yellow-800";
        bar.textContent = "● Unsaved changes — press Save to apply them.";
        bar.classList.remove("hidden");
        save.disabled = false;
        save.textContent = "Save Changes";
        save.className = btn("bg-red-700 hover:bg-red-800 text-white");
      } else if (done) {
        bar.className = "rounded-lg shadow-sm p-3 mb-3 text-sm font-bold text-center bg-green-50 border border-green-300 text-green-700";
        bar.textContent = "✓ Allocation DONE for this day · " + ALLOC.length + " worker(s) allocated.";
        bar.classList.remove("hidden");
        save.disabled = true;
        save.textContent = "Allocation Done ✓";
        save.className = btn("bg-green-600 text-white");
      } else {
        // pending: the amber copybar already shows the message
        bar.classList.add("hidden");
        save.disabled = true;              // nothing changed yet
        save.textContent = "Save Allocation";
        save.className = btn("bg-red-700 hover:bg-red-800 text-white");
      }
    }

    /* ---- Reminder for sites that have not requested manpower ---- */
    const RDAYS = ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
    const RMON = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
    function reminderText() {
      const date = document.getElementById("date").value;
      const [y, m, d] = date.split("-");
      const dow = RDAYS[new Date(date + "T00:00:00").getDay()];
      const notReq = SITES.filter(s => (!REQBYSITE[s.id] || REQBYSITE[s.id].size === 0) && !SITE_OFF.has(s.id));
      const lines = ["*MANPOWER REQUEST REMINDER*", `*${d}-${RMON[+m - 1]}-${y}*`, `*${dow}*`, "",
        "The following sites have NOT sent their manpower request for this date. Please send it:"];
      notReq.forEach((s, i) => {
        const sup = (s.supervisors || []).map(x => x.name).join(", ") || "(no supervisor assigned)";
        lines.push(`${i + 1}. ${s.site_name} — ${sup}`);
      });
      return lines.join("\n");
    }
    function copyReminder() {
      const t = reminderText();
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject())
        .then(() => toast("Reminder copied — paste it in the group"))
        .catch(() => { window.prompt("Copy this reminder:", t); });
    }
    function shareReminder() {
      window.open("https://wa.me/?text=" + encodeURIComponent(reminderText()), "_blank");
    }

    /* ---------------- REQUESTS (did each site get what it asked for?) ---------------- */
    // One-tap: place every requested worker at the site that asked for him.
    // A worker requested by 2+ sites is LEFT OUT (admin decides) with a warning.
    function allocateAllRequested() {
      const byWorker = {};
      REQROWS.forEach(x => {
        const m = byWorker[x.worker_id] = byWorker[x.worker_id] || { name: x.worker_name, sites: [] };
        if (!m.sites.includes(x.site_id)) m.sites.push(x.site_id);
      });
      const multi = [];
      let placed = 0;
      Object.keys(byWorker).forEach(wid => {
        const w = byWorker[wid];
        if (w.sites.length > 1) { multi.push(w.name); return; }   // requested by 2+ sites → leave out
        if (!(wid in ASSIGN)) return;                             // inactive / on leave
        if (ASSIGN[wid] !== w.sites[0]) { ASSIGN[wid] = w.sites[0]; placed++; }
      });
      render();
      if (multi.length) {
        alert(`Placed ${placed} worker(s) at their requested site.\n\n` +
              `⚠ ${multi.length} worker(s) are requested by MORE THAN ONE site and were LEFT OUT.\n` +
              `Check with the site managers before allocating:\n\n` +
              multi.sort().join(", ") +
              `\n\nNow press Save to apply the placements.`);
      } else {
        toast(`Placed ${placed} worker(s) at their requested site — press Save to apply.`, true);
      }
    }

    function renderRequests() {
      // group requested workers by site
      const bySite = {};
      REQROWS.forEach(x => {
        (bySite[x.site_id] = bySite[x.site_id] || { name: x.site_name, rows: [] }).rows.push(x);
      });

      let totalReq = 0, totalGot = 0, totalPend = 0;
      const list = document.getElementById("list");
      list.className = "space-y-4";
      list.innerHTML = "";
      document.getElementById("empty").classList.add("hidden");

      // ---- Sites that have NOT sent a request → reminder for the co-ordinator ----
      const notReq = SITES.filter(s => (!REQBYSITE[s.id] || REQBYSITE[s.id].size === 0) && !SITE_OFF.has(s.id));
      const panel = document.createElement("div");
      if (notReq.length === 0) {
        panel.className = "bg-green-50 border border-green-200 rounded-xl shadow-sm p-4";
        panel.innerHTML = `<p class="font-bold text-green-700">✓ All active sites have sent a request for this date.</p>`;
      } else {
        panel.className = "bg-yellow-50 border border-yellow-300 rounded-xl shadow-sm p-4";
        panel.innerHTML =
          `<div class="flex items-center justify-between mb-2 gap-2 flex-wrap">
             <p class="font-bold text-gray-800">${notReq.length} site(s) have NOT requested manpower</p>
             <div class="flex gap-2">
               <button onclick="copyReminder()" class="bg-gray-800 hover:bg-gray-900 text-white text-xs font-bold px-3 py-2 rounded-lg">Copy reminder</button>
               <button onclick="shareReminder()" class="bg-green-600 hover:bg-green-700 text-white text-xs font-bold px-3 py-2 rounded-lg">Share to WhatsApp</button>
             </div>
           </div>` +
          notReq.map(s => `<div class="text-sm text-gray-700 py-0.5">• ${esc(s.site_name)} — ${esc((s.supervisors || []).map(x => x.name).join(", ") || "(no supervisor)")}</div>`).join("");
      }
      list.appendChild(panel);

      // ---- Sites marked NOT working today (supervisor set them off) ----
      const offSites = SITES.filter(s => SITE_OFF.has(s.id));
      if (offSites.length) {
        const op = document.createElement("div");
        op.className = "bg-gray-100 border border-gray-300 rounded-xl shadow-sm p-3 text-sm text-gray-600";
        op.innerHTML = `🚫 Not working today: <b>${offSites.map(s => esc(s.site_name)).join(", ")}</b>`;
        list.appendChild(op);
      }

      // ---- Requested workers that still need placing / reassigning → dropdowns ----
      // Shows EVERY day (not only for 2+ site cases): a worker appears here if he
      // is requested by 2+ sites, OR he is not yet allocated to a site that asked
      // for him (still pending). Lets the admin place/move him in one tap.
      const reqW = {};
      REQROWS.forEach(x => {
        const m = reqW[x.worker_id] = reqW[x.worker_id] ||
          { name: x.worker_name, code: x.worker_code, sites: [] };
        if (!m.sites.some(s => s.id === x.site_id)) m.sites.push({ id: x.site_id, name: x.site_name });
      });
      const placeIds = Object.keys(reqW).filter(wid => {
        const reqSites = reqW[wid].sites.map(s => s.id);
        const cur = ALLOCMAP[wid] ? ALLOCMAP[wid].site_id : "";
        const placedRight = cur && reqSites.includes(cur);     // already at a requesting site
        return !placedRight;   // show until placed at a requesting site; clears once allocated
      }).sort((a, b) => reqW[a].name.localeCompare(reqW[b].name));

      if (placeIds.length) {
        const mp = document.createElement("div");
        mp.className = "bg-red-50 border border-red-300 rounded-xl shadow-sm p-4";
        mp.innerHTML =
          `<div class="flex items-center justify-between gap-2 flex-wrap mb-1">
             <p class="font-bold text-gray-800">${placeIds.length} requested worker(s) to place / reassign</p>
             <button onclick="allocateAllRequested()" class="bg-red-700 hover:bg-red-800 text-white text-xs font-bold px-3 py-2 rounded-lg">⚡ Allocate all to requested site</button>
           </div>
           <p class="text-xs text-gray-500 mb-3">One tap places everyone at the site that asked for them, then press <b>Save</b>. Anyone requested by 2+ sites is left for you to decide.</p>`;
        placeIds.forEach(wid => {
          const w = reqW[wid];
          const cur = ASSIGN[wid] || "";
          const inReq = w.sites.some(s => s.id === cur);
          const reqIds = new Set(w.sites.map(s => s.id));
          // full site list — admin can move the worker to ANY site (requesting
          // sites are marked "· requested", his current site "(current)")
          const opts = `<option value="">— Not working —</option>` +
            SITES.map(s => {
              const mark = s.id === cur ? " (current)" : (reqIds.has(s.id) ? " · requested" : "");
              return `<option value="${s.id}" ${s.id === cur ? "selected" : ""}>${esc(s.site_name)}${mark}</option>`;
            }).join("");
          const where = cur ? (inReq ? "" : " · now at " + siteName(cur)) : " · not allocated";
          const row = document.createElement("div");
          row.className = "flex items-center gap-3 py-1.5 border-t border-red-200";
          row.innerHTML =
            `<div class="flex-1 min-w-0">
               <p class="text-sm font-medium text-gray-800 truncate">${esc(w.code)}_${esc(w.name)}</p>
               <p class="text-[11px] text-gray-500">requested by: ${esc(w.sites.map(s => s.name).join(", "))}${where}</p>
               ${w.sites.length > 1 ? `<p class="text-[11px] font-bold text-red-700">⚠ Requested by ${w.sites.length} sites — check with site managers before allocating</p>` : ""}
             </div>
             <select class="w-44 shrink-0 border border-gray-300 rounded-lg p-2 text-sm bg-white text-gray-800">${opts}</select>`;
          row.querySelector("select").addEventListener("change", (e) => {
            ASSIGN[wid] = e.target.value;
            render();   // refresh chips + status + save button
          });
          mp.appendChild(row);
        });
        list.appendChild(mp);
      }

      const siteIds = Object.keys(bySite).sort((a, b) => bySite[a].name.localeCompare(bySite[b].name));
      siteIds.forEach(sid => {
        const grp = bySite[sid];
        let got = 0, pend = 0;
        const rowsHTML = grp.rows
          .sort((a, b) => a.worker_name.localeCompare(b.worker_name))
          .map(x => {
            const al = ALLOCMAP[x.worker_id];
            let chip;
            if (al && al.site_id === sid) { got++; chip = `<span class="text-[11px] font-bold text-white bg-green-600 rounded px-2 py-0.5">ALLOCATED</span>`; }
            else if (al) { pend++; chip = `<span class="text-[11px] font-bold text-white bg-yellow-500 rounded px-2 py-0.5">AT ${al.site_name.toUpperCase()}</span>`; }
            else { pend++; chip = `<span class="text-[11px] font-bold text-white bg-red-600 rounded px-2 py-0.5">NOT ALLOCATED</span>`; }
            return `<div class="flex items-center justify-between py-1.5 border-t border-gray-200">
                      <span class="text-sm text-gray-800">${esc(x.worker_code)}_${esc(x.worker_name)}</span>${chip}
                    </div>`;
          }).join("");
        totalReq += grp.rows.length; totalGot += got; totalPend += pend;

        const card = document.createElement("div");
        card.className = "bg-gray-100 border border-gray-300 rounded-xl shadow-sm p-4";
        card.innerHTML =
          `<div class="flex items-center justify-between mb-1">
             <p class="font-bold text-gray-800">${esc(grp.name)}</p>
             <p class="text-xs ${pend ? "text-red-700 font-bold" : "text-green-700 font-bold"}">
               ${got}/${grp.rows.length} allocated${pend ? " · " + pend + " pending" : " ✓"}</p>
           </div>${rowsHTML}`;
        list.appendChild(card);
      });

      document.getElementById("summary").textContent =
        totalReq ? `${totalGot}/${totalReq} requested workers allocated · ${totalPend} pending`
                 : "No requests for this date";

      const ch = changeCount();
      const save = document.getElementById("save");
      save.disabled = ch === 0;
      document.getElementById("selcount").textContent =
        ch ? `${ch} change${ch > 1 ? "s" : ""} not saved — press Save All`
           : (totalPend ? `${totalPend} requested worker(s) still to allocate`
                        : "All requests allocated ✓");
    }

    function changeCount() {
      return Object.keys(ASSIGN).filter(w => ASSIGN[w] !== ORIG[w]).length;
    }

    /* Shared site dropdown */
    function siteOptions(cur) {
      return `<option value="">— Not working —</option>` +
        SITES.map(s => `<option value="${s.id}" ${s.id === cur ? "selected" : ""}>${esc(s.site_name)}</option>`).join("");
    }

    /* ---------------- BY SITE (context site + per-worker dropdown) ---------------- */
    function renderSite() {
      const siteId = document.getElementById("site").value;
      const siteNm = siteName(siteId);
      const q = document.getElementById("search").value.trim().toLowerCase();
      const multiReq = w => (REQANY[w.id] && REQANY[w.id].length > 1);
      const reqSet = REQBYSITE[siteId] || new Set();

      const active = WORKERS.filter(w => w.status === "active");
      const onLeave = WORKERS.filter(w => w.status === "on_leave");
      const hereCount = active.filter(w => ASSIGN[w.id] === siteId).length;

      document.getElementById("summary").textContent =
        `${hereCount} on ${siteNm} · ${reqSet.size} requested here · ${onLeave.length} on leave`;

      const rows = active.filter(w =>
        (!q || w.name.toLowerCase().includes(q) || w.worker_code.toLowerCase().includes(q)) &&
        (!FILTER.unalloc  || !ASSIGN[w.id]) &&
        (!FILTER.multi    || multiReq(w)) &&
        (!FILTER.allochere || ASSIGN[w.id] === siteId)
      );

      const list = document.getElementById("list");
      list.className = "space-y-2 md:space-y-0 md:grid md:grid-cols-2 lg:grid-cols-3 md:gap-2";
      list.innerHTML = "";
      document.getElementById("empty").classList.toggle("hidden", rows.length > 0);

      rows.forEach(w => {
        const changed = ASSIGN[w.id] !== ORIG[w.id];
        const reqHere = reqSet.has(w.id);
        const here = ASSIGN[w.id] === siteId;
        const div = document.createElement("div");
        div.className = "rounded-xl shadow-sm p-3 flex items-center gap-3 border " +
          (changed ? "bg-yellow-50 border-yellow-400"
                   : here ? "bg-green-50 border-green-300"
                   : reqHere ? "bg-gray-100 border-red-300" : "bg-gray-100 border-gray-300");
        const reqTag = reqHere ? ' <span class="ml-1 text-[10px] font-bold text-white bg-red-600 rounded px-1.5 py-0.5 align-middle">REQ here</span>' : "";
        const cur = ASSIGN[w.id];
        const whereNote = cur ? (here ? "" : " · at " + siteName(cur)) : " · not working";
        div.innerHTML =
          `<div class="flex-1 min-w-0">
             <p class="font-medium text-gray-800 truncate">${esc(w.name)}${reqTag}</p>
             <p class="text-xs text-gray-400">${esc(w.worker_code)}${whereNote}</p>
           </div>
           <select class="w-36 shrink-0 border border-gray-300 rounded-lg p-2 text-sm bg-white text-gray-800">${siteOptions(cur)}</select>`;
        div.querySelector("select").addEventListener("change", (e) => { ASSIGN[w.id] = e.target.value; render(); });
        list.appendChild(div);
      });

      appendLeave(list, onLeave, q, FILTER.unalloc || FILTER.allochere);
    }

    /* ---------------- BY WORKER (one row per worker, pick site) ---------------- */
    function renderWorker() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const onlyUn = FILTER.unalloc;
      const onlyMulti = FILTER.multi;
      const multiReq = w => (REQANY[w.id] && REQANY[w.id].length > 1);

      const active = WORKERS.filter(w => w.status === "active");
      const onLeave = WORKERS.filter(w => w.status === "on_leave");
      const assignedCount = active.filter(w => ASSIGN[w.id]).length;
      const unassigned = active.length - assignedCount;

      document.getElementById("summary").textContent =
        `${assignedCount} assigned · ${unassigned} unassigned · ${onLeave.length} on leave`;
      const ch = changeCount();
      document.getElementById("selcount").textContent =
        ch ? `${ch} change${ch > 1 ? "s" : ""} not saved` : "No changes yet";
      document.getElementById("save").disabled = ch === 0;

      const rows = active.filter(w =>
        (!q || w.name.toLowerCase().includes(q) || w.worker_code.toLowerCase().includes(q)) &&
        (!onlyUn || !ASSIGN[w.id]) &&
        (!onlyMulti || multiReq(w))
      );

      const opts = (cur) =>
        `<option value="">— Not working —</option>` +
        SITES.map(s => `<option value="${s.id}" ${s.id === cur ? "selected" : ""}>${esc(s.site_name)}</option>`).join("");

      const list = document.getElementById("list");
      list.className = "space-y-2 md:space-y-0 md:grid md:grid-cols-2 lg:grid-cols-3 md:gap-2";
      list.innerHTML = "";
      document.getElementById("empty").classList.toggle("hidden", rows.length > 0);

      rows.forEach(w => {
        const changed = ASSIGN[w.id] !== ORIG[w.id];
        const reqBy = REQANY[w.id];
        const div = document.createElement("div");
        div.className = "rounded-xl shadow-sm p-3 flex items-center gap-3 border " +
                        (changed ? "bg-yellow-50 border-yellow-400"
                                 : (reqBy ? "bg-gray-100 border-red-300" : "bg-gray-100 border-gray-300"));
        const wasNote = changed ? (ORIG[w.id] ? " · was " + siteName(ORIG[w.id]) : " · was none") : "";
        const reqNote = reqBy ? ` <span class="text-[10px] font-bold text-white bg-red-600 rounded px-1.5 py-0.5">REQ: ${reqBy.join(", ")}</span>` : "";
        div.innerHTML =
          `<div class="flex-1 min-w-0">
             <p class="font-medium text-gray-800 truncate">${esc(w.name)}</p>
             <p class="text-xs text-gray-400">${esc(w.worker_code)}${wasNote}${reqNote}</p>
           </div>
           <select class="w-36 shrink-0 border border-gray-300 rounded-lg p-2 text-sm bg-white text-gray-800">${opts(ASSIGN[w.id])}</select>`;
        div.querySelector("select").addEventListener("change", (e) => {
          ASSIGN[w.id] = e.target.value;
          render();   // refresh counts + highlight + status
        });
        list.appendChild(div);
      });

      appendLeave(list, onLeave, q, onlyUn);
    }

    function appendLeave(list, onLeave, q, onlyUn) {
      if (onLeave.length && !q && !onlyUn) {
        const hdr = document.createElement("p");
        hdr.className = "text-xs font-bold text-gray-400 mt-4 mb-1 md:col-span-full";
        hdr.textContent = "HOME LEAVE (not allocatable)";
        list.appendChild(hdr);
        onLeave.forEach(w => {
          const div = document.createElement("div");
          div.className = "bg-gray-100 border border-gray-300 rounded-xl shadow-sm p-4 opacity-50";
          div.innerHTML = `<p class="font-medium text-gray-800">${esc(w.name)}</p>
                           <p class="text-xs text-gray-400">${esc(w.worker_code)} · on leave</p>`;
          list.appendChild(div);
        });
      }
    }

    /* ---------------- Saving ---------------- */
    // All edit modes (By Site / By Worker / Requests) now edit ASSIGN, so a single
    // two-pass save handles everything.
    function save() { saveAll(); }

    async function callBulk(siteId, workerIds) {
      const r = await vmmsApi("/api/v1/allocations/bulk", {
        method: "POST",
        body: JSON.stringify({
          work_date: document.getElementById("date").value,
          site_id: siteId,
          worker_ids: workerIds,
        }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || "Could not save");
      return data;
    }


    // Worker mode: apply the whole day in one click.
    // Two passes so the backend's "already on another site" guard never trips:
    //   pass 1 removes movers from their old site, pass 2 adds them to the new one.
    async function saveAll() {
      const btn = document.getElementById("save");
      btn.disabled = true; btn.textContent = "Saving…";
      try {
        const ids = SITES.map(s => s.id);
        const newBySite = {}, curBySite = {};
        ids.forEach(id => { newBySite[id] = new Set(); curBySite[id] = new Set(); });
        Object.entries(ASSIGN).forEach(([w, s]) => { if (s && newBySite[s]) newBySite[s].add(w); });
        ALLOC.forEach(a => { if (curBySite[a.site_id]) curBySite[a.site_id].add(a.worker_id); });

        let added = 0, removed = 0;
        // pass 1 — shrink sites in parallel. Every call touches a different
        // site, so there is no conflict and large allocations save much faster.
        const shrink=[];
        for (const id of ids) {
          const cur = curBySite[id], nw = newBySite[id];
          if ([...cur].some(w => !nw.has(w))) {
            shrink.push(callBulk(id, [...cur].filter(w => nw.has(w))));
          }
        }
        (await Promise.all(shrink)).forEach(d=>{added+=d.added;removed+=d.removed;});
        // pass 2 — grow sites in parallel after movers have been removed.
        const grow=[];
        for (const id of ids) {
          const cur = curBySite[id], nw = newBySite[id];
          if ([...nw].some(w => !cur.has(w))) {
            grow.push(callBulk(id, [...nw]));
          }
        }
        (await Promise.all(grow)).forEach(d=>{added+=d.added;removed+=d.removed;});
        toast(`✓ Saved — ${added} added, ${removed} removed across all sites`, true, true);
        await loadDay();
      } catch (ex) {
        toast(ex.message, true);
        await loadDay();   // resync so the screen matches the database after a partial save
      } finally {
        btn.disabled = false; btn.textContent = "Save All";
      }
    }

    function fillCopyFrom() {
      const input = document.getElementById("copyfrom");
      if (!input) return;
      const base = new Date(document.getElementById("date").value + "T00:00:00");
      const prior = new Date(base.getTime() - 86400000);
      input.max = fmtDate(prior);
      if (!input.value || input.value >= document.getElementById("date").value) input.value = fmtDate(prior);
    }

    async function copyDay() {
      const to = document.getElementById("date").value;
      const from = (document.getElementById("copyfrom") || {}).value ||
                   fmtDate(new Date(new Date(to).getTime() - 24 * 3600 * 1000));
      if (!from || from >= to) { toast("Choose an earlier source date", true); return; }
      if (ALLOC.length && !confirm(`Merge allocation from ${from} into ${to}?\n\nExisting allocations will stay unchanged. Only unallocated active workers will be added.`)) return;
      try {
        const r = await vmmsApi("/api/v1/allocations/copy", {
          method: "POST",
          body: JSON.stringify({ from_date: from, to_date: to }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.detail || "Could not copy");
        toast(`Copied ${data.copied} worker(s) from ${from}` +
              (data.skipped_already_allocated ? ` · ${data.skipped_already_allocated} already allocated` : "") +
              (data.skipped_on_leave ? ` · ${data.skipped_on_leave} inactive skipped` : ""), true, true);
        await loadDay();
      } catch (ex) {
        toast(ex.message, true);
      }
    }

    async function clearDay() {
      const to = document.getElementById("date").value;
      if (!confirm(`Clear ALL allocation for ${to}?\n\nThis removes every worker from the day so you can allocate only those actually working (e.g. Sunday).\nAnyone already marked present is kept.`)) return;
      try {
        const r = await vmmsApi("/api/v1/allocations/clear", {
          method: "POST",
          body: JSON.stringify({ work_date: to }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.detail || "Could not clear the day");
        toast(`Cleared ${data.cleared} worker(s)` +
              (data.kept ? ` · kept ${data.kept} already marked present` : ""), true);
        await loadDay();
      } catch (ex) {
        toast(ex.message, true);
      }
    }

    document.getElementById("date").addEventListener("change", loadDay);
    document.getElementById("site").addEventListener("change", render);   // re-filter for the new context site
    let searchTimer=null;
    document.getElementById("search").addEventListener("input",()=>{clearTimeout(searchTimer);searchTimer=setTimeout(render,180);});

    boot();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>

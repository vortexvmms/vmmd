<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#C00000">
  <title>VCMS — WhatsApp Message</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/core-bundle.js?v=20260825-ui5"></script>
  <script src="js/auth.js?v=20260813-8"></script><script src="js/ui.js?v=20260825-ui5"></script>
  <script>window.esc=window.esc||function(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});};window.VMMS_TIER=window.VMMS_TIER||{full:["admin","general_manager","operation_manager","hr_assistant"],manager:["main_sup","wshc_lead"],supervisor:["site_sup","safety_sup","wshc","logistics_sup"]};window.isFull=window.isFull||function(r){return VMMS_TIER.full.indexOf(r)!==-1};window.isManager=window.isManager||function(r){return VMMS_TIER.manager.indexOf(r)!==-1};window.isSupervisor=window.isSupervisor||function(r){return VMMS_TIER.supervisor.indexOf(r)!==-1};window.isCoordinator=window.isCoordinator||function(r){return isFull(r)||isManager(r)};</script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <header class="vcms-page-header">
    <div class="vcms-page-header__row max-w-6xl mx-auto w-full">
      <a href="home.html" class="vcms-page-header__back" aria-label="Back to home">‹</a>
      <div class="vcms-page-header__title">
        <h1>WhatsApp Message</h1>
        <p id="hint">Choose type and date, then Generate</p>
      </div>
    </div>
    <div class="vcms-segmented mx-3 md:mx-auto max-w-6xl" id="type-row">
      <button id="t-alloc" class="flex-1 bg-white text-red-700 font-bold rounded-lg p-2 text-sm">Allocation</button>
      <button id="t-request" class="flex-1 bg-red-900 text-white font-bold rounded-lg p-2 text-sm">Request</button>
      <button id="t-update" class="flex-1 bg-red-900 text-white font-bold rounded-lg p-2 text-sm">Site Update</button>
    </div>
    <div class="vcms-page-toolbar max-w-6xl mx-auto w-full mt-2">
      <input id="date" type="date" class="vcms-control">
      <select id="site" class="vcms-control hidden"></select>
    </div>
  </header>

  <main class="vcms-supervisor-main flex-1 max-w-md">
    <button onclick="generate()" id="gen"
            class="vcms-btn vcms-btn-primary w-full mb-3">
      Generate Message
    </button>

    <p id="warn" class="hidden text-sm font-medium text-yellow-700 bg-yellow-50 border border-yellow-300 rounded-lg p-3 mb-3"></p>

    <textarea id="msg" readonly rows="16"
              class="w-full border border-gray-300 rounded-xl p-3 text-sm font-mono bg-white hidden"></textarea>
  </main>

  <div id="actionbar" class="vcms-mobile-actions hidden">
    <div class="vcms-mobile-actions__inner max-w-md">
      <button onclick="copyMsg()" class="vcms-btn vcms-btn-tertiary flex-1">
        Copy
      </button>
      <button onclick="shareMsg()" class="vcms-btn vcms-btn-success flex-1">
        Share to WhatsApp
      </button>
    </div>
  </div>

  <div id="toast" class="vcms-toast hidden"></div>

  <script>
    requireLogin();

    let ME = null, TYPE = "alloc";

    function toast(msg, long = false) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.classList.remove("hidden");
      setTimeout(() => t.classList.add("hidden"), long ? 6000 : 2500);
    }
    function fmtDate(d) { return d.toISOString().slice(0, 10); }

    function btnCls(active) {
      return "flex-1 font-bold rounded-lg p-2 text-sm " + (active ? "bg-white text-red-700" : "bg-red-900 text-white");
    }

    function setType(t) {
      TYPE = t;
      document.getElementById("t-alloc").className   = btnCls(t === "alloc");
      document.getElementById("t-request").className = btnCls(t === "request");
      document.getElementById("t-update").className  = btnCls(t === "update");
      [["t-alloc","alloc"],["t-request","request"],["t-update","update"]].forEach(([id,type])=>
        document.getElementById(id).setAttribute("aria-selected", String(t === type)));
      document.getElementById("site").classList.toggle("hidden", t !== "update");
      // allocation + request are for TOMORROW; update is for TODAY
      document.getElementById("date").value =
        fmtDate(new Date(Date.now() + (t === "update" ? 0 : 24 * 3600 * 1000)));
      document.getElementById("msg").classList.add("hidden");
      document.getElementById("actionbar").classList.add("hidden");
      document.getElementById("warn").classList.add("hidden");
    }

    async function boot() {
      const r = await vmmsApi("/api/v1/me");
      if (!r.ok) { vmmsLogout(); return; }
      ME = await r.json();

      if (isSupervisor(ME.role)) {
        // supervisors: Request + Site Update only (allocation broadcast is management)
        document.getElementById("t-alloc").classList.add("hidden");
        setType("request");
      } else {
        setType("alloc");
      }
      await loadSites();
    }

    async function loadSites() {
      // site list for the update message — taken from that day's sheet,
      // so site supervisors only ever see their own site(s)
      const date = document.getElementById("date").value;
      const r = await vmmsApi(`/api/v1/attendance?date=${date}`);
      const all = r.ok ? await r.json() : [];
      const map = {};
      all.forEach(x => map[x.site_id] = x.site_name);
      const sel = document.getElementById("site");
      // Co-ordinator/admin can generate one combined message for every site
      const allOpt = (ME && isCoordinator(ME.role))
        ? `<option value="__all__">All sites (combined)</option>` : "";
      const homeOpt = `<option value="__home__">🏠 Home Leave (workers on leave)</option>`;
      sel.innerHTML = allOpt
        + Object.entries(map).map(([id, n]) => `<option value="${id}">${esc(n)}</option>`).join("")
        + homeOpt;
    }

    async function generate() {
      const btn = document.getElementById("gen");
      btn.disabled = true; btn.textContent = "Generating…";
      try {
        const date = document.getElementById("date").value;
        let url;
        if (TYPE === "alloc") {
          url = `/api/v1/messages/allocation?date=${date}`;
        } else if (TYPE === "request") {
          url = `/api/v1/messages/requests?date=${date}`;
        } else {
          const sid = document.getElementById("site").value;
          if (!sid) throw new Error("No site available for this date");
          if (sid === "__home__") url = `/api/v1/messages/home_leave`;
          else if (sid === "__all__") url = `/api/v1/messages/update_all?date=${date}`;
          else url = `/api/v1/messages/update?date=${date}&site_id=${sid}`;
        }
        const r = await vmmsApi(url);
        const data = await r.json();
        if (!r.ok) throw new Error(data.detail || "Could not generate");

        document.getElementById("msg").value = data.message;
        document.getElementById("msg").classList.remove("hidden");
        document.getElementById("actionbar").classList.remove("hidden");

        const warn = document.getElementById("warn");
        if (TYPE === "update" && data.missing_end_time > 0) {
          warn.textContent = `⚠ ${data.missing_end_time} worker(s) have no end time yet — they are NOT in the message. Fill their end times in Attendance first.`;
          warn.classList.remove("hidden");
        } else if (TYPE === "alloc" && data.workers === 0) {
          warn.textContent = "⚠ No workers allocated for this date yet.";
          warn.classList.remove("hidden");
        } else if (TYPE === "request" && data.workers === 0) {
          warn.textContent = "⚠ No manpower requests submitted for this date yet.";
          warn.classList.remove("hidden");
        } else {
          warn.classList.add("hidden");
        }
      } catch (ex) {
        toast(ex.message, true);
      } finally {
        btn.disabled = false; btn.textContent = "Generate Message";
      }
    }

    async function copyMsg() {
      try {
        await navigator.clipboard.writeText(document.getElementById("msg").value);
        toast("Copied — paste into WhatsApp");
      } catch {
        document.getElementById("msg").select();
        document.execCommand("copy");
        toast("Copied — paste into WhatsApp");
      }
    }

    function shareMsg() {
      // Go straight to WhatsApp (app on phone, WhatsApp Web on desktop) with the
      // message pre-filled; the user just picks the group.
      const text = document.getElementById("msg").value;
      window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
    }

    document.getElementById("t-alloc").addEventListener("click", () => setType("alloc"));
    document.getElementById("t-request").addEventListener("click", () => setType("request"));
    document.getElementById("t-update").addEventListener("click", () => setType("update"));
    document.getElementById("date").addEventListener("change", loadSites);

    boot();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>

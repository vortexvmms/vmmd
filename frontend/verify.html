<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#C00000">
  <title>VCMS — End-Time Verification</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <script src="js/theme-boot.js?v=20260927-1"></script><link rel="stylesheet" href="css/theme-boot.css?v=20260927-1"><link rel="stylesheet" href="css/app.css">
  <script src="js/core-bundle.js?v=20260904-history1"></script>
  <script src="js/auth.js?v=20260813-8"></script><script src="js/ui.js?v=20260825-ui5"></script>
  <script>window.esc=window.esc||function(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});};window.VMMS_TIER=window.VMMS_TIER||{full:["admin","general_manager","operation_manager","hr_assistant"],manager:["main_sup","wshc_lead"],supervisor:["site_sup","safety_sup","wshc","logistics_sup"]};window.isFull=window.isFull||function(r){return VMMS_TIER.full.indexOf(r)!==-1};window.isManager=window.isManager||function(r){return VMMS_TIER.manager.indexOf(r)!==-1};window.isSupervisor=window.isSupervisor||function(r){return VMMS_TIER.supervisor.indexOf(r)!==-1};window.isCoordinator=window.isCoordinator||function(r){return isFull(r)||isManager(r)};</script>
  <style>
    .print-only { display: none; }
    @media(max-width:1100px){.verify-export-actions{width:100%}header>div:first-child{flex-wrap:wrap}.verify-export-actions button{flex:1;white-space:nowrap}}
    @media(max-width:899px){.sheet{overflow-x:auto!important;-webkit-overflow-scrolling:touch}.sheet table{min-width:760px}.sheet th:first-child,.sheet td:first-child{position:sticky;left:0;z-index:2;background:#fff}.sheet thead th:first-child{background:#E5E7EB;z-index:3}.sheet input[type=checkbox]{width:22px;height:22px}}
    @media print {
      @page { size: A4 landscape; margin: 9mm; }
      html, body {
        background:#fff !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;
        font-family:"Arial Narrow","Helvetica Neue Condensed","Liberation Sans Narrow",Arial,sans-serif;
        color:#111;
      }
      .no-print { display:none !important; }
      .print-only { display:block !important; }
      main { max-width:none !important; padding:0 !important; }
      .sheet { border:none !important; box-shadow:none !important; background:#fff !important; border-radius:0 !important; overflow:visible !important; }
      table { width:100%; border-collapse:collapse; font-size:8.5pt; }
      thead { display:table-header-group; }          /* repeat header on each page */
      tr { page-break-inside:avoid; }
      th, td { padding:2px 7px !important; border-bottom:0.4pt solid #cfd4da !important; }
      thead th { background:#e8eaed !important; border-bottom:0.8pt solid #999 !important; font-weight:bold; }
      tfoot td { border-top:0.8pt solid #888 !important; font-weight:bold; }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <header class="no-print bg-red-700 text-white p-4 shadow sticky top-0 z-10">
    <div class="flex items-center gap-3 max-w-6xl mx-auto w-full">
      <a href="home.html" class="text-2xl font-bold leading-none">‹</a>
      <div class="flex-1">
        <h1 class="text-lg font-bold">End-Time Verification</h1>
        <p class="text-red-100 text-xs" id="summary">Loading…</p>
      </div>
      <div class="verify-export-actions flex flex-wrap gap-2"><button id="export-excel" onclick="exportVerification('xlsx')" disabled class="bg-white text-red-700 text-sm font-bold px-4 py-2 rounded-lg">Export to Excel</button><button id="export-csv" onclick="exportVerification('csv')" disabled class="bg-white text-red-700 text-sm font-bold px-4 py-2 rounded-lg">Export to CSV</button>
      <button onclick="downloadPdf()" class="bg-white text-red-700 text-sm font-bold px-4 py-2 rounded-lg">Download PDF</button>
      <button onclick="window.print()" class="bg-red-900 text-white text-sm font-bold px-4 py-2 rounded-lg">Print</button></div>
    </div>
    <div class="flex flex-wrap gap-2 mt-3 max-w-6xl mx-auto w-full">
      <input id="date" type="date" class="rounded-lg p-2 text-gray-800 text-base">
      <select id="site" class="rounded-lg p-2 text-gray-800 text-base bg-white"></select>
      <input id="search" type="search" placeholder="Search worker…" class="flex-1 min-w-[140px] rounded-lg p-2 text-gray-800 text-base">
    </div>
    <div class="flex flex-wrap gap-4 mt-2 max-w-6xl mx-auto w-full text-sm">
      <label class="flex items-center gap-2"><input id="f-missing" type="checkbox" class="accent-white"> Missing end time only</label>
      <label class="flex items-center gap-2"><input id="f-present" type="checkbox" class="accent-white"> Present only</label>
      <label class="flex items-center gap-2"><input id="f-ot" type="checkbox" class="accent-white"> Has OT only</label>
    </div>
  </header>

  <div class="print-only" style="border-bottom:3px solid #C00000; padding-bottom:8px; margin-bottom:12px;">
    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
      <div style="display:flex; align-items:center; gap:10px;">
        <img src="https://www.vortex.sg/images/Vortex-Logo_Type.png" alt="Vortex" style="height:32px;" onerror="this.style.display='none'">
        <div>
          <div style="font-size:15px; font-weight:bold; color:#C00000;">VORTEX MANPOWER MANAGEMENT SYSTEM</div>
          <div style="font-size:11px; color:#595959;">End-Time Verification (submitted end times vs face-scan)</div>
        </div>
      </div>
      <div style="font-size:10px; color:#595959; text-align:right; line-height:1.5;">
        <div><b>Date:</b> <span id="p-date">—</span> &nbsp; <b>Site:</b> <span id="p-site">All sites</span></div>
        <div><b>Generated:</b> <span id="p-gen">—</span></div>
        <div><b>Checked by:</b> <span id="p-user">—</span> &nbsp; <b>Present:</b> <span id="p-count">—</span></div>
      </div>
    </div>
  </div>

  <main class="flex-1 p-4 max-w-6xl mx-auto w-full pb-10">
    <div class="sheet bg-gray-100 border border-gray-300 rounded-xl shadow-sm overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-200 text-gray-600 text-xs select-none">
          <tr id="hrow">
            <th data-k="code" class="text-left p-3 cursor-pointer">Worker ID</th>
            <th data-k="name" class="text-left p-3 cursor-pointer">Name</th>
            <th data-k="site" class="text-left p-3 cursor-pointer">Site</th>
            <th data-k="status" class="text-left p-3 cursor-pointer">Status</th>
            <th data-k="start" class="text-right p-3 cursor-pointer">Start</th>
            <th data-k="end" class="text-right p-3 cursor-pointer">End time</th>
            <th data-k="normal" class="text-right p-3 cursor-pointer">Normal h</th>
            <th data-k="ot" class="text-right p-3 cursor-pointer">OT h</th>
            <th data-k="submitted" class="text-center p-3 cursor-pointer">Submitted</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
        <tfoot id="foot" class="border-t-2 border-gray-400 font-bold text-gray-800"></tfoot>
      </table>
    </div>
    <p id="empty" class="hidden text-center text-gray-400 mt-10">No workers for this date.</p>
  </main>

  <script src="js/verification-export.js?v=20261016-1"></script>
  <script>
    requireLogin();
    function downloadPdf() {
      const d = document.getElementById("date").value || "";
      vmmsDownloadPdf("body", `VMMS_EndTime_Verification_${d}`, { landscape: true });
    }
    let ME = null, ALL = [], LOADED = false, EXPORTING = false, LOAD_ID = 0;
    const HLABELS = { code:"Worker ID", name:"Name", site:"Site", status:"Status",
      start:"Start", end:"End time", normal:"Normal h", ot:"OT h", submitted:"Submitted" };
    let SORT = { key: "site", dir: 1 };

    function sval(x, k) {
      switch (k) {
        case "code": return x.worker_code || "";
        case "name": return x.worker_name || "";
        case "site": return x.site_name || "";
        case "status": return x.present ? 0 : ({ mc:1, al:2, ul:3, absent:4 }[x.absence_type] || 4);
        case "start": return x.present ? (x.start_time || "") : "";
        case "end": return x.end_time || "";
        case "normal": return x.present ? x.normal_hours : -1;
        case "ot": return x.present ? x.ot_hours : -1;
        case "submitted": return x.submitted ? 1 : 0;
      }
      return "";
    }
    function sortBy(k) { if (SORT.key === k) SORT.dir *= -1; else { SORT.key = k; SORT.dir = 1; } render(); }

    function fmtDMY(iso) { const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; }
    function todayIso(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

    async function boot() {
      const r = await vmmsApi("/api/v1/me");
      if (!r.ok) { vmmsLogout(); return; }
      ME = await r.json();
      document.getElementById("date").value = todayIso();
      await load();
    }

    async function load() {
      const requestId=++LOAD_ID;LOADED=false;exportButtons();
      const date = document.getElementById("date").value || todayIso();
      const r = await vmmsApi(`/api/v1/attendance?date=${date}`);
      if(requestId!==LOAD_ID)return;
      if(!r.ok){ALL=[];render();document.getElementById('summary').textContent='Could not load attendance. Please select the date again to retry.';return;}
      const data=await r.json();if(requestId!==LOAD_ID)return;ALL=data;LOADED=true;
      // site dropdown
      const names = [...new Set(ALL.map(x => x.site_name))].sort();
      const sel = document.getElementById("site");
      const prev = sel.value;
      sel.innerHTML = `<option value="">All sites</option>` + names.map(n => `<option>${esc(n)}</option>`).join("");
      if (prev) sel.value = prev;
      render();
    }

    function verificationRows() {
      const site = document.getElementById("site").value;
      const q = document.getElementById("search").value.trim().toLowerCase();
      const missing = document.getElementById("f-missing").checked;
      const present = document.getElementById("f-present").checked;
      const otOnly = document.getElementById("f-ot").checked;

      return ALL.filter(x =>
        (!site || x.site_name === site) &&
        (!q || x.worker_name.toLowerCase().includes(q) || x.worker_code.toLowerCase().includes(q)) &&
        (!missing || (x.present && !x.end_time)) &&
        (!present || x.present) &&
        (!otOnly || x.ot_hours > 0)
      ).sort((a, b) => {
        const va = sval(a, SORT.key), vb = sval(b, SORT.key);
        let c = (typeof va === "number") ? (va - vb) : String(va).localeCompare(String(vb));
        if (c === 0) c = (a.worker_name || "").localeCompare(b.worker_name || "");
        return c * SORT.dir;
      });

    }
    function render() {
      const site=document.getElementById('site').value,rows=verificationRows();
      exportButtons();
      // header sort arrows
      document.querySelectorAll("#hrow th").forEach(th => {
        const k = th.dataset.k;
        th.textContent = HLABELS[k] + (SORT.key === k ? (SORT.dir > 0 ? " ▲" : " ▼") : "");
      });

      const date = document.getElementById("date").value;
      document.getElementById("summary").textContent =
        `${fmtDMY(date)} · ${rows.length} shown · ${rows.filter(x=>x.present&&!x.end_time).length} missing end time`;
      document.getElementById("p-date").textContent = fmtDMY(date);
      document.getElementById("p-site").textContent = site || "All sites";
      document.getElementById("p-count").textContent = rows.filter(x => x.present).length;
      const now = new Date();
      document.getElementById("p-gen").textContent = fmtDMY(todayIso())+" "+String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0")+" SGT";
      document.getElementById("p-user").textContent = ME ? ME.name : "—";

      document.getElementById("empty").classList.toggle("hidden", rows.length > 0);
      document.getElementById("rows").innerHTML = rows.map(x => {
        const ALBL = { mc:"MC", ul:"UL", al:"AL", absent:"Absent" };
        const ACLR = { mc:"text-yellow-600", ul:"text-orange-600", al:"text-blue-600", absent:"text-gray-600" };
        const st = x.present
          ? `<span class="text-green-700 font-medium">Present</span>`
          : `<span class="${ACLR[x.absence_type] || "text-gray-600"} font-medium">${ALBL[x.absence_type] || "Absent"}</span>`;
        const end = x.present ? (x.end_time || `<span class="text-red-600 font-bold">missing</span>`) : "—";
        const sub = x.submitted ? `<span class="text-green-700 font-bold">✓</span>` : `<span class="text-gray-400">pending</span>`;
        return `<tr class="border-t border-gray-200">
          <td class="p-3 text-gray-500">${esc(x.worker_code)}</td>
          <td class="p-3 text-gray-800 font-medium">${esc(x.worker_name)}</td>
          <td class="p-3 text-gray-700">${esc(x.site_name)}</td>
          <td class="p-3">${st}</td>
          <td class="p-3 text-right">${x.present ? x.start_time : "—"}</td>
          <td class="p-3 text-right">${end}</td>
          <td class="p-3 text-right">${x.present ? x.normal_hours : "—"}</td>
          <td class="p-3 text-right ${x.ot_hours>0?"text-red-700 font-bold":""}">${x.present ? x.ot_hours : "—"}</td>
          <td class="p-3 text-center">${sub}</td>
        </tr>`;
      }).join("");

      const nh = rows.reduce((a,x)=>a+(x.present?x.normal_hours:0),0);
      const ot = rows.reduce((a,x)=>a+(x.present?x.ot_hours:0),0);
      document.getElementById("foot").innerHTML =
        `<tr><td class="p-3" colspan="6">TOTAL (${rows.filter(x=>x.present).length} present)</td>
             <td class="p-3 text-right">${Math.round(nh*10)/10}</td>
             <td class="p-3 text-right">${Math.round(ot*10)/10}</td><td></td></tr>`;
    }

    function exportButtons(){for(const id of ['export-excel','export-csv'])document.getElementById(id).disabled=!LOADED||EXPORTING||!verificationRows().length;}
    function verificationContext(){const active=[];const q=document.getElementById('search').value.trim();if(q)active.push('Search: '+q);if(document.getElementById('f-missing').checked)active.push('Missing end time only');if(document.getElementById('f-present').checked)active.push('Present only');if(document.getElementById('f-ot').checked)active.push('Has OT only');return {date:document.getElementById('date').value,site:document.getElementById('site').value||'All sites',filters:active.join(' / ')||'All workers',sort:HLABELS[SORT.key]+(SORT.dir>0?' ascending':' descending'),user:ME?.name||'VCMS',generated:new Date().toLocaleString('en-SG',{timeZone:'Asia/Singapore',hour12:false})};}
    async function exportVerification(kind){
      if(!LOADED||EXPORTING)return;
      const rows=verificationRows().map(r=>({...r})),context=verificationContext();if(!rows.length){alert('No matching workers to export.');return;}
      EXPORTING=true;exportButtons();const button=document.getElementById(kind==='xlsx'?'export-excel':'export-csv'),label=button.textContent;button.textContent='Preparing…';
      try{
        let blob;
        if(kind==='csv')blob=new Blob([VerificationExport.csv(rows,context.date)],{type:'text/csv;charset=utf-8'});
        else{
          if(!window.ExcelJS)await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';script.onload=()=>window.ExcelJS?resolve():reject(Error('Excel export tool unavailable'));script.onerror=()=>reject(Error('Could not load Excel export. Check your connection and retry.'));document.head.appendChild(script)});
          const workbook=VerificationExport.workbook(window.ExcelJS,rows,context);blob=new Blob([await workbook.xlsx.writeBuffer()],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
        }
        const site=context.site.replace(/[^a-z0-9_-]+/gi,'_'),name=`VCMS_EndTime_Verification_${context.date}_${site}.${kind}`,url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
      }catch(e){alert(e.message||'Could not export. Please try again.')}finally{EXPORTING=false;button.textContent=label;exportButtons();}
    }

    document.getElementById("date").addEventListener("change", load);
    ["site","search","f-missing","f-present","f-ot"].forEach(id =>
      document.getElementById(id).addEventListener("input", render));
    document.getElementById("site").addEventListener("change", render);
    document.querySelectorAll("#hrow th").forEach(th =>
      th.addEventListener("click", () => sortBy(th.dataset.k)));

    boot();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>

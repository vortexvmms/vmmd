<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Camera Lists · VCMS</title><link rel="stylesheet" href="css/app.css"><script src="js/core-bundle.js?v=20260828-shell2"></script><script src="js/auth.js?v=20260814-camera1"></script><script src="js/ui.js?v=20260825-ui5"></script><style>
*{box-sizing:border-box}body{margin:0;background:#e8ebf0;color:#20242c;font-family:Arial}.top{background:#aa0000;color:#fff;padding:15px}.topin{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px}.top a{color:#fff;text-decoration:none;font-size:24px}.top h1{font-size:19px;margin:0}.page{max-width:1100px;margin:auto;padding:18px 14px 70px}.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#fff;padding:14px;border-radius:13px;margin-bottom:12px}.ctrl{height:45px;width:100%;border:1px solid #cbd2dc;border-radius:9px;padding:0 11px;background:#fff}.cols{display:grid;grid-template-columns:1fr 1fr;gap:13px}.panel{background:#fff;border-radius:13px;overflow:hidden;border:1px solid #dbe0e7}.ph{display:flex;align-items:center;justify-content:space-between;background:#252b35;color:#fff;padding:13px}.ph h2{font-size:15px;margin:0}.add{border:0;background:#c00000;color:#fff;border-radius:8px;padding:8px 10px;font-weight:bold}.rows{padding:8px}.row{display:grid;grid-template-columns:34px 1fr auto auto;align-items:center;gap:7px;padding:9px 6px;border-bottom:1px solid #edf0f3}.order{width:34px;height:32px;border:1px solid #d3d8df;border-radius:6px;text-align:center}.name{font-size:14px}.off{opacity:.5}.mini{border:1px solid #d3d8df;background:#fff;border-radius:7px;padding:6px 8px;font-weight:bold}.danger{color:#a00000}.empty{padding:28px;text-align:center;color:#7a8493}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#252b35;color:#fff;padding:10px 14px;border-radius:8px;display:none}
@media(max-width:750px){.pick,.cols{grid-template-columns:1fr}.row{grid-template-columns:34px 1fr auto}.row .delete{grid-column:3}}
</style></head><body><header class="top"><div class="topin"><a href="camera.html">‹</a><h1>Camera reusable lists</h1></div></header><main class="page"><section class="pick"><select id="project" class="ctrl" onchange="render()"></select><select id="workFilter" class="ctrl" onchange="renderActivities()"></select></section><div class="cols"><section class="panel"><div class="ph"><h2>Items of work</h2><button class="add" onclick="addWork()">+ Add</button></div><div id="works" class="rows"></div></section><section class="panel"><div class="ph"><h2>Activities</h2><button class="add" onclick="addActivity()">+ Add</button></div><div id="activities" class="rows"></div></section></div></main><div id="toast" class="toast"></div>
<script>
requireLogin();const $=id=>document.getElementById(id);let D={projects:[],work_items:[],activities:[]};function msg(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)}function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
async function load(){let r=await vmmsApi('/api/v1/camera/setup?manage=true');if(!r.ok)return msg((await r.json().catch(()=>({}))).detail||'Could not load');D=await r.json();if(!D.can_manage){location.href='camera.html';return}$('project').innerHTML=D.projects.map(x=>`<option value="${x.id}">${esc(x.title)} · ${esc(x.sites?.site_name||'')}</option>`).join('');render()}
function render(){let pid=$('project').value,ws=D.work_items.filter(x=>x.dpr_project_id===pid);$('works').innerHTML=ws.length?ws.map(x=>row(x,'work')).join(''):'<div class="empty">No saved items</div>';$('workFilter').innerHTML=ws.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');renderActivities()}
function renderActivities(){let wid=$('workFilter').value,as=D.activities.filter(x=>x.work_item_id===wid);$('activities').innerHTML=as.length?as.map(x=>row(x,'activity')).join(''):'<div class="empty">Select an item, then add activities</div>'}
function row(x,type){return `<div class="row ${x.active?'':'off'}"><input class="order" type="number" value="${x.sort_order||0}" onchange="edit('${type}','${x.id}',{sort_order:+this.value})"><span class="name">${esc(x.name)}</span><button class="mini" onclick="edit('${type}','${x.id}',{active:${!x.active}})">${x.active?'Disable':'Enable'}</button><button class="mini danger delete" onclick="del('${type}','${x.id}')">Delete</button></div>`}
async function addWork(){let name=prompt('Item of work name');if(!name)return;await write('work',null,{dpr_project_id:$('project').value,name,sort_order:D.work_items.filter(x=>x.dpr_project_id===$('project').value).length+1,active:true})}async function addActivity(){if(!$('workFilter').value)return msg('Add or select an item first');let name=prompt('Activity name');if(!name)return;await write('activity',null,{work_item_id:$('workFilter').value,name,sort_order:D.activities.filter(x=>x.work_item_id===$('workFilter').value).length+1,active:true})}
async function edit(type,id,change){let x=(type==='work'?D.work_items:D.activities).find(y=>y.id===id),body={...x,...change};delete body.id;delete body.created_at;delete body.updated_at;delete body.created_by;await write(type,id,body)}async function write(type,id,body){let base=type==='work'?'work-items':'activities',r=await vmmsApi(`/api/v1/camera/${base}${id?'/'+id:''}`,{method:id?'PATCH':'POST',body:JSON.stringify(body)});if(!r.ok)return msg((await r.json().catch(()=>({}))).detail||'Could not save');msg('Saved');await load()}async function del(type,id){if(!confirm('Delete this reusable entry?'))return;let base=type==='work'?'work-items':'activities',r=await vmmsApi(`/api/v1/camera/${base}/${id}`,{method:'DELETE'});if(!r.ok)return msg('Could not delete');msg('Deleted');await load()}load();
</script></body></html>

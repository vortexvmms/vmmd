<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#C00000">
  <title>VCMS — To-do</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>window.esc=window.esc||function(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});};</script>
  <style>
    body.td{ background:#F6F5F2; }
    .qgrid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .col{ background:#fff; border:1px solid #E7E5E1; border-radius:14px; padding:12px; min-height:150px; border-top:4px solid var(--qc,#C00000); }
    .col.drag{ outline:2px dashed var(--qc,#C00000); outline-offset:-4px; }
    .col h3{ margin:0 0 2px; font-size:14px; font-weight:800; } .col .sub{ font-size:11.5px; color:#8A8A8A; margin-bottom:10px; }
    .task{ display:flex; align-items:flex-start; gap:8px; background:#FBFAF8; border:1px solid #ECEAE5; border-radius:10px; padding:9px 10px; margin-bottom:8px; cursor:grab; }
    .task.done{ opacity:.55; } .task.done .tx{ text-decoration:line-through; }
    .task .tx{ flex:1; font-size:13.5px; min-width:0; word-break:break-word; }
    .task input[type=checkbox]{ width:17px; height:17px; margin-top:1px; flex:none; }
    .task .mv{ font-size:11px; border:1px solid #E5E7EB; border-radius:6px; padding:3px 4px; background:#fff; }
    .task .del{ background:none; border:none; color:#C00000; font-weight:700; cursor:pointer; font-size:15px; }
    .addbar{ display:flex; gap:8px; }
    .addbar input{ flex:1; border:1px solid #D1D5DB; border-radius:10px; padding:11px 12px; font-size:15px; }
    .addbar button{ background:#C00000; color:#fff; border:none; border-radius:10px; padding:0 18px; font-weight:700; font-size:15px; cursor:pointer; }
    .inbox{ background:#fff; border:1px dashed #CBD5E1; border-radius:14px; padding:12px; margin-top:14px; }
    @media (max-width:820px){ .qgrid{ grid-template-columns:1fr; } }
  </style>
</head>
<body class="td min-h-screen flex flex-col">
  <header class="bg-red-700 text-white p-4 shadow sticky top-0 z-10">
    <div class="flex items-center gap-3 max-w-5xl mx-auto w-full">
      <a href="home.html" class="text-2xl font-bold leading-none">‹</a>
      <div class="flex-1"><h1 class="text-lg font-bold">To-do</h1><p class="text-red-100 text-xs">Plan your day — drag tasks into the right box</p></div>
    </div>
  </header>

  <main class="flex-1 p-4 max-w-5xl mx-auto w-full pb-16">
    <div class="addbar">
      <input id="new" placeholder="What do you need to do today?" onkeydown="if(event.key==='Enter')addTask()">
      <button onclick="addTask()">Add</button>
    </div>

    <div class="inbox" id="col-inbox" ondragover="dover(event,'inbox')" ondragleave="dleave('inbox')" ondrop="ddrop(event,'inbox')">
      <h3 style="margin:0 0 8px;font-size:13px;font-weight:800;color:#475569">Inbox — new tasks to sort</h3>
      <div id="list-inbox"></div>
    </div>

    <div class="qgrid" style="margin-top:14px">
      <div class="col" id="col-q1" style="--qc:#C00000" ondragover="dover(event,'q1')" ondragleave="dleave('q1')" ondrop="ddrop(event,'q1')">
        <h3>Do first</h3><div class="sub">Urgent &amp; important</div><div id="list-q1"></div>
      </div>
      <div class="col" id="col-q2" style="--qc:#2563EB" ondragover="dover(event,'q2')" ondragleave="dleave('q2')" ondrop="ddrop(event,'q2')">
        <h3>Schedule</h3><div class="sub">Important, not urgent</div><div id="list-q2"></div>
      </div>
      <div class="col" id="col-q3" style="--qc:#D97706" ondragover="dover(event,'q3')" ondragleave="dleave('q3')" ondrop="ddrop(event,'q3')">
        <h3>Delegate</h3><div class="sub">Urgent, not important</div><div id="list-q3"></div>
      </div>
      <div class="col" id="col-q4" style="--qc:#8A8A8A" ondragover="dover(event,'q4')" ondragleave="dleave('q4')" ondrop="ddrop(event,'q4')">
        <h3>Eliminate</h3><div class="sub">Neither — drop or defer</div><div id="list-q4"></div>
      </div>
    </div>
  </main>

  <div id="toast" class="hidden fixed bottom-10 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-sm px-4 py-2 rounded-full shadow z-50"></div>

  <script>
    requireLogin();
    let TODOS=[];
    const QCOLS=["inbox","q1","q2","q3","q4"];
    const QNAMES={inbox:"Inbox",q1:"Do first",q2:"Schedule",q3:"Delegate",q4:"Eliminate"};
    function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.remove("hidden"); setTimeout(()=>t.classList.add("hidden"),1800); }

    async function load(){
      const r=await vmmsApi("/api/v1/todos"); TODOS=r.ok?await r.json():[];
      render();
    }
    function render(){
      QCOLS.forEach(q=>{
        const items=TODOS.filter(t=>(t.quadrant||"inbox")===q);
        document.getElementById("list-"+q).innerHTML=items.map(t=>taskHTML(t)).join("")
          || (q==="inbox"?'<p style="color:#9CA3AF;font-size:12.5px">Add a task above — it lands here to sort.</p>':'<p style="color:#CBD5E1;font-size:12px">—</p>');
      });
    }
    function taskHTML(t){
      const opts=QCOLS.map(q=>`<option value="${q}" ${((t.quadrant||"inbox")===q)?"selected":""}>${QNAMES[q]}</option>`).join("");
      return `<div class="task ${t.done?"done":""}" draggable="true" ondragstart="dstart(event,'${t.id}')" id="t-${t.id}">
        <input type="checkbox" ${t.done?"checked":""} onchange="toggleDone('${t.id}',this.checked)">
        <div class="tx">${esc(t.text)}</div>
        <select class="mv" onchange="move('${t.id}',this.value)">${opts}</select>
        <button class="del" onclick="del('${t.id}')" title="Delete">×</button>
      </div>`;
    }
    async function addTask(){
      const el=document.getElementById("new"); const txt=el.value.trim(); if(!txt) return;
      el.value="";
      const r=await vmmsApi("/api/v1/todos",{method:"POST",body:JSON.stringify({text:txt})});
      if(!r.ok){ toast("Could not add"); return; }
      await load();
    }
    async function move(id,q){
      const t=TODOS.find(x=>x.id===id); if(t) t.quadrant=q; render();
      await vmmsApi("/api/v1/todos/"+id,{method:"PATCH",body:JSON.stringify({quadrant:q})});
    }
    async function toggleDone(id,done){
      const t=TODOS.find(x=>x.id===id); if(t) t.done=done; render();
      await vmmsApi("/api/v1/todos/"+id,{method:"PATCH",body:JSON.stringify({done})});
    }
    async function del(id){
      TODOS=TODOS.filter(x=>x.id!==id); render();
      await vmmsApi("/api/v1/todos/"+id,{method:"DELETE"});
    }
    /* drag & drop */
    let DRAG=null;
    function dstart(e,id){ DRAG=id; try{e.dataTransfer.setData("text/plain",id);}catch(_){} }
    function dover(e,q){ e.preventDefault(); document.getElementById("col-"+q).classList.add("drag"); }
    function dleave(q){ document.getElementById("col-"+q).classList.remove("drag"); }
    function ddrop(e,q){ e.preventDefault(); document.getElementById("col-"+q).classList.remove("drag"); const id=DRAG||(e.dataTransfer&&e.dataTransfer.getData("text/plain")); if(id) move(id,q); DRAG=null; }

    load();
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>

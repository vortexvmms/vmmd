<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#C00000">
  <title>VCMS — To-do</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <script src="js/theme-boot.js?v=20260927-1"></script><link rel="stylesheet" href="css/theme-boot.css?v=20260927-1"><link rel="stylesheet" href="css/app.css">
  <script src="js/core-bundle.js?v=20260904-history1"></script>
  <script src="js/auth.js?v=20260813-8"></script><script src="js/ui.js?v=20260825-ui5"></script>
  <script>window.esc=window.esc||function(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});};</script>
  <style>
    body.td{ background:#F6F5F2; }
    .qgrid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .col{ background:#fff; border:1px solid #E7E5E1; border-radius:14px; padding:12px; min-height:150px; border-top:4px solid var(--qc,#C00000); }
    .col.drag{ outline:2px dashed var(--qc,#C00000); outline-offset:-4px; }
    .col h3{ margin:0 0 2px; font-size:14px; font-weight:800; } .col .sub{ font-size:11.5px; color:#8A8A8A; margin-bottom:10px; }
    .task{ display:flex; align-items:flex-start; gap:8px; background:#FBFAF8; border:1px solid #ECEAE5; border-radius:10px; padding:9px 10px; margin-bottom:8px; cursor:grab; }
    .task.done{ opacity:.55; } .task.done .tx{ text-decoration:line-through; }
    .task .tx{ flex:1; font-size:13.5px; min-width:0; word-break:break-word; }
    .task input[type=checkbox]{ width:17px; height:17px; margin-top:1px; flex:none; }
    .task .mv{ font-size:11px; border:1px solid #E5E7EB; border-radius:6px; padding:3px 4px; background:#fff; }
    .task .del{ background:none; border:none; color:#C00000; font-weight:700; cursor:pointer; font-size:15px; }
    .addbar{ display:flex; gap:8px; }
    .addbar input{ flex:1; border:1px solid #D1D5DB; border-radius:10px; padding:11px 12px; font-size:15px; }
    .addbar input[type=date]{flex:0 0 155px;color:#475569}
    .addbar button{ background:#C00000; color:#fff; border:none; border-radius:10px; padding:0 18px; font-weight:700; font-size:15px; cursor:pointer; }
    .inbox{ background:#fff; border:1px dashed #CBD5E1; border-radius:14px; padding:12px; margin-top:14px; }
    .due{font-size:11px;color:#667085;margin-top:3px}.due.over{color:#B91C1C;font-weight:800}.due.today{color:#B45309;font-weight:800}
    .todo-tabs{display:flex;gap:6px;margin:0 0 12px;border-bottom:1px solid #D7DBE2}.todo-tab{border:0;background:transparent;padding:10px 14px;color:#667085;font-weight:800;cursor:pointer;border-bottom:3px solid transparent}.todo-tab.active{color:var(--vcms-brand,#C00000);border-bottom-color:var(--vcms-brand,#C00000)}.todo-tab .count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;margin-left:5px;padding:0 6px;border-radius:999px;background:#E9EDF4;font-size:11px}.todo-tab.active .count{background:var(--vcms-brand-soft,#FEE2E2);color:var(--vcms-brand-dark,#991B1B)}
    .completed-panel{background:#fff;border:1px solid #E2E5EA;border-radius:14px;overflow:hidden}.completed-tools{display:grid;grid-template-columns:minmax(220px,1fr) 160px 150px 150px 145px;gap:8px;padding:12px;background:#F8F9FB;border-bottom:1px solid #E2E5EA}.completed-tools input,.completed-tools select{min-width:0;border:1px solid #D1D5DB;border-radius:9px;padding:9px 10px;background:#fff;color:#25324B}.completed-scroll{overflow:auto}.completed-table{width:100%;border-collapse:collapse;min-width:720px}.completed-table th{background:#F2F4F7;color:#475467;font-size:11px;text-align:left;text-transform:uppercase;letter-spacing:.04em;padding:10px 12px}.completed-table td{padding:11px 12px;border-top:1px solid #EAECF0;font-size:13px;vertical-align:top}.completed-table .task-name{font-weight:700;color:#182B49}.completed-table .muted{font-size:11px;color:#7A8599;margin-top:3px}.reopen{border:1px solid var(--vcms-brand-border,#BFDBFE);background:var(--vcms-brand-soft,#EFF6FF);color:var(--vcms-brand-dark,#1E3A8A);border-radius:8px;padding:6px 10px;font-weight:800;cursor:pointer;white-space:nowrap}.empty-completed{text-align:center;color:#8A94A6;padding:36px 16px!important}.completed-pager{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-top:1px solid #E2E5EA;color:#667085;font-size:12px}.completed-pager button{border:1px solid #CBD3DF;border-radius:8px;background:#fff;padding:6px 10px;font-weight:800}.completed-pager button:disabled{opacity:.4}.toast-action{border:0;background:none;color:#fff;text-decoration:underline;font-weight:800;margin-left:10px;cursor:pointer}[hidden]{display:none!important}
    @media (max-width:820px){.qgrid{grid-template-columns:1fr}.addbar{display:grid;grid-template-columns:minmax(0,1fr) 112px}.addbar input{min-width:0;width:100%}.addbar input[type=date]{flex:none;width:112px}.addbar button{grid-column:1/-1;min-height:44px}.task input[type=checkbox]{width:22px;height:22px}.task .mv{min-height:38px}.task .del{width:40px;height:40px;font-size:20px}.completed-tools{grid-template-columns:1fr 1fr}.completed-tools .completed-search{grid-column:1/-1}}
  </style>
</head>
<body class="td min-h-screen flex flex-col">
  <header class="bg-red-700 text-white p-4 shadow sticky top-0 z-10">
    <div class="flex items-center gap-3 max-w-5xl mx-auto w-full">
      <a href="home.html" class="text-2xl font-bold leading-none">‹</a>
      <div class="flex-1"><h1 class="text-lg font-bold">To-do</h1><p class="text-red-100 text-xs">Plan your day — drag tasks into the right box</p></div>
    </div>
  </header>

  <main class="flex-1 p-4 max-w-5xl mx-auto w-full pb-16">
    <div class="todo-tabs" role="tablist" aria-label="To-do views">
      <button class="todo-tab active" id="tab-active" role="tab" aria-selected="true" aria-controls="active-view" onclick="showView('active')">Active <span class="count" id="active-count">0</span></button>
      <button class="todo-tab" id="tab-completed" role="tab" aria-selected="false" aria-controls="completed-view" onclick="showView('completed')">Completed <span class="count" id="completed-count">0</span></button>
    </div>
    <section id="active-view" role="tabpanel" aria-labelledby="tab-active">
    <div class="addbar">
      <input id="new" placeholder="What do you need to do today?" onkeydown="if(event.key==='Enter')addTask()">
      <input id="due" type="date" title="Task deadline">
      <button onclick="addTask()">Add</button>
    </div>

    <div class="inbox" id="col-inbox" ondragover="dover(event,'inbox')" ondragleave="dleave('inbox')" ondrop="ddrop(event,'inbox')">
      <h3 style="margin:0 0 8px;font-size:13px;font-weight:800;color:#475569">Inbox — new tasks to sort</h3>
      <div id="list-inbox"></div>
    </div>

    <div class="qgrid" style="margin-top:14px">
      <div class="col" id="col-q1" style="--qc:#C00000" ondragover="dover(event,'q1')" ondragleave="dleave('q1')" ondrop="ddrop(event,'q1')">
        <h3>Do first</h3><div class="sub">Urgent &amp; important</div><div id="list-q1"></div>
      </div>
      <div class="col" id="col-q2" style="--qc:#2563EB" ondragover="dover(event,'q2')" ondragleave="dleave('q2')" ondrop="ddrop(event,'q2')">
        <h3>Schedule</h3><div class="sub">Important, not urgent</div><div id="list-q2"></div>
      </div>
      <div class="col" id="col-q3" style="--qc:#D97706" ondragover="dover(event,'q3')" ondragleave="dleave('q3')" ondrop="ddrop(event,'q3')">
        <h3>Delegate</h3><div class="sub">Urgent, not important</div><div id="list-q3"></div>
      </div>
      <div class="col" id="col-q4" style="--qc:#8A8A8A" ondragover="dover(event,'q4')" ondragleave="dleave('q4')" ondrop="ddrop(event,'q4')">
        <h3>Eliminate</h3><div class="sub">Neither — drop or defer</div><div id="list-q4"></div>
      </div>
    </div>
    </section>

    <section id="completed-view" role="tabpanel" aria-labelledby="tab-completed" hidden>
      <div class="completed-panel">
        <div class="completed-tools">
          <input class="completed-search" id="completed-search" type="search" placeholder="Search completed activities…" oninput="renderCompleted()">
          <select id="completed-period" onchange="renderCompleted()" aria-label="Completion period"><option value="all">All completed</option><option value="today">Today</option><option value="week">Last 7 days</option><option value="month">Last 30 days</option></select>
          <select id="completed-quadrant" onchange="renderCompleted()" aria-label="Original quadrant"><option value="all">All quadrants</option><option value="inbox">Inbox</option><option value="q1">Do first</option><option value="q2">Schedule</option><option value="q3">Delegate</option><option value="q4">Eliminate</option></select>
          <select id="completed-source" onchange="resetCompletedPage()" aria-label="Activity source"><option value="all">All sources</option><option value="manual">Manual activities</option><option value="dpr_missing">DPR reminders</option></select>
          <select id="completed-sort" onchange="renderCompleted()" aria-label="Sort completed activities"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="name">Activity A–Z</option></select>
        </div>
        <div class="completed-scroll"><table class="completed-table"><thead><tr><th>Completed</th><th>Activity</th><th>Original quadrant</th><th>Deadline</th><th>Action</th></tr></thead><tbody id="completed-list"></tbody></table></div>
        <div class="completed-pager"><span id="completed-page-info"></span><div><button id="completed-prev" onclick="changeCompletedPage(-1)">Previous</button> <button id="completed-next" onclick="changeCompletedPage(1)">Next</button></div></div>
      </div>
    </section>
  </main>

  <div id="toast" class="hidden fixed bottom-10 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-sm px-4 py-2 rounded-full shadow z-50"></div>

  <script>
    requireLogin();
    let TODOS=[];
    const QCOLS=["inbox","q1","q2","q3","q4"];
    const QNAMES={inbox:"Inbox",q1:"Do first",q2:"Schedule",q3:"Delegate",q4:"Eliminate"};
    let TOAST_TIMER=null, LAST_COMPLETED=null;
    function toast(m,action){ const t=document.getElementById("toast"); clearTimeout(TOAST_TIMER); t.innerHTML=`${esc(m)}${action?'<button class="toast-action" onclick="undoComplete()">Undo</button>':''}`; t.classList.remove("hidden"); TOAST_TIMER=setTimeout(()=>t.classList.add("hidden"),4000); }

    async function load(){
      const r=await vmmsApi("/api/v1/todos"); TODOS=r.ok?await r.json():[];
      render();
    }
    function render(){
      const active=TODOS.filter(t=>!t.done), completed=TODOS.filter(t=>t.done);
      document.getElementById("active-count").textContent=active.length;
      document.getElementById("completed-count").textContent=completed.length;
      QCOLS.forEach(q=>{
        const items=active.filter(t=>(t.quadrant||"inbox")===q);
        document.getElementById("list-"+q).innerHTML=items.map(t=>taskHTML(t)).join("")
          || (q==="inbox"?'<p style="color:#9CA3AF;font-size:12.5px">Add a task above — it lands here to sort.</p>':'<p style="color:#CBD5E1;font-size:12px">—</p>');
      });
      renderCompleted();
    }
    function taskHTML(t){
      const opts=QCOLS.map(q=>`<option value="${q}" ${((t.quadrant||"inbox")===q)?"selected":""}>${QNAMES[q]}</option>`).join("");
      return `<div class="task ${t.done?"done":""}" draggable="true" ondragstart="dstart(event,'${t.id}')" id="t-${t.id}">
        <input type="checkbox" ${t.done?"checked":""} onchange="toggleDone('${t.id}',this.checked)">
        <div class="tx">${esc(t.text)}${dueHTML(t)}</div>
        <select class="mv" onchange="move('${t.id}',this.value)">${opts}</select>
        <button class="del" onclick="del('${t.id}')" title="Delete">×</button>
      </div>`;
    }
    async function addTask(){
      const el=document.getElementById("new"); const txt=el.value.trim(); if(!txt) return;
      const due=document.getElementById("due");
      el.value="";
      const r=await vmmsApi("/api/v1/todos",{method:"POST",body:JSON.stringify({text:txt,due_date:due.value||null})});
      if(!r.ok){ toast("Could not add"); return; }
      await load();
    }
    function dueHTML(t){if(!t.due_date)return "";const today=new Date().toLocaleDateString("en-CA"),cl=t.due_date<today?" over":(t.due_date===today?" today":"");return `<div class="due${cl}">Deadline: ${t.due_date.split("-").reverse().join("/")}${cl===" over"?" · OVERDUE":cl===" today"?" · TODAY":""}</div>`;}
    async function move(id,q){
      const t=TODOS.find(x=>x.id===id); if(t) t.quadrant=q; render();
      await vmmsApi("/api/v1/todos/"+id,{method:"PATCH",body:JSON.stringify({quadrant:q})});
    }
    async function toggleDone(id,done){
      const t=TODOS.find(x=>x.id===id); if(t){t.done=done;t.updated_at=new Date().toISOString();} render();
      const r=await vmmsApi("/api/v1/todos/"+id,{method:"PATCH",body:JSON.stringify({done})});
      if(!r.ok){if(t)t.done=!done;render();toast("Could not update activity");return;}
      if(done){LAST_COMPLETED=id;toast("Activity moved to Completed",true);}
    }
    function showView(view){const completed=view==="completed";document.getElementById("active-view").hidden=completed;document.getElementById("completed-view").hidden=!completed;document.getElementById("tab-active").classList.toggle("active",!completed);document.getElementById("tab-completed").classList.toggle("active",completed);document.getElementById("tab-active").setAttribute("aria-selected",String(!completed));document.getElementById("tab-completed").setAttribute("aria-selected",String(completed));if(completed)renderCompleted();}
    function completedTime(t){return new Date(t.updated_at||t.created_at||0).getTime();}
    function completedDate(t){const d=new Date(t.updated_at||t.created_at||0);return isNaN(d)?"—":d.toLocaleString("en-SG",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});}
    function renderCompleted(){const body=document.getElementById("completed-list");if(!body)return;const search=document.getElementById("completed-search").value.trim().toLowerCase(),period=document.getElementById("completed-period").value,quadrant=document.getElementById("completed-quadrant").value,sort=document.getElementById("completed-sort").value;const now=Date.now(),day=86400000;let rows=TODOS.filter(t=>t.done&&(!search||String(t.text||"").toLowerCase().includes(search))&&(quadrant==="all"||(t.quadrant||"inbox")===quadrant));if(period!=="all"){const age=period==="today"?day:period==="week"?7*day:30*day;rows=rows.filter(t=>now-completedTime(t)<age);}rows.sort((a,b)=>sort==="name"?String(a.text).localeCompare(String(b.text)):sort==="oldest"?completedTime(a)-completedTime(b):completedTime(b)-completedTime(a));body.innerHTML=rows.length?rows.map(t=>`<tr><td>${completedDate(t)}</td><td><div class="task-name">${esc(t.text)}</div><div class="muted">Created ${new Date(t.created_at).toLocaleDateString("en-SG")}</div></td><td>${esc(QNAMES[t.quadrant||"inbox"])}</td><td>${t.due_date?esc(t.due_date.split("-").reverse().join("/")):"—"}</td><td><button class="reopen" onclick="toggleDone('${t.id}',false)">Reopen</button></td></tr>`).join(""):'<tr><td class="empty-completed" colspan="5">No completed activities match these filters.</td></tr>';}
    let COMPLETED_PAGE=1;
    const COMPLETED_PAGE_SIZE=25;
    function resetCompletedPage(){COMPLETED_PAGE=1;renderCompleted();}
    function changeCompletedPage(delta){COMPLETED_PAGE+=delta;renderCompleted();}
    function sourceLabel(t){return t.source==="dpr_missing"?"DPR reminder":"Manual";}
    function renderCompleted(){
      const body=document.getElementById("completed-list");if(!body)return;
      const search=document.getElementById("completed-search").value.trim().toLowerCase();
      const period=document.getElementById("completed-period").value;
      const quadrant=document.getElementById("completed-quadrant").value;
      const source=document.getElementById("completed-source").value;
      const sort=document.getElementById("completed-sort").value;
      const now=Date.now(),day=86400000;
      let rows=TODOS.filter(t=>t.done&&(!search||String(t.text||"").toLowerCase().includes(search)));
      rows=rows.filter(t=>quadrant==="all"||(t.quadrant||"inbox")===quadrant);
      rows=rows.filter(t=>source==="all"||(source==="manual"?!t.source:t.source===source));
      if(period!=="all"){
        const age=period==="today"?day:period==="week"?7*day:30*day;
        rows=rows.filter(t=>now-completedTime(t)<age);
      }
      rows.sort((a,b)=>sort==="name"?String(a.text).localeCompare(String(b.text)):
        sort==="oldest"?completedTime(a)-completedTime(b):completedTime(b)-completedTime(a));
      const pages=Math.max(1,Math.ceil(rows.length/COMPLETED_PAGE_SIZE));
      COMPLETED_PAGE=Math.min(Math.max(1,COMPLETED_PAGE),pages);
      const shown=rows.slice((COMPLETED_PAGE-1)*COMPLETED_PAGE_SIZE,COMPLETED_PAGE*COMPLETED_PAGE_SIZE);
      body.innerHTML=shown.length?shown.map(t=>completedRow(t)).join(""):
        '<tr><td class="empty-completed" colspan="5">No completed activities match these filters.</td></tr>';
      document.getElementById("completed-page-info").textContent=rows.length?
        `Showing ${(COMPLETED_PAGE-1)*COMPLETED_PAGE_SIZE+1}–${Math.min(COMPLETED_PAGE*COMPLETED_PAGE_SIZE,rows.length)} of ${rows.length}`:"0 activities";
      document.getElementById("completed-prev").disabled=COMPLETED_PAGE<=1;
      document.getElementById("completed-next").disabled=COMPLETED_PAGE>=pages;
    }
    function completedRow(t){
      const created=new Date(t.created_at).toLocaleDateString("en-SG");
      const deadline=t.due_date?esc(t.due_date.split("-").reverse().join("/")):"—";
      return `<tr><td>${completedDate(t)}</td><td><div class="task-name">${esc(t.text)}</div>`+
        `<div class="muted">${sourceLabel(t)} · Created ${created}</div></td>`+
        `<td>${esc(QNAMES[t.quadrant||"inbox"])}</td><td>${deadline}</td>`+
        `<td><button class="reopen" onclick="toggleDone('${t.id}',false)">Reopen</button></td></tr>`;
    }
    async function undoComplete(){if(!LAST_COMPLETED)return;const id=LAST_COMPLETED;LAST_COMPLETED=null;document.getElementById("toast").classList.add("hidden");await toggleDone(id,false);}
    async function del(id){
      TODOS=TODOS.filter(x=>x.id!==id); render();
      await vmmsApi("/api/v1/todos/"+id,{method:"DELETE"});
    }
    /* drag & drop */
    let DRAG=null;
    function dstart(e,id){ DRAG=id; try{e.dataTransfer.setData("text/plain",id);}catch(_){} }
    function dover(e,q){ e.preventDefault(); document.getElementById("col-"+q).classList.add("drag"); }
    function dleave(q){ document.getElementById("col-"+q).classList.remove("drag"); }
    function ddrop(e,q){ e.preventDefault(); document.getElementById("col-"+q).classList.remove("drag"); const id=DRAG||(e.dataTransfer&&e.dataTransfer.getData("text/plain")); if(id) move(id,q); DRAG=null; }

    load();
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>

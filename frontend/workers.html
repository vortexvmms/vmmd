<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#C00000">
  <title>VCMS — Workers</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/core-bundle.js?v=20260825-ui1"></script>
  <script src="js/auth.js?v=20260813-8"></script><script src="js/ui.js?v=20260825-ui1"></script>
  <script>window.esc=window.esc||function(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});};window.VMMS_TIER=window.VMMS_TIER||{full:["admin","general_manager","operation_manager","hr_assistant"],manager:["main_sup","wshc_lead"],supervisor:["site_sup","safety_sup","wshc","logistics_sup"]};window.isFull=window.isFull||function(r){return VMMS_TIER.full.indexOf(r)!==-1};window.isManager=window.isManager||function(r){return VMMS_TIER.manager.indexOf(r)!==-1};window.isSupervisor=window.isSupervisor||function(r){return VMMS_TIER.supervisor.indexOf(r)!==-1};window.isCoordinator=window.isCoordinator||function(r){return isFull(r)||isManager(r)};</script>
  <style>
    .desktop-only{display:none}.worker-desktop{display:none}
    @media(min-width:900px){
      body{background:#E7EAF0!important}.mobile-only{display:none!important}.desktop-only{display:flex!important}
      body>header{padding:13px 24px!important;display:flex!important;align-items:center!important;width:100%!important}body>header>div.flex-1{flex:1 1 auto!important;min-width:240px!important}body>header #count{white-space:nowrap}.worker-head-actions{gap:9px;margin-left:auto}.worker-head-actions button{border:0;border-radius:9px;padding:9px 15px;font-weight:800;font-size:13px;cursor:pointer}.wa-bulk{background:#242B35;color:#fff}.wa-add{background:#fff;color:#A00000}
      body main.worker-main{max-width:none!important;width:100%!important;margin:0!important;padding:20px 24px 40px!important;box-sizing:border-box}.worker-desktop{display:block!important;width:100%}
      #list,#empty{display:none!important}
      .worker-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}.wkpi{background:#fff;border:1px solid #D7DCE4;border-top:4px solid #C00000;border-radius:13px;padding:14px 16px;text-align:left;box-shadow:0 4px 14px rgba(15,23,42,.055);cursor:pointer}.wkpi:hover{transform:translateY(-2px);box-shadow:0 9px 20px rgba(15,23,42,.1)}.wkpi b{display:block;font-size:27px;color:#171B22}.wkpi span{font-size:12px;font-weight:800;color:#667085}.wkpi.active{background:#FFF3F3;border-color:#D89A9A}.wkpi[data-status="active"]{border-top-color:#16A34A}.wkpi[data-status="on_leave"]{border-top-color:#D97706}.wkpi[data-status="inactive"]{border-top-color:#6B7280}
      .worker-tools{position:sticky;top:126px;z-index:6;display:grid;grid-template-columns:minmax(260px,1fr) 170px 190px 190px 170px auto;gap:9px;padding:11px;background:#fff;border:1px solid #D7DCE4;border-radius:13px 13px 0 0;box-shadow:0 5px 14px rgba(15,23,42,.06)}.worker-tools input,.worker-tools select{height:40px;border:1px solid #CBD2DC;border-radius:8px;padding:0 11px;background:#fff;font-size:13px}.worker-tools button{border:0;border-radius:8px;background:#EEF0F3;color:#374151;font-weight:800;padding:0 13px}
      .worker-table-wrap{background:#fff;border:1px solid #D7DCE4;border-top:0;border-radius:0 0 13px 13px;overflow:auto}.worker-table{width:100%;border-collapse:collapse;font-size:13px}.worker-table th{background:#2D3646;color:#fff;text-transform:uppercase;letter-spacing:.04em;font-size:11px;text-align:left;padding:11px 14px}.worker-table td{padding:11px 14px;border-bottom:1px solid #E8EBEF;color:#344054}.worker-table tbody tr:nth-child(even){background:#F8F9FB}.worker-table tbody tr:hover{background:#FFF4F4}.worker-table .wname{font-weight:800;color:#1D2430}.status-badge{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800}.st-active{background:#DCFCE7;color:#16733A}.st-on_leave{background:#FEF3C7;color:#925B08}.st-inactive{background:#E5E7EB;color:#596273}.edit-worker{border:1px solid #D6DAE1;background:#fff;color:#A40000;border-radius:7px;padding:6px 10px;font-size:11px;font-weight:800}.worker-empty{text-align:center!important;padding:30px!important;color:#98A2B3!important}
      #fab,#fab-bulk{display:none!important}
      body:not(.can-edit) .worker-head-actions{display:none!important}
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <header class="bg-red-700 text-white p-4 shadow flex items-center gap-3 sticky top-0 z-10">
    <a href="home.html" class="text-2xl font-bold leading-none">‹</a>
    <div class="flex-1">
      <h1 class="text-lg font-bold">Workers</h1>
      <p class="text-red-100 text-xs" id="count">Loading…</p>
    </div>
    <div id="head-actions" class="desktop-only worker-head-actions">
      <button class="wa-bulk" onclick="openBulk()">Bulk Add</button><button class="wa-add" onclick="openForm()">+ Add Worker</button>
    </div>
  </header>

  <main class="worker-main flex-1 p-4 w-full pb-24">

    <div class="mobile-only"><input id="search" type="search" placeholder="Search name or worker ID…"
           class="w-full border border-gray-300 rounded-lg p-3 text-base mb-3 focus:outline-none focus:ring-2 focus:ring-red-600">

    <div class="flex gap-2 mb-4 text-sm font-medium" id="chips">
      <button data-f="" class="chip bg-red-700 text-white px-3 py-1.5 rounded-full">All</button>
      <button data-f="active" class="chip bg-white text-gray-700 px-3 py-1.5 rounded-full border">Active</button>
      <button data-f="on_leave" class="chip bg-white text-gray-700 px-3 py-1.5 rounded-full border">On Leave</button>
      <button data-f="inactive" class="chip bg-white text-gray-700 px-3 py-1.5 rounded-full border">Inactive</button>
    </div></div>

    <style>.grid3{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:640px){.grid3{grid-template-columns:repeat(2,1fr)}}@media(min-width:1024px){.grid3{grid-template-columns:repeat(3,1fr)}}@media(min-width:900px){#list.grid3,#empty{display:none!important}.worker-desktop{display:block!important}}</style>
    <div id="list" class="grid3"></div>
    <p id="empty" class="hidden text-center text-gray-400 mt-10">No workers found.</p>

    <section class="worker-desktop">
      <div class="worker-kpis" id="worker-kpis"></div>
      <div class="worker-tools">
        <input id="d-search" type="search" placeholder="Search worker name or ID…">
        <select id="d-status"><option value="">All statuses</option><option value="active">Active</option><option value="on_leave">On Leave</option><option value="inactive">Inactive</option></select>
        <select id="d-site"><option value="">All current sites</option></select>
        <select id="d-trade"><option value="">All trades</option></select>
        <select id="d-sort"><option value="name">Sort: Name</option><option value="code">Sort: Worker ID</option><option value="site">Sort: Current site</option><option value="status">Sort: Status</option></select>
        <button onclick="clearDesktopFilters()">Clear</button>
      </div>
      <div class="worker-table-wrap"><table class="worker-table"><thead><tr><th>Worker ID</th><th>Worker name</th><th>Trade</th><th>Current site</th><th>Status</th><th>Actions</th></tr></thead><tbody id="worker-tbody"></tbody></table></div>
    </section>
  </main>

  <!-- Add buttons (admin only) -->
  <button id="fab-bulk" onclick="openBulk()" class="hidden fixed bottom-6 right-24 bg-gray-800 hover:bg-gray-900 text-white text-xs font-bold px-4 h-14 rounded-full shadow-lg">BULK<br>ADD</button>
  <button id="fab" onclick="openForm()" class="hidden fixed bottom-6 right-6 bg-red-700 hover:bg-red-800 text-white text-3xl w-14 h-14 rounded-full shadow-lg leading-none">+</button>

  <!-- Bulk import modal -->
  <div id="bulk-modal" class="hidden fixed inset-0 bg-black/50 z-20 flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-6 max-h-[90vh] overflow-y-auto">
      <h2 class="text-lg font-bold text-gray-800 mb-1">Bulk Add Workers</h2>
      <p class="text-xs text-gray-500 mb-3">One worker per line: <b>ID, Full Name</b><br>Example:<br><span class="font-mono">W013, Arumugam Kumaravel<br>W014, Ali Md Shujon</span><br>Existing IDs are skipped, never overwritten.</p>
      <textarea id="bulk-text" rows="10" placeholder="W013, Worker Name&#10;W014, Worker Name"
                class="w-full border border-gray-300 rounded-lg p-3 text-sm font-mono mb-2"></textarea>
      <p id="bulk-result" class="hidden text-sm rounded-lg p-3 mb-2"></p>
      <div class="flex gap-3">
        <button onclick="closeBulk()" class="flex-1 border border-gray-300 text-gray-700 font-bold py-3 rounded-lg">Close</button>
        <button id="bulk-save" onclick="runBulk()" class="flex-1 bg-red-700 hover:bg-red-800 text-white font-bold py-3 rounded-lg">Import</button>
      </div>
    </div>
  </div>

  <!-- Add/Edit modal -->
  <div id="modal" class="hidden fixed inset-0 bg-black/50 z-20 flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-6">
      <h2 id="m-title" class="text-lg font-bold text-gray-800 mb-4">Add Worker</h2>

      <label class="block text-sm font-medium text-gray-700 mb-1">Worker ID</label>
      <input id="m-code" class="w-full border border-gray-300 rounded-lg p-3 text-base mb-3 uppercase" placeholder="e.g. W013">

      <label class="block text-sm font-medium text-gray-700 mb-1">Full Name (as in WhatsApp message)</label>
      <input id="m-name" class="w-full border border-gray-300 rounded-lg p-3 text-base mb-3" placeholder="e.g. Arumugam Kumaravel">

      <div id="m-status-wrap" class="hidden">
        <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
        <select id="m-status" class="w-full border border-gray-300 rounded-lg p-3 text-base mb-3 bg-white">
          <option value="active">Active</option>
          <option value="on_leave">On Leave (overseas)</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>

      <p id="m-error" class="text-sm font-medium text-red-600 hidden mb-2"></p>

      <div class="flex gap-3 mt-2">
        <button onclick="closeForm()" class="flex-1 border border-gray-300 text-gray-700 font-bold py-3 rounded-lg">Cancel</button>
        <button id="m-save" onclick="save()" class="flex-1 bg-red-700 hover:bg-red-800 text-white font-bold py-3 rounded-lg">Save</button>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-sm px-4 py-2 rounded-full shadow"></div>

  <script>
    requireLogin();

    let ME = null, ALL = [], ALLOCS = [], FILTER = "", EDIT_ID = null;

    const STATUS_CHIP = {
      active:   ["Active", "bg-green-100 text-green-700"],
      on_leave: ["On Leave", "bg-yellow-100 text-yellow-700"],
      inactive: ["Inactive", "bg-gray-200 text-gray-500"],
    };

    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.classList.remove("hidden");
      setTimeout(() => t.classList.add("hidden"), 2500);
    }

    async function boot() {
      const r = await vmmsApi("/api/v1/me");
      if (!r.ok) { vmmsLogout(); return; }
      ME = await r.json();
      if (isFull(ME.role)) {
        document.body.classList.add("can-edit");
        document.getElementById("fab").classList.remove("hidden");
        document.getElementById("fab-bulk").classList.remove("hidden");
      }
      await load();
    }

    async function load() {
      const r = await vmmsApi("/api/v1/workers");
      if (!r.ok) { toast("Could not load workers"); return; }
      ALL = await r.json();
      if (window.innerWidth >= 900) {
        try { const d=new Date(),iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; const ra=await vmmsApi(`/api/v1/allocations?date=${iso}`); ALLOCS=ra.ok?await ra.json():[]; } catch(e){ ALLOCS=[]; }
      }
      render();
    }

    function render() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const rows = ALL.filter(w =>
        (!FILTER || w.status === FILTER) &&
        (!q || w.name.toLowerCase().includes(q) || w.worker_code.toLowerCase().includes(q))
      );
      document.getElementById("count").textContent =
        `${rows.length} shown · ${ALL.filter(w => w.status === "active").length} active of ${ALL.length}`;
      const list = document.getElementById("list");
      list.innerHTML = "";
      document.getElementById("empty").classList.toggle("hidden", rows.length > 0);
      rows.forEach(w => {
        const [label, cls] = STATUS_CHIP[w.status] || [w.status, "bg-gray-100"];
        const div = document.createElement("div");
        div.className = "bg-white rounded-xl shadow p-4 flex items-center justify-between";
        div.innerHTML =
          `<div><p class="font-medium text-gray-800">${esc(w.name)}</p>
           <p class="text-xs text-gray-400">${esc(w.worker_code)}</p></div>
           <span class="text-xs font-bold px-3 py-1 rounded-full ${cls}">${label}</span>`;
        if (isFull(ME.role)) {
          div.classList.add("cursor-pointer", "active:bg-gray-50");
          div.onclick = () => openForm(w);
        }
        list.appendChild(div);
      });
      renderDesktop();
    }

    function currentSite(workerId){const a=ALLOCS.find(x=>x.worker_id===workerId);return a?a.site_name:"—"}
    function renderDesktop(){
      if(window.innerWidth<900)return;
      const counts={all:ALL.length,active:ALL.filter(x=>x.status==="active").length,on_leave:ALL.filter(x=>x.status==="on_leave").length,inactive:ALL.filter(x=>x.status==="inactive").length};
      document.getElementById("worker-kpis").innerHTML=[["","Total workers",counts.all],["active","Active",counts.active],["on_leave","On leave",counts.on_leave],["inactive","Inactive",counts.inactive]].map(([s,l,n])=>`<button class="wkpi${document.getElementById("d-status").value===s?' active':''}" data-status="${s}" onclick="setDesktopStatus('${s}')"><b>${n}</b><span>${l}</span></button>`).join("");
      const sites=[...new Set(ALLOCS.map(x=>x.site_name).filter(Boolean))].sort(), trades=[...new Set(ALL.map(x=>(x.trade||"").trim()).filter(Boolean))].sort();
      const ds=document.getElementById("d-site"),dt=document.getElementById("d-trade"),sv=ds.value,tv=dt.value;
      ds.innerHTML='<option value="">All current sites</option>'+sites.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");ds.value=sv;
      dt.innerHTML='<option value="">All trades</option>'+trades.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");dt.value=tv;
      const q=document.getElementById("d-search").value.trim().toLowerCase(),st=document.getElementById("d-status").value,site=ds.value,trade=dt.value,sort=document.getElementById("d-sort").value;
      let rows=ALL.filter(w=>(!st||w.status===st)&&(!site||currentSite(w.id)===site)&&(!trade||(w.trade||"")===trade)&&(!q||w.name.toLowerCase().includes(q)||w.worker_code.toLowerCase().includes(q)));
      rows.sort((a,b)=>{if(sort==="code")return a.worker_code.localeCompare(b.worker_code);if(sort==="site")return currentSite(a.id).localeCompare(currentSite(b.id))||a.name.localeCompare(b.name);if(sort==="status")return a.status.localeCompare(b.status)||a.name.localeCompare(b.name);return a.name.localeCompare(b.name)});
      const labels={active:"Active",on_leave:"On Leave",inactive:"Inactive"};
      document.getElementById("worker-tbody").innerHTML=rows.length?rows.map(w=>`<tr><td><b>${esc(w.worker_code)}</b></td><td class="wname">${esc(w.name)}</td><td>${esc(w.trade||"—")}</td><td>${esc(currentSite(w.id))}</td><td><span class="status-badge st-${w.status}">${labels[w.status]||esc(w.status)}</span></td><td>${isFull(ME.role)?`<button class="edit-worker" onclick="openWorker('${w.id}')">Edit</button>`:'—'}</td></tr>`).join(""):'<tr><td colspan="6" class="worker-empty">No workers match these filters.</td></tr>';
      document.getElementById("count").textContent=`${rows.length} shown · ${counts.active} active of ${counts.all}`;
    }
    function setDesktopStatus(s){document.getElementById("d-status").value=s;renderDesktop()}
    function openWorker(id){const w=ALL.find(x=>x.id===id);if(w)openForm(w)}
    function clearDesktopFilters(){document.getElementById("d-search").value="";document.getElementById("d-status").value="";document.getElementById("d-site").value="";document.getElementById("d-trade").value="";document.getElementById("d-sort").value="name";renderDesktop()}

    function openForm(w = null) {
      EDIT_ID = w ? w.id : null;
      document.getElementById("m-title").textContent = w ? "Edit Worker" : "Add Worker";
      document.getElementById("m-code").value = w ? w.worker_code : "";
      document.getElementById("m-code").disabled = !!w;   // Worker ID immutable (spec FR-2)
      document.getElementById("m-name").value = w ? w.name : "";
      document.getElementById("m-name").disabled = false;   // full-access tier edits everything
      document.getElementById("m-status-wrap").classList.toggle("hidden", !w);
      if (w) document.getElementById("m-status").value = w.status;
      document.getElementById("m-error").classList.add("hidden");
      document.getElementById("modal").classList.remove("hidden");
    }

    function closeForm() { document.getElementById("modal").classList.add("hidden"); }

    async function save() {
      const err = document.getElementById("m-error");
      const btn = document.getElementById("m-save");
      err.classList.add("hidden");
      btn.disabled = true; btn.textContent = "Saving…";
      try {
        let r;
        if (EDIT_ID) {
          r = await vmmsApi(`/api/v1/workers/${EDIT_ID}`, {
            method: "PATCH",
            body: JSON.stringify({
              name: document.getElementById("m-name").disabled ? undefined : document.getElementById("m-name").value,
              status: document.getElementById("m-status").value,
            }),
          });
        } else {
          r = await vmmsApi("/api/v1/workers", {
            method: "POST",
            body: JSON.stringify({
              worker_code: document.getElementById("m-code").value,
              name: document.getElementById("m-name").value,
            }),
          });
        }
        const data = await r.json();
        if (!r.ok) throw new Error(data.detail || "Could not save");
        closeForm();
        toast(EDIT_ID ? "Worker updated" : "Worker added");
        await load();
      } catch (ex) {
        err.textContent = ex.message; err.classList.remove("hidden");
      } finally {
        btn.disabled = false; btn.textContent = "Save";
      }
    }

    function openBulk() {
      document.getElementById("bulk-result").classList.add("hidden");
      document.getElementById("bulk-modal").classList.remove("hidden");
    }
    function closeBulk() { document.getElementById("bulk-modal").classList.add("hidden"); }

    async function runBulk() {
      const lines = document.getElementById("bulk-text").value.split("\n")
        .map(l => l.trim()).filter(l => l);
      const workers = lines.map(l => {
        const i = l.indexOf(",");
        return i > 0
          ? { worker_code: l.slice(0, i).trim(), name: l.slice(i + 1).trim() }
          : { worker_code: "", name: l };   // missing comma -> flagged by server
      });
      if (!workers.length) { toast("Paste your list first"); return; }
      const btn = document.getElementById("bulk-save");
      btn.disabled = true; btn.textContent = "Importing…";
      try {
        const r = await vmmsApi("/api/v1/workers/bulk", {
          method: "POST", body: JSON.stringify({ workers }) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || "Import failed");
        const res = document.getElementById("bulk-result");
        res.className = "text-sm rounded-lg p-3 mb-2 bg-green-50 text-green-800 border border-green-200";
        res.innerHTML = `✓ ${d.added} added · ${d.skipped_existing} already existed (skipped)` +
          (d.line_errors.length ? `<br>⚠ ${d.line_errors.join("<br>⚠ ")}` : "");
        res.classList.remove("hidden");
        await load();
      } catch (ex) {
        const res = document.getElementById("bulk-result");
        res.className = "text-sm rounded-lg p-3 mb-2 bg-red-50 text-red-700 border border-red-200";
        res.textContent = ex.message;
        res.classList.remove("hidden");
      } finally {
        btn.disabled = false; btn.textContent = "Import";
      }
    }

    document.getElementById("search").addEventListener("input", render);
    ["d-search","d-status","d-site","d-trade","d-sort"].forEach(id=>document.getElementById(id).addEventListener(id==="d-search"?"input":"change",renderDesktop));
    document.getElementById("chips").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      FILTER = b.dataset.f;
      document.querySelectorAll(".chip").forEach(c => {
        c.className = "chip px-3 py-1.5 rounded-full " +
          (c === b ? "bg-red-700 text-white" : "bg-white text-gray-700 border");
      });
      render();
    });

    boot();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#C00000">
  <title>VCMS — Manpower Request</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/core-bundle.js?v=20260825-core1"></script>
  <script src="js/auth.js?v=20260813-8"></script><script src="js/ui.js?v=20260825-core1"></script>
  <script>window.esc=window.esc||function(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});};window.VMMS_TIER=window.VMMS_TIER||{full:["admin","general_manager","operation_manager","hr_assistant"],manager:["main_sup","wshc_lead"],supervisor:["site_sup","safety_sup","wshc","logistics_sup"]};window.isFull=window.isFull||function(r){return VMMS_TIER.full.indexOf(r)!==-1};window.isManager=window.isManager||function(r){return VMMS_TIER.manager.indexOf(r)!==-1};window.isSupervisor=window.isSupervisor||function(r){return VMMS_TIER.supervisor.indexOf(r)!==-1};window.isCoordinator=window.isCoordinator||function(r){return isFull(r)||isManager(r)};</script>
  <style>@media(max-width:899px){#request-helper{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:10px!important}#request-helper>p{width:100%!important;margin:0!important;line-height:1.45!important}#request-helper>.request-copy-tools{width:100%!important;justify-content:flex-start!important;flex-wrap:nowrap!important}#copyfrom{flex:1 1 auto!important;min-width:0!important}#copylast{flex:0 0 auto!important}}</style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <header class="bg-red-700 text-white p-4 shadow sticky top-0 z-10">
    <div class="flex items-center gap-3 max-w-6xl mx-auto w-full">
      <a href="home.html" class="text-2xl font-bold leading-none">‹</a>
      <div class="flex-1">
        <h1 class="text-lg font-bold">Request Manpower</h1>
        <p class="text-red-100 text-xs" id="summary">Loading…</p>
      </div>
    </div>
    <div class="flex gap-2 mt-3 max-w-6xl mx-auto w-full">
      <input id="date" type="date"
             class="flex-1 md:max-w-xs rounded-lg p-2 text-gray-800 text-base">
      <select id="site" class="flex-1 md:max-w-sm rounded-lg p-2 text-gray-800 text-base bg-white"></select>
    </div>
  </header>

  <main class="flex-1 p-4 max-w-md md:max-w-6xl mx-auto w-full pb-32">
    <div id="request-helper" class="flex items-center justify-between gap-3 mb-3">
      <p class="text-xs text-gray-500">
        Tick the workers you want at your site for the chosen day, then Send Request.
        The allocator sees your request while planning the next day.
      </p>
      <div class="request-copy-tools shrink-0 flex items-center gap-1 flex-wrap justify-end">
        <select id="copyfrom" class="border border-gray-300 rounded-lg p-2 text-xs bg-white"></select>
        <button onclick="copyFromDay()" class="bg-gray-800 hover:bg-gray-900 text-white text-xs font-bold px-3 py-2 rounded-lg">Copy day</button>
        <button id="copylast" onclick="copyLast()" class="bg-gray-700 hover:bg-gray-800 text-white text-xs font-bold px-3 py-2 rounded-lg whitespace-nowrap">Copy last</button>
      </div>
    </div>

    <div id="siteoffbar" class="mb-3"></div>
    <div id="reqstatus" class="hidden rounded-xl p-3 mb-3 text-sm"></div>

    <input id="search" type="search" placeholder="Search worker…"
           class="w-full border border-gray-300 rounded-lg p-3 text-base mb-3 focus:outline-none focus:ring-2 focus:ring-red-600">

    <label class="flex items-center gap-2 text-sm font-medium text-gray-700 mb-3 whitespace-nowrap">
      <input id="only-sel" type="checkbox" class="accent-red-700">
      <span id="only-sel-label">Review my picked workers</span>
    </label>

    <div id="list" class="space-y-2 md:space-y-0 md:grid md:grid-cols-2 lg:grid-cols-3 md:gap-2"></div>
    <p id="empty" class="hidden text-center text-gray-400 mt-10">No workers.</p>
  </main>

  <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-3 z-10">
    <div class="max-w-md md:max-w-6xl mx-auto flex items-center gap-3">
      <p class="text-sm text-gray-600 flex-1" id="selcount">0 requested</p>
      <button id="save" onclick="save()" class="bg-red-700 hover:bg-red-800 text-white font-bold px-6 py-3 rounded-lg disabled:opacity-50">
        Send Request
      </button>
    </div>
  </div>

  <div id="toast" class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-sm px-4 py-2 rounded-full shadow max-w-[90%] text-center"></div>

  <script>
    requireLogin();

    let ME = null, SITES = [], WORKERS = [], REQ = [], ALLOC = [], SELECTED = new Set();
    let SITE_OFF = new Set();                // site_ids marked "not working" for this date
    let PENDING = [];                       // requested-but-not-allocated workers (for the reminder)
    const COORD_NAME = "Manikandan";
    const COORD_WA = "6590541701";          // WhatsApp number, no + or spaces

    function callCoordinator() {
      window.location.href = "tel:+" + COORD_WA;
    }
    function remindCoordinator() {
      if (!PENDING.length) { toast("Nothing pending right now."); return; }
      const site = document.getElementById("site").selectedOptions[0]?.textContent || "my site";
      const [y, m, d] = document.getElementById("date").value.split("-");
      const who = ME ? ME.name : "Supervisor";
      const lines = [`Hi ${COORD_NAME}, manpower still PENDING for *${site}* on ${d}/${m}/${y}:`];
      PENDING.forEach((p, i) => lines.push(`${i + 1}. ${p.code}_${p.name}`));
      lines.push(`Kindly allocate. Thanks — ${who}`);
      window.open("https://wa.me/" + COORD_WA + "?text=" + encodeURIComponent(lines.join("\n")), "_blank");
    }

    function toast(msg, long = false, ok = false) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.background = ok ? "#16a34a" : "";
      t.classList.remove("hidden");
      setTimeout(() => t.classList.add("hidden"), long ? 6000 : 2500);
    }
    function fmtDate(d) { return d.toISOString().slice(0, 10); }

    async function boot() {
      const r = await vmmsApi("/api/v1/me");
      if (!r.ok) { vmmsLogout(); return; }
      ME = await r.json();
      if (!(isCoordinator(ME.role) || isSupervisor(ME.role))) {
        document.body.innerHTML = '<p class="p-8 text-center text-gray-500">This page is for supervisors and managers.</p>';
        return;
      }
      const tmr = new Date(Date.now() + 24 * 3600 * 1000);
      document.getElementById("date").value = fmtDate(tmr);

      const [rs, rw] = await Promise.all([vmmsApi("/api/v1/sites"), vmmsApi("/api/v1/workers")]);
      let sites = (await rs.json()).filter(s => s.status === "active");
      // Supervisors only request for their own site(s)
      if (isSupervisor(ME.role)) {
        sites = sites.filter(s => (s.supervisors || []).some(x => x.user_id === ME.user_id));
      }
      SITES = sites;
      WORKERS = (await rw.json()).filter(w => w.status === "active");

      if (!SITES.length) {
        document.body.innerHTML = '<p class="p-8 text-center text-gray-500">No site is assigned to you yet. Ask the administrator to assign your site.</p>';
        return;
      }
      document.getElementById("site").innerHTML =
        SITES.map(s => `<option value="${s.id}">${esc(s.site_name)}</option>`).join("");
      await loadDay();
    }

    async function loadDay() {
      const date = document.getElementById("date").value;
      const [r, ra, so] = await Promise.all([
        vmmsApi(`/api/v1/requests?date=${date}`),
        vmmsApi(`/api/v1/allocations?date=${date}`),
        vmmsApi(`/api/v1/site_off?date=${date}`),
      ]);
      SITE_OFF = new Set(so.ok ? await so.json() : []);
      if (!r.ok) {
        REQ = [];
        toast("Requests are not switched on yet — the administrator must run the setup step first.", true);
      } else {
        REQ = await r.json();
      }
      ALLOC = ra.ok ? await ra.json() : [];   // allocations for your site(s) that date
      const siteId = document.getElementById("site").value;
      SELECTED = new Set(REQ.filter(a => a.site_id === siteId).map(a => a.worker_id));
      fillCopyFrom();
      render();
    }

    const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    function fillCopyFrom(){
      const sel = document.getElementById("copyfrom"); if(!sel) return;
      const base = new Date(document.getElementById("date").value + "T00:00:00");
      let html = "";
      for(let i=1;i<=7;i++){
        const d = new Date(base.getTime() - i*86400000);
        const v = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
        html += `<option value="${v}">${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")} (${DOW[d.getDay()]})</option>`;
      }
      sel.innerHTML = html;
    }

    async function copyFromDay(){
      const chosen = document.getElementById("copyfrom").value;
      const siteId = document.getElementById("site").value;
      if(!chosen) return;
      try{
        const r = await vmmsApi(`/api/v1/requests?date=${chosen}`);
        const d = r.ok ? await r.json() : [];
        const activeIds = new Set(WORKERS.map(w => w.id));
        const ids = d.filter(a => a.site_id === siteId).map(a => a.worker_id).filter(id => activeIds.has(id));
        if(!ids.length){ toast("No request found for that day at your site."); return; }
        SELECTED = new Set(ids);
        const [y,m,dd] = chosen.split("-");
        toast(`Copied ${ids.length} from ${dd}/${m}/${y} — review, then Send Request.`, true);
        render();
      }catch(ex){ toast(ex.message, true); }
    }

    function renderSiteOff() {
      const bar = document.getElementById("siteoffbar");
      if (!bar) return;
      const siteId = document.getElementById("site").value;
      const dparts = document.getElementById("date").value.split("-");
      const dstr = dparts.length === 3 ? `${dparts[2]}/${dparts[1]}/${dparts[0]}` : "";
      if (SITE_OFF.has(siteId)) {
        bar.className = "mb-3 rounded-xl p-3 bg-gray-800 text-white flex items-center justify-between gap-2 flex-wrap";
        bar.innerHTML = `<span class="text-sm font-bold">🚫 This site is NOT WORKING on ${dstr} — no manpower needed.</span>
          <button onclick="toggleSiteOff(false)" class="bg-white text-gray-800 text-xs font-bold px-3 py-2 rounded-lg">Site is working →</button>`;
      } else {
        bar.className = "mb-3 text-right";
        bar.innerHTML = `<button onclick="toggleSiteOff(true)" class="bg-gray-200 hover:bg-gray-300 text-gray-800 text-xs font-bold px-3 py-2 rounded-lg">🚫 Mark site NOT working this day</button>`;
      }
    }

    async function toggleSiteOff(off) {
      const siteId = document.getElementById("site").value;
      const date = document.getElementById("date").value;
      if (off && SELECTED.size && !confirm("Mark this site as NOT working for this day? Any request you send won't be needed.")) return;
      try {
        const r = await vmmsApi("/api/v1/site_off", { method: "POST", body: JSON.stringify({ site_id: siteId, off_date: date, off }) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || "Could not update");
        if (off) SITE_OFF.add(siteId); else SITE_OFF.delete(siteId);
        toast(off ? "Site marked NOT working — the allocator sees it as off." : "Site marked working.", true);
        renderSiteOff();
      } catch (ex) { toast(ex.message, true); }
    }

    function render() {
      renderSiteOff();
      const siteId = document.getElementById("site").value;
      const q = document.getElementById("search").value.trim().toLowerCase();
      const onlySel = document.getElementById("only-sel").checked;

      // workers this site already requested elsewhere-info: show if another site also wants them
      const otherWant = {};
      REQ.forEach(a => { if (a.site_id !== siteId) (otherWant[a.worker_id] = otherWant[a.worker_id] || []).push(a.site_name); });

      document.getElementById("summary").textContent =
        `${SELECTED.size} requested · ${WORKERS.length} active workers`;
      document.getElementById("selcount").textContent = `${SELECTED.size} requested`;

      // ---- Was my request allocated? (compare saved request vs allocations) ----
      const savedReqRows = REQ.filter(a => a.site_id === siteId);
      const allocHere = new Set(ALLOC.filter(a => a.site_id === siteId).map(a => a.worker_id));
      PENDING = savedReqRows.filter(a => !allocHere.has(a.worker_id))
                            .map(a => ({ code: a.worker_code, name: a.worker_name }));
      const st = document.getElementById("reqstatus");
      if (savedReqRows.length === 0) {
        st.classList.add("hidden");
      } else {
        const total = savedReqRows.length;
        const pending = PENDING.length;
        const got = total - pending;
        if (pending === 0) {
          st.className = "rounded-xl p-3 mb-3 text-sm bg-green-50 border border-green-200 text-green-800";
          st.innerHTML = `✓ All ${got} of your requested workers are allocated to your site for this date.`;
        } else {
          st.className = "rounded-xl p-3 mb-3 text-sm bg-yellow-50 border border-yellow-300 text-yellow-800";
          st.innerHTML =
            `${got} of ${total} requested are allocated to your site · <b>${pending} still not allocated to you</b>.` +
            `<br><span class="text-gray-600">What next: check again after the Co-ordinator does the allocation. ` +
            `If a worker is still not given, follow up with the Co-ordinator. If he turns up at your site in the morning, ` +
            `add him in Attendance with "+ Worker reported to this site".</span>` +
            `<div class="flex gap-2 mt-3">` +
            `<button onclick="callCoordinator()" class="bg-gray-800 hover:bg-gray-900 text-white text-xs font-bold px-3 py-2 rounded-lg">Call Manikandan</button>` +
            `<button onclick="remindCoordinator()" class="bg-green-600 hover:bg-green-700 text-white text-xs font-bold px-3 py-2 rounded-lg">WhatsApp reminder (${pending})</button>` +
            `</div>`;
        }
        st.classList.remove("hidden");
      }
      window.__allocHere = allocHere;
      window.__savedReq = new Set(savedReqRows.map(a => a.worker_id));

      // "Review my picked" shows the FULL picked list to verify, ignoring the search box.
      document.getElementById("only-sel-label").textContent =
        `Review my picked workers (${SELECTED.size})`;
      const rows = onlySel
        ? WORKERS.filter(w => SELECTED.has(w.id))
        : WORKERS.filter(w =>
            !q || w.name.toLowerCase().includes(q) || w.worker_code.toLowerCase().includes(q));

      const list = document.getElementById("list");
      list.innerHTML = "";
      document.getElementById("empty").classList.toggle("hidden", rows.length > 0);

      rows.forEach(w => {
        const others = otherWant[w.id];
        const div = document.createElement("label");
        div.className = "bg-gray-100 border border-gray-300 rounded-xl shadow-sm p-4 flex items-center gap-3 cursor-pointer active:bg-gray-50";
        let badge = "";
        if (window.__savedReq && window.__savedReq.has(w.id)) {
          badge = window.__allocHere.has(w.id)
            ? ' <span class="text-[10px] font-bold text-white bg-green-600 rounded px-1.5 py-0.5 align-middle">ALLOCATED</span>'
            : ' <span class="text-[10px] font-bold text-white bg-yellow-500 rounded px-1.5 py-0.5 align-middle">PENDING</span>';
        }
        div.innerHTML =
          `<input type="checkbox" class="w-5 h-5 accent-red-700" ${SELECTED.has(w.id) ? "checked" : ""}>
           <div class="flex-1 min-w-0">
             <p class="font-medium text-gray-800 truncate">${esc(w.name)}${badge}</p>
             <p class="text-xs text-gray-400">${esc(w.worker_code)}${others ? ' · also asked by ' + others.join(", ") : ""}</p>
           </div>`;
        div.querySelector("input").addEventListener("change", (e) => {
          e.target.checked ? SELECTED.add(w.id) : SELECTED.delete(w.id);
          document.getElementById("selcount").textContent = `${SELECTED.size} requested`;
          document.getElementById("summary").textContent =
            `${SELECTED.size} requested · ${WORKERS.length} active workers`;
        });
        list.appendChild(div);
      });
    }

    async function copyLast() {
      const btn = document.getElementById("copylast");
      const siteId = document.getElementById("site").value;
      const before = document.getElementById("date").value;
      btn.disabled = true; btn.textContent = "Loading…";
      try {
        const r = await vmmsApi(`/api/v1/requests/last?site_id=${siteId}&before=${before}`);
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || "Could not load");
        if (!d.found) { toast("No earlier request found for this site."); return; }
        // keep only workers still active today
        const activeIds = new Set(WORKERS.map(w => w.id));
        const copied = d.worker_ids.filter(id => activeIds.has(id));
        const dropped = d.worker_ids.length - copied.length;
        SELECTED = new Set(copied);
        const [y, m, dd] = d.request_date.split("-");
        toast(`Copied ${copied.length} from ${dd}/${m}/${y}` +
              (dropped ? ` (${dropped} no longer active skipped)` : "") + " — review, then Send Request.", true);
        render();
      } catch (ex) {
        toast(ex.message, true);
      } finally {
        btn.disabled = false; btn.textContent = "Copy last request";
      }
    }

    async function save() {
      const btn = document.getElementById("save");
      btn.disabled = true; btn.textContent = "Sending…";
      try {
        const r = await vmmsApi("/api/v1/requests/bulk", {
          method: "POST",
          body: JSON.stringify({
            request_date: document.getElementById("date").value,
            site_id: document.getElementById("site").value,
            worker_ids: [...SELECTED],
          }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.detail || "Could not send");
        toast(`✓ Request sent — ${data.total} worker(s) for your site`, true, true);
        await loadDay();
      } catch (ex) {
        toast(ex.message, true);
      } finally {
        btn.disabled = false; btn.textContent = "Send Request";
      }
    }

    document.getElementById("date").addEventListener("change", loadDay);
    document.getElementById("site").addEventListener("change", () => {
      const siteId = document.getElementById("site").value;
      SELECTED = new Set(REQ.filter(a => a.site_id === siteId).map(a => a.worker_id));
      render();
    });
    let searchTimer=null;
    document.getElementById("search").addEventListener("input",()=>{clearTimeout(searchTimer);searchTimer=setTimeout(render,180);});
    document.getElementById("only-sel").addEventListener("change", render);

    boot();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>

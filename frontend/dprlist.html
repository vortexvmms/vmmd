<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#C00000">
  <title>VCMS — DPR History</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>window.esc=window.esc||function(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});};</script>
  <style>
    body.dl { background:#F3F4F6; }
    .dpanel { background:#fff; border:1px solid #E5E7EB; border-radius:14px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
    table.dt { width:100%; font-size:14px; border-collapse:collapse; }
    table.dt thead th { font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:#6B7280; background:#F9FAFB; padding:10px 12px; text-align:left; font-weight:700; }
    table.dt tbody td { padding:10px 12px; border-top:1px solid #F1F1F1; }
    table.dt tbody tr:hover { background:#FAFAFA; }
    .openbtn { font-size:12px; font-weight:700; color:#fff; background:#C00000; border-radius:8px; padding:6px 12px; text-decoration:none; white-space:nowrap; }
  </style>
</head>
<body class="dl min-h-screen flex flex-col">
  <header class="bg-red-700 text-white p-4 shadow sticky top-0 z-10">
    <div class="flex items-center gap-3 max-w-4xl mx-auto w-full">
      <a href="home.html" class="text-2xl font-bold leading-none">‹</a>
      <div class="flex-1"><h1 class="text-lg font-bold">Daily Progress Report — History</h1><p class="text-red-100 text-xs" id="count">Loading…</p></div>
      <a href="dpr.html" class="bg-red-900 text-white text-sm font-bold px-3 py-2 rounded-lg">+ New</a>
    </div>
    <div class="flex gap-2 mt-3 max-w-4xl mx-auto w-full">
      <select id="site" class="flex-1 rounded-lg p-2 text-gray-800 text-base bg-white"><option value="">All sites</option></select>
      <input id="month" type="month" class="rounded-lg p-2 text-gray-800 text-base">
      <button onclick="load()" class="bg-red-900 text-white text-sm font-bold px-3 rounded-lg">Filter</button>
      <button onclick="exportExcel()" style="background:#047857" class="text-white text-sm font-bold px-3 rounded-lg">Excel</button>
    </div>
    <p class="text-red-100 text-xs mt-1 max-w-4xl mx-auto w-full">Excel export: pick a site (project) → one workbook, one sheet per day.</p>
  </header>

  <main class="flex-1 p-4 max-w-4xl mx-auto w-full pb-10">
    <div class="dpanel" style="overflow:hidden">
      <table class="dt">
        <thead><tr><th>Date</th><th>Site</th><th>Project</th><th>Prepared by</th><th class="hidden sm:table-cell">Men</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="hidden text-center text-gray-400 p-6 text-sm">No reports found for this filter.</p>
    </div>
  </main>

  <script>
    requireLogin();
    function fmtDMY(iso){ if(!iso) return ""; const p=iso.split("-"); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:iso; }

    const DPR_SUP_ROLES=["site_sup","safety_sup","wshc","logistics_sup"];  // supervisor tier — scoped to own sites
    async function boot(){
      const r=await vmmsApi("/api/v1/me"); if(!r.ok){vmmsLogout();return;}
      const me=await r.json();
      const rs=await vmmsApi("/api/v1/sites");
      let sites=(rs.ok?await rs.json():[]).filter(s=>s.status==="active" && (s.site_name||"").toUpperCase()!=="HOME LEAVE");
      // Supervisors only see their assigned sites (backend RLS scopes the list itself too).
      if(DPR_SUP_ROLES.indexOf(me.role)!==-1){
        sites=sites.filter(s=>(s.supervisors||[]).some(x=>x.user_id===me.user_id));
      }
      document.getElementById("site").innerHTML='<option value="">All sites</option>'+sites.map(s=>`<option value="${s.id}">${esc(s.site_name)}</option>`).join("");
      await load();
    }
    async function load(){
      const site=document.getElementById("site").value, month=document.getElementById("month").value;
      const q=[]; if(site) q.push("site_id="+site); if(month) q.push("month="+month);
      const r=await vmmsApi("/api/v1/dpr/list"+(q.length?"?"+q.join("&"):""));
      const list=r.ok?await r.json():[];
      document.getElementById("count").textContent=`${list.length} report(s)`;
      document.getElementById("empty").classList.toggle("hidden", list.length>0);
      document.getElementById("rows").innerHTML=list.map(x=>`
        <tr>
          <td style="font-weight:600;color:#111827">${fmtDMY(x.report_date)}</td>
          <td>${esc(x.site_name)}</td>
          <td style="color:#6B7280">${esc(x.project_title||"—")}</td>
          <td style="color:#6B7280">${esc(x.prepared_by_name||"—")}</td>
          <td class="hidden sm:table-cell">${x.manpower}${x.photos?` · ${x.photos}📷`:""}</td>
          <td style="text-align:right"><a class="openbtn" href="dpr.html?site=${x.site_id}&date=${x.report_date}">Open / PDF</a></td>
        </tr>`).join("");
    }
    // ---- Export to Excel (ExcelJS): one workbook per site (project), one worksheet per day, with photos ----
    async function loadExcelJS(){ if(window.ExcelJS) return; await new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s);}); }
    function xlDMY(v){ if(!v) return ""; const p=String(v).split("-"); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v; }
    async function imgForXlsx(url){
      try{
        const blob=await (await fetch(url,{mode:"cors"})).blob();
        const bmp=await createImageBitmap(blob);
        let w=bmp.width,h=bmp.height; const sc=Math.min(1,1000/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
        const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(bmp,0,0,w,h);
        return { b64:c.toDataURL("image/jpeg",0.72).split(",")[1], ext:"jpeg", w, h };
      }catch(e){ return null; }
    }
    async function buildReportSheet(wb, d, name){
      const THIN={style:"thin",color:{argb:"FF000000"}}, BORDER={top:THIN,left:THIN,bottom:THIN,right:THIN};
      const ctr={horizontal:"center",vertical:"middle",wrapText:true}, HEAD={type:"pattern",pattern:"solid",fgColor:{argb:"FFEFEFEF"}};
      const ws=wb.addWorksheet(String(name||"Report").slice(0,31).replace(/[\\/?*\[\]:]/g,"_"), {views:[{showGridLines:false}]});
      ws.columns=[{width:26},{width:16},{width:6},{width:6},{width:6},{width:12},{width:20}];
      const bd=(r1,r2,c1,c2)=>{ for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++) ws.getCell(r,c).border=BORDER; };
      const M=(row,c1,c2)=>ws.mergeCells(row,c1,row,c2);
      let R=1;
      ws.getCell(R,1).value=d.project_title||""; ws.getCell(R,1).font={bold:true}; ws.getCell(R,1).alignment=ctr; M(R,1,7); R++;
      ws.getCell(R,1).value="DAILY WORK RECORD"; ws.getCell(R,1).font={bold:true,size:13}; ws.getCell(R,1).alignment=ctr; M(R,1,7); bd(R,R,1,7); R++;
      ws.getCell(R,1).value="To:"; ws.getCell(R,1).font={bold:true}; ws.getCell(R,2).value=d.to_party||""; M(R,2,3);
      ws.getCell(R,4).value="Attention:"; ws.getCell(R,4).font={bold:true}; ws.getCell(R,5).value=d.attention||"";
      ws.getCell(R,6).value="Date:"; ws.getCell(R,6).font={bold:true}; ws.getCell(R,7).value=xlDMY(d.report_date); bd(R,R,1,7); R++;
      ws.getCell(R,1).value="Location:"; ws.getCell(R,1).font={bold:true}; ws.getCell(R,2).value=d.location||""; M(R,2,3);
      ws.getCell(R,4).value="Item of Work:"; ws.getCell(R,4).font={bold:true}; ws.getCell(R,5).value=d.item_of_work||""; M(R,5,7); bd(R,R,1,7); R++;
      ws.getCell(R,1).value="Description of Works:"; ws.getCell(R,1).font={bold:true}; M(R,1,7); bd(R,R,1,7); R++;
      const desc=String(d.description||""); ws.getCell(R,1).value=desc; ws.getCell(R,1).alignment={vertical:"top",wrapText:true}; M(R,1,7); ws.getRow(R).height=Math.max(28,Math.min(140,14*(desc.split("\n").length+1))); bd(R,R,1,7); R+=2;
      const mp=d.manpower||[]; ws.getRow(R).values=["Name","Role / Trade","No.","From","To","Total Hours","Remarks"]; ws.getRow(R).eachCell(c=>{c.font={bold:true};c.alignment=ctr;c.fill=HEAD;}); const mpS=R; R++;
      mp.forEach(m=>{ ws.getRow(R).values=[m.name||"",m.role||"",m.no||"",m.from||"",m.to||"",m.total||"",m.remarks||""]; [3,4,5,6].forEach(c=>ws.getCell(R,c).alignment={horizontal:"center"}); R++; });
      const noS=mp.reduce((a,r)=>a+(parseFloat(r.no)||0),0), toS=mp.reduce((a,r)=>a+(parseFloat(r.total)||0),0);
      ws.getRow(R).values=["Total","",Math.round(noS*10)/10,"","",Math.round(toS*10)/10,""]; ws.getCell(R,1).font={bold:true}; ws.getCell(R,3).font={bold:true}; ws.getCell(R,6).font={bold:true}; bd(mpS,R,1,7); R+=2;
      const eq=d.equipment||[]; ws.getRow(R).values=["Plant & Equipment","No.","From","To","Total Hours","Remarks"]; ws.getRow(R).eachCell(c=>{c.font={bold:true};c.alignment=ctr;c.fill=HEAD;}); const eqS=R; R++;
      (eq.length?eq:[{}]).forEach(m=>{ ws.getRow(R).values=[m.name||"",m.no||"",m.from||"",m.to||"",m.total||"",m.remarks||""]; R++; });
      bd(eqS,R-1,1,6); R++;
      const mt=d.materials||[]; ws.getRow(R).values=["Material / Tools","Qty","Unit","Remarks"]; ws.getRow(R).eachCell(c=>{c.font={bold:true};c.alignment=ctr;c.fill=HEAD;}); const mtS=R; R++;
      (mt.length?mt:[{}]).forEach(m=>{ ws.getRow(R).values=[m.name||"",m.qty||"",m.unit||"",m.remarks||""]; R++; });
      bd(mtS,R-1,1,4); R++;
      ws.getCell(R,1).value="Prepared By (VORTEX) Representative"; ws.getCell(R,1).font={bold:true}; M(R,1,3); ws.getCell(R,4).value="Conformed By: "+(d.conformed_by_party||""); ws.getCell(R,4).font={bold:true}; M(R,4,7); bd(R,R,1,7); R++;
      ws.getCell(R,1).value=(d.prepared_by_name||"")+(d.report_date?("    "+xlDMY(d.report_date)):""); M(R,1,3); M(R,4,7); ws.getRow(R).height=28; bd(R,R,1,7); R+=2;
      const ph=Array.isArray(d.photos)?d.photos:[];
      if(ph.length){
        ws.getCell(R,1).value="Activity Photos"; ws.getCell(R,1).font={bold:true}; M(R,1,7); R++;
        for(let i=0;i<ph.length;i+=2){
          const cap=R;
          ws.getCell(cap,1).value=ph[i].caption||""; ws.getCell(cap,1).font={bold:true}; ws.getCell(cap,1).alignment=ctr; M(cap,1,3);
          if(ph[i+1]){ ws.getCell(cap,5).value=ph[i+1].caption||""; ws.getCell(cap,5).font={bold:true}; ws.getCell(cap,5).alignment=ctr; M(cap,5,7); }
          R++;
          const irow=R; ws.getRow(irow).height=120; const box={w:210,h:158};
          const a=await imgForXlsx(ph[i].url); if(a){ const id=wb.addImage({base64:a.b64,extension:a.ext}); const s=Math.min(box.w/a.w,box.h/a.h); ws.addImage(id,{tl:{col:0.1,row:irow-1+0.05},ext:{width:Math.round(a.w*s),height:Math.round(a.h*s)}}); }
          if(ph[i+1]){ const b=await imgForXlsx(ph[i+1].url); if(b){ const id2=wb.addImage({base64:b.b64,extension:b.ext}); const s2=Math.min(box.w/b.w,box.h/b.h); ws.addImage(id2,{tl:{col:4.1,row:irow-1+0.05},ext:{width:Math.round(b.w*s2),height:Math.round(b.h*s2)}}); } }
          R++;
        }
      }
      return ws;
    }
    function dlBlob(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500); }
    async function exportExcel(){
      const site=document.getElementById("site").value;
      if(!site){ alert("Choose a site (project) first — the Excel workbook is one project per file."); return; }
      const month=document.getElementById("month").value;
      const q=["site_id="+site]; if(month) q.push("month="+month);
      const btn=event&&event.target; if(btn){ btn.disabled=true; btn.textContent="Building…"; }
      try{
        await loadExcelJS();
        const list=await (await vmmsApi("/api/v1/dpr/list?"+q.join("&"))).json();
        if(!list.length){ alert("No reports to export for this filter."); return; }
        const sorted=list.slice().sort((a,b)=> a.report_date<b.report_date?-1:1);
        const wb=new ExcelJS.Workbook(); const seen={};
        for(const it of sorted){
          const full=await (await vmmsApi(`/api/v1/dpr?site_id=${site}&date=${it.report_date}`)).json();
          let nm=it.report_date; if(seen[nm]) nm=nm+"_"+(seen[nm]+1); seen[it.report_date]=(seen[it.report_date]||0)+1;
          await buildReportSheet(wb, full, nm);
        }
        const buf=await wb.xlsx.writeBuffer();
        const nm=(list[0].site_name||"DPR").replace(/[\\/:*?"<>|\[\]]/g,"").replace(/\s+/g,"_").slice(0,50);
        dlBlob(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}), `${nm}.xlsx`);
      }catch(ex){ alert("Excel export failed (no internet?)"); }
      finally{ if(btn){ btn.disabled=false; btn.textContent="Excel"; } }
    }

    boot();
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>

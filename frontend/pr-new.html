<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#C00000">
  <title>VCMS — New PR</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>window.esc=window.esc||function(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});};</script>
  <style>
    body.dl { background:#F3F4F6; }
    .card { background:#fff; border:1px solid #E5E7EB; border-radius:14px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
    .inp { border:1px solid #D1D5DB; border-radius:8px; padding:8px; width:100%; font-size:14px; background:#fff; }
    label.fl { font-size:11px; font-weight:700; color:#6B7280; display:block; margin-bottom:3px; text-transform:uppercase; letter-spacing:.02em; }
    table.it { width:100%; border-collapse:collapse; }
    table.it th { background:#F9FAFB; font-size:11px; color:#6B7280; text-transform:uppercase; padding:6px; border:1px solid #E5E7EB; }
    table.it td { border:1px solid #E5E7EB; padding:3px; }
    table.it input, table.it textarea { border:none; width:100%; font-size:13px; padding:5px; background:transparent; resize:vertical; }
    .seg { display:flex; gap:6px; flex-wrap:wrap; }
    .seg button { border:1.5px solid #D1D5DB; border-radius:8px; padding:7px 12px; font-size:13px; font-weight:700; color:#374151; background:#fff; cursor:pointer; }
    .seg button.on { border-color:#C00000; background:#C00000; color:#fff; }
    .recent { font-size:13px; }
    .recent tr { cursor:pointer; }
    .recent td { padding:8px 10px; border-top:1px solid #F1F1F1; }
  </style>
</head>
<body class="dl min-h-screen flex flex-col">
  <header class="bg-red-700 text-white p-4 shadow sticky top-0 z-10">
    <div class="flex items-center gap-3 max-w-4xl mx-auto w-full">
      <a href="home.html" class="text-2xl font-bold leading-none">‹</a>
      <div class="flex-1"><h1 class="text-lg font-bold">Purchase Requisition</h1><p class="text-red-100 text-xs">New PR request</p></div>
      <button onclick="newBlank()" class="bg-red-900 text-white text-sm font-bold px-3 py-2 rounded-lg">+ New</button>
    </div>
  </header>

  <main class="flex-1 p-4 max-w-4xl mx-auto w-full pb-24">
    <div class="card p-4">
      <!-- Category + PR No -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="fl">Category</label>
          <div class="seg" id="seg-cat">
            <button data-v="asset" onclick="pick('cat',this)">Asset</button>
            <button data-v="consumable" onclick="pick('cat',this)">Consumable</button>
            <button data-v="rentals" onclick="pick('cat',this)">Rentals</button>
          </div>
        </div>
        <div>
          <label class="fl">P.R No <span id="seedhint" class="hidden text-red-600 normal-case">— first time: type your last used number</span></label>
          <input id="f-prno" class="inp" placeholder="e.g. PKJV T5-237">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-3">
        <div>
          <label class="fl">Date</label>
          <input id="f-date" type="date" class="inp">
        </div>
        <div>
          <label class="fl">Site Name</label>
          <select id="f-site" class="inp" onchange="onSite()"><option value="">Select site…</option></select>
        </div>
        <div>
          <label class="fl">Project Code</label>
          <select id="f-code" class="inp" onchange="onCode()"><option value="">—</option></select>
        </div>
      </div>

      <div class="mt-3">
        <label class="fl">Project</label>
        <input id="f-project" class="inp" placeholder="Project title (auto from directory)">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-3">
        <div>
          <label class="fl">Priority</label>
          <div class="seg" id="seg-urg">
            <button data-v="urgent" onclick="pick('urg',this)">Urgent</button>
            <button data-v="normal" onclick="pick('urg',this)">Normal</button>
          </div>
        </div>
        <div>
          <label class="fl">Collection</label>
          <div class="seg" id="seg-del">
            <button data-v="self" onclick="pick('del',this)">Self Collection</button>
            <button data-v="delivery" onclick="pick('del',this)">Delivery</button>
          </div>
        </div>
        <div>
          <label class="fl">Delivery To</label>
          <input id="f-deliverto" class="inp" placeholder="Deliver to…">
        </div>
      </div>

      <!-- Line items -->
      <label class="fl mt-4">Items</label>
      <div style="overflow:auto">
        <table class="it">
          <thead><tr>
            <th style="width:34px">No</th><th>Description</th><th style="width:64px">Qty</th>
            <th style="width:70px">UOM</th><th style="width:92px">Unit Price</th>
            <th style="width:100px">Amount</th><th style="width:130px">Preferred Vendor</th><th style="width:30px"></th>
          </tr></thead>
          <tbody id="items"></tbody>
          <tfoot><tr>
            <td colspan="5" style="text-align:right;font-weight:700;padding-right:8px">Total</td>
            <td id="grand" style="font-weight:700;text-align:right;padding-right:8px">0.00</td>
            <td colspan="2"></td>
          </tr></tfoot>
        </table>
      </div>
      <button onclick="addItem()" class="mt-2 text-red-700 font-bold text-sm">+ Add item</button>

      <div class="mt-4">
        <label class="fl">Remarks</label>
        <textarea id="f-remarks" rows="2" class="inp" placeholder="Remarks…"></textarea>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-3">
        <div><label class="fl">Requested By</label><input id="f-reqby" class="inp"></div>
      </div>

      <div class="flex gap-2 mt-5">
        <button onclick="savePR()" class="flex-1 bg-red-700 text-white font-bold py-2.5 rounded-lg">Save</button>
        <button onclick="printPR()" class="flex-1 bg-gray-800 text-white font-bold py-2.5 rounded-lg">Print / PDF</button>
      </div>
    </div>

    <!-- Recent PRs -->
    <div class="card mt-4" style="overflow:hidden">
      <p class="font-bold text-gray-800 text-sm px-4 pt-4">Recent PRs <span class="text-gray-400 font-normal">— tap to reopen / reprint</span></p>
      <table class="recent w-full"><tbody id="recent"></tbody></table>
    </div>
  </main>

  <div id="toast" class="hidden fixed bottom-10 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-sm px-4 py-2 rounded-full shadow z-50"></div>

  <script>
    requireLogin();
    let ME=null, DIR=[], SEL={cat:"consumable",urg:"normal",del:"delivery"};
    function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.remove("hidden"); setTimeout(()=>t.classList.add("hidden"),2400); }
    function fmtDMY(iso){ if(!iso) return ""; const p=String(iso).split("-"); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:iso; }
    function pick(group,btn){ SEL[group]=btn.getAttribute("data-v"); const wrap=btn.parentElement; [...wrap.children].forEach(b=>b.classList.toggle("on", b===btn)); }
    function setSeg(group,val){ const map={cat:"seg-cat",urg:"seg-urg",del:"seg-del"}; SEL[group]=val; const wrap=document.getElementById(map[group]); [...wrap.children].forEach(b=>b.classList.toggle("on", b.getAttribute("data-v")===val)); }

    async function boot(){
      const r=await vmmsApi("/api/v1/me"); if(!r.ok){vmmsLogout();return;}
      ME=await r.json();
      document.getElementById("f-reqby").value=ME.name||"";
      document.getElementById("f-date").value=new Date().toISOString().slice(0,10);
      setSeg("cat","consumable"); setSeg("urg","normal"); setSeg("del","delivery");
      // directory
      const rd=await vmmsApi("/api/v1/pr/directory");
      DIR=rd.ok?await rd.json():[];
      const sites=[...new Set(DIR.map(d=>d.site_name))].sort();
      document.getElementById("f-site").innerHTML='<option value="">Select site…</option>'+sites.map(s=>`<option>${esc(s)}</option>`).join("");
      addItem();
      await nextNumber();
      await loadRecent();
    }
    async function nextNumber(){
      const r=await vmmsApi("/api/v1/pr/next-number"); const d=r.ok?await r.json():{};
      document.getElementById("f-prno").value=d.next||"";
      document.getElementById("seedhint").classList.toggle("hidden", !d.seed);
    }
    function onSite(){
      const site=document.getElementById("f-site").value;
      const entries=DIR.filter(d=>d.site_name===site);
      const sel=document.getElementById("f-code");
      sel.innerHTML='<option value="">—</option>'+entries.map(e=>`<option value="${esc(e.project_code)}">${esc(e.project_code)}</option>`).join("");
      if(entries.length===1){ sel.value=entries[0].project_code; onCode(); }
      else { document.getElementById("f-project").value=""; }
    }
    function onCode(){
      const site=document.getElementById("f-site").value, code=document.getElementById("f-code").value;
      const e=DIR.find(d=>d.site_name===site && d.project_code===code);
      if(e){
        document.getElementById("f-project").value=e.project||"";
        if(e.deliver_to && !document.getElementById("f-deliverto").value) document.getElementById("f-deliverto").value=e.deliver_to;
        SEL._pm=e.pm_hod||""; SEL._md=e.manager_director||"";
      }
    }

    function addItem(data){
      const tb=document.getElementById("items");
      const tr=document.createElement("tr");
      const d=data||{};
      tr.innerHTML=`
        <td class="rowno" style="text-align:center;color:#6B7280"></td>
        <td><textarea rows="1" data-k="description">${esc(d.description||"")}</textarea></td>
        <td><input data-k="qty" inputmode="decimal" style="text-align:center" value="${d.qty??""}" oninput="calc(this)"></td>
        <td><input data-k="uom" style="text-align:center" value="${esc(d.uom||"")}"></td>
        <td><input data-k="unit_price" inputmode="decimal" style="text-align:right" value="${d.unit_price??""}" oninput="calc(this)"></td>
        <td><input data-k="amount" inputmode="decimal" style="text-align:right" value="${d.amount??""}" oninput="sumAll()"></td>
        <td><input data-k="vendor" value="${esc(d.vendor||"")}"></td>
        <td style="text-align:center"><button onclick="this.closest('tr').remove();renumber();sumAll()" class="text-red-500 font-bold">×</button></td>`;
      tb.appendChild(tr); renumber(); sumAll();
    }
    function renumber(){ [...document.querySelectorAll("#items tr")].forEach((tr,i)=>tr.querySelector(".rowno").textContent=i+1); }
    function calc(el){
      const tr=el.closest("tr");
      const q=parseFloat(tr.querySelector('[data-k="qty"]').value)||0;
      const p=parseFloat(tr.querySelector('[data-k="unit_price"]').value)||0;
      const amt=tr.querySelector('[data-k="amount"]');
      if(q&&p) amt.value=(q*p).toFixed(2);
      sumAll();
    }
    function sumAll(){
      let t=0; document.querySelectorAll('#items [data-k="amount"]').forEach(a=>t+=parseFloat(a.value)||0);
      document.getElementById("grand").textContent=t.toFixed(2);
    }
    function readItems(){
      return [...document.querySelectorAll("#items tr")].map((tr,i)=>{
        const g=k=>tr.querySelector(`[data-k="${k}"]`).value;
        return { no:i+1, description:g("description"), qty:g("qty"), uom:g("uom"),
                 unit_price:g("unit_price"), amount:g("amount"), vendor:g("vendor") };
      }).filter(x=>x.description||x.qty||x.amount);
    }
    function collect(){
      return {
        pr_no:document.getElementById("f-prno").value.trim(),
        pr_date:document.getElementById("f-date").value,
        category:SEL.cat, urgency:SEL.urg, delivery_mode:SEL.del,
        deliver_to:document.getElementById("f-deliverto").value.trim(),
        site_name:document.getElementById("f-site").value,
        project_code:document.getElementById("f-code").value,
        project:document.getElementById("f-project").value.trim(),
        pm_hod:SEL._pm||"", manager_director:SEL._md||"",
        requested_by_name:document.getElementById("f-reqby").value.trim(),
        items:readItems(), remarks:document.getElementById("f-remarks").value.trim(), status:"submitted",
      };
    }
    async function savePR(){
      const d=collect();
      if(!d.pr_no){ toast("Enter a P.R No"); return; }
      if(!d.items.length){ toast("Add at least one item"); return; }
      const r=await vmmsApi("/api/v1/pr",{method:"POST",body:JSON.stringify(d)});
      if(!r.ok){ const e=await r.json().catch(()=>({})); toast(e.detail||"Save failed"); return; }
      toast("PR saved"); await loadRecent(); await nextNumber();
    }
    function newBlank(){
      document.getElementById("f-prno").value=""; document.getElementById("f-site").value="";
      document.getElementById("f-code").innerHTML='<option value="">—</option>';
      document.getElementById("f-project").value=""; document.getElementById("f-deliverto").value="";
      document.getElementById("f-remarks").value=""; document.getElementById("items").innerHTML="";
      SEL._pm=""; SEL._md=""; addItem(); nextNumber();
      document.getElementById("f-date").value=new Date().toISOString().slice(0,10);
      setSeg("cat","consumable"); setSeg("urg","normal"); setSeg("del","delivery");
      window.scrollTo(0,0);
    }

    async function loadRecent(){
      const r=await vmmsApi("/api/v1/pr/list"); const list=r.ok?await r.json():[];
      document.getElementById("recent").innerHTML=list.slice(0,25).map(x=>`
        <tr onclick="openPR('${x.id}')">
          <td style="font-weight:700;color:#C00000">${esc(x.pr_no||"—")}</td>
          <td>${fmtDMY(x.pr_date)}</td>
          <td style="color:#374151">${esc(x.project||x.site_name||"—")}</td>
          <td style="text-align:right;color:#6B7280">${esc(x.requested_by_name||"")}</td>
        </tr>`).join("") || '<tr><td class="text-gray-400 p-4 text-sm">No saved PRs yet.</td></tr>';
    }
    async function openPR(id){
      const r=await vmmsApi("/api/v1/pr/"+id); if(!r.ok){toast("Could not open");return;}
      const d=await r.json();
      document.getElementById("f-prno").value=d.pr_no||"";
      document.getElementById("f-date").value=(d.pr_date||"").slice(0,10);
      setSeg("cat",d.category||"consumable"); setSeg("urg",d.urgency||"normal"); setSeg("del",d.delivery_mode||"delivery");
      document.getElementById("f-site").value=d.site_name||""; onSite();
      document.getElementById("f-code").value=d.project_code||""; onCode();
      document.getElementById("f-project").value=d.project||"";
      document.getElementById("f-deliverto").value=d.deliver_to||"";
      document.getElementById("f-remarks").value=d.remarks||"";
      document.getElementById("f-reqby").value=d.requested_by_name||"";
      SEL._pm=d.pm_hod||""; SEL._md=d.manager_director||"";
      document.getElementById("items").innerHTML=""; (d.items&&d.items.length?d.items:[{}]).forEach(addItem);
      window.scrollTo(0,0); toast("Loaded — you can reprint or edit");
    }

    // ---------- PRINT (A4 landscape) ----------
    function chk(on){ return on ? "☒" : "☐"; }
    function printPR(){
      const d=collect();
      const items=d.items.length?d.items:[{}];
      const rowsH=items.map(it=>`<tr>
          <td class="c">${it.no||""}</td>
          <td>${esc(it.description||"").replace(/\n/g,"<br>")}</td>
          <td class="c">${esc(it.qty||"")}</td>
          <td class="c">${esc(it.uom||"")}</td>
          <td class="r">${esc(it.unit_price||"")}</td>
          <td class="r">${esc(it.amount||"")}</td>
          <td>${esc(it.vendor||"")}</td></tr>`).join("");
      // pad to at least 8 rows
      let pad=""; for(let i=items.length;i<8;i++) pad+=`<tr><td class="c">${i+1}</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`;
      const total=document.getElementById("grand").textContent;
      const w=window.open("","_blank");
      w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>PR ${esc(d.pr_no||"")}</title>
      <style>
        @page{ size:A4 landscape; margin:12mm; }
        *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; box-sizing:border-box; }
        body{ font-family:Arial,'Arial Narrow',sans-serif; color:#000; font-size:11px; margin:0; }
        .cats{ font-size:12px; line-height:1.7; }
        .title{ text-align:center; font-size:20px; font-weight:800; letter-spacing:.03em; }
        .top{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid #000; padding-bottom:6px; margin-bottom:6px; }
        .prno{ font-size:13px; font-weight:800; }
        .grid2{ display:flex; gap:20px; margin:3px 0; }
        .lbl{ font-weight:700; }
        table.pr{ width:100%; border-collapse:collapse; margin-top:8px; }
        table.pr th, table.pr td{ border:0.6px solid #000; padding:4px 6px; vertical-align:top; }
        table.pr th{ background:#eee; font-size:11px; }
        td.c{ text-align:center; } td.r{ text-align:right; }
        .foot{ display:flex; justify-content:space-between; margin-top:26px; }
        .sig{ width:30%; text-align:center; }
        .sigline{ border-top:1px solid #000; margin-top:34px; padding-top:3px; font-size:10px; }
        .rmk{ margin-top:6px; }
      </style></head><body>
      <div class="top">
        <div class="cats">
          ${chk(d.category==='asset')} Asset<br>
          ${chk(d.category==='consumable')} Consumable<br>
          ${chk(d.category==='rentals')} Rentals
        </div>
        <div style="flex:1;text-align:center"><div class="title">PURCHASE REQUISITION</div></div>
        <div style="text-align:right"><div class="prno">P.R NO : ${esc(d.pr_no||"")}</div></div>
      </div>
      <div class="grid2"><div><span class="lbl">Date:</span> ${fmtDMY(d.pr_date)}</div>
        <div><span class="lbl">Project Code:</span> ${esc(d.project_code||"")}</div></div>
      <div><span class="lbl">Project:</span> ${esc(d.project||"")}</div>
      <div class="grid2" style="margin-top:4px">
        <div>${chk(d.urgency==='urgent')} Urgent &nbsp;&nbsp; ${chk(d.urgency==='normal')} Normal</div>
        <div>${chk(d.delivery_mode==='self')} Self Collection &nbsp;&nbsp; ${chk(d.delivery_mode==='delivery')} Delivery</div>
        <div><span class="lbl">Delivery To :</span> ${esc(d.deliver_to||"")}</div>
      </div>
      <table class="pr">
        <thead><tr><th style="width:34px">No.</th><th>Description</th><th style="width:60px">Qty</th>
          <th style="width:66px">UOM</th><th style="width:90px">Unit Price</th><th style="width:100px">Amount</th>
          <th style="width:150px">Preferred Vendor</th></tr></thead>
        <tbody>${rowsH}${pad}
          <tr><td colspan="5" class="r" style="font-weight:700">Total</td><td class="r" style="font-weight:700">${esc(total)}</td><td></td></tr>
        </tbody>
      </table>
      <div class="rmk"><span class="lbl">Remarks:</span> ${esc(d.remarks||"").replace(/\n/g,"<br>")}</div>
      <div class="foot">
        <div class="sig"><div class="sigline">Requested By : ${esc(d.requested_by_name||"")}<br>Requester Name</div></div>
        <div class="sig"><div class="sigline">Approved By<br>PM/HOD Signature${d.pm_hod?(" — "+esc(d.pm_hod)):""}</div></div>
        <div class="sig"><div class="sigline">Manager / Director${d.manager_director?(" — "+esc(d.manager_director)):""}</div></div>
      </div>
      </body></html>`);
      w.document.close(); w.focus(); setTimeout(()=>w.print(),350);
    }

    boot();
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#C00000">
  <title>VCMS — PR Dashboard</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/config.js?v=20260813-7"></script>
  <script src="js/auth.js?v=20260813-7"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script>window.esc=window.esc||function(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});};</script>
  <style>
    body.db { background:#F1F3F6; }
    .wrap { max-width:1180px; }
    .card { background:#fff; border:1px solid #E5E7EB; border-radius:16px; box-shadow:0 1px 2px rgba(16,24,40,.05); }
    .kpi { padding:16px 18px; border-left:5px solid var(--ac,#C00000); }
    .kpi .n { font-size:30px; font-weight:800; color:#0F172A; line-height:1.05; letter-spacing:-.01em; }
    .kpi .l { font-size:11px; font-weight:700; color:#64748B; text-transform:uppercase; letter-spacing:.05em; margin-top:4px; }
    .kpi .s { font-size:11px; color:#94A3B8; margin-top:2px; }
    .chart-h { position:relative; height:250px; }
    .sect-h { font-size:13px; font-weight:800; color:#334155; letter-spacing:.02em; }
    /* desktop log table */
    table.log { width:100%; font-size:13.5px; border-collapse:collapse; }
    table.log thead th { font-size:11px; text-transform:uppercase; color:#64748B; background:#F8FAFC; padding:10px 12px; text-align:left; white-space:nowrap; border-bottom:1px solid #E5E7EB; letter-spacing:.04em; }
    table.log tbody td { padding:11px 12px; border-top:1px solid #F1F5F9; vertical-align:top; }
    table.log tbody tr:hover { background:#FAFBFF; cursor:pointer; }
    ul.desc { margin:0; padding-left:16px; color:#334155; } ul.desc li { margin:1px 0; }
    .chip { font-size:10px; font-weight:800; padding:2px 9px; border-radius:999px; letter-spacing:.02em; }
    .c-asset{ background:#EDE9FE; color:#6D28D9;} .c-consumable{ background:#DBEAFE; color:#1D4ED8;} .c-rentals{ background:#FEF3C7; color:#B45309;}
    .c-urgent{ background:#FEE2E2; color:#B91C1C;}
    .prno { font-weight:800; color:#C00000; }
    /* self-contained responsive grids (don't depend on prebuilt Tailwind subset) */
    .kpis { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
    .charts { display:grid; grid-template-columns:1fr; gap:16px; margin-top:16px; }
    .only-d { display:none; } .only-m { display:block; }
    @media (min-width:768px){ .only-d{ display:block; } .only-m{ display:none; } }
    @media (min-width:1024px){ .kpis{ grid-template-columns:repeat(4,1fr); } .charts{ grid-template-columns:repeat(3,1fr); } }
    .lcard { border:1px solid #E5E7EB; border-radius:14px; padding:12px 14px; margin:10px; background:#fff; }
    .pbtn { display:inline-block; font-size:12px; font-weight:800; color:#fff; background:#111827; border-radius:9px; padding:8px 14px; text-decoration:none; }
  </style>
</head>
<body class="db min-h-screen flex flex-col">
  <header class="bg-red-700 text-white p-4 shadow sticky top-0 z-10">
    <div class="flex items-center gap-3 wrap mx-auto w-full">
      <a href="home.html" class="text-2xl font-bold leading-none">‹</a>
      <div class="flex-1"><h1 class="text-lg font-bold">PR Dashboard</h1><p class="text-red-100 text-xs">Procurement overview &amp; log</p></div>
      <input id="f-month" type="month" class="rounded-lg p-2 text-gray-800 text-sm" onchange="load()">
      <button onclick="document.getElementById('f-month').value='';load()" class="bg-red-900 text-white text-sm font-bold px-3 py-2 rounded-lg">All</button>
    </div>
  </header>

  <main class="flex-1 p-4 wrap mx-auto w-full pb-12">
    <div id="msg" class="text-center text-gray-500 mt-8">Loading…</div>
    <div id="body" class="hidden">
      <!-- KPIs -->
      <div class="kpis">
        <div class="card kpi" style="--ac:#C00000"><div class="n" id="k-value">—</div><div class="l">Total Value (SGD)</div><div class="s" id="k-value-s"></div></div>
        <div class="card kpi" style="--ac:#2563EB"><div class="n" id="k-count">—</div><div class="l">Total PRs</div></div>
        <div class="card kpi" style="--ac:#DC2626"><div class="n" id="k-urgent">—</div><div class="l">Urgent</div></div>
        <div class="card kpi" style="--ac:#0E7490"><div class="n" id="k-sites">—</div><div class="l">Sites</div></div>
      </div>

      <!-- Charts: one row on desktop -->
      <div class="charts">
        <div class="card p-4"><p class="sect-h mb-2">By category</p><div class="chart-h"><canvas id="ch-cat"></canvas></div></div>
        <div class="card p-4"><p class="sect-h mb-2">Value by month (SGD)</p><div class="chart-h"><canvas id="ch-month"></canvas></div></div>
        <div class="card p-4"><p class="sect-h mb-2">Top sites by value</p><div class="chart-h"><canvas id="ch-site"></canvas></div></div>
      </div>

      <!-- PR Log -->
      <div class="card mt-4" style="overflow:hidden">
        <div class="flex items-center gap-2 p-3 border-b border-gray-100">
          <p class="sect-h flex-1">PR Log</p>
          <input id="q" oninput="renderLog()" placeholder="Search…" class="border border-gray-300 rounded-lg p-2 text-sm w-64 max-w-full">
        </div>
        <!-- desktop table -->
        <div class="only-d" style="overflow:auto">
          <table class="log">
            <thead><tr><th>Date</th><th>PR No</th><th>Site</th><th>Category</th><th>Requested By</th><th style="text-align:right">Value</th><th>Description</th><th></th></tr></thead>
            <tbody id="log"></tbody>
          </table>
        </div>
        <!-- mobile cards -->
        <div class="only-m" id="logm"></div>
        <p id="logempty" class="hidden text-center text-gray-400 p-6 text-sm">No PRs for this filter.</p>
      </div>
    </div>
  </main>

  <script>
    requireLogin();
    let DATA=null, CH={};
    function fmtDMY(iso){ if(!iso) return ""; const p=String(iso).split("-"); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:iso; }
    function money(n){ return (Number(n)||0).toLocaleString("en-SG",{minimumFractionDigits:2,maximumFractionDigits:2}); }
    function monLabel(m){ const [y,mm]=m.split("-"); return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][(+mm)-1]+" "+y.slice(2); }
    function descHTML(x){
      const lines=(x.lines&&x.lines.length)?x.lines:(x.summary?[x.summary]:[]);
      if(!lines.length) return '<span class="text-gray-400">—</span>';
      return '<ul class="desc">'+lines.map(l=>`<li>${esc(l)}</li>`).join("")+'</ul>';
    }
    function catChip(x){
      const cc=(x.category||"").toLowerCase();
      return (x.category?`<span class="chip c-${cc}">${esc(x.category)}</span>`:"")+((x.urgency==="urgent")?' <span class="chip c-urgent">URGENT</span>':"");
    }

    async function load(){
      const month=document.getElementById("f-month").value;
      document.getElementById("msg").classList.remove("hidden"); document.getElementById("msg").textContent="Loading…";
      document.getElementById("body").classList.add("hidden");
      const r=await vmmsApi("/api/v1/pr/dashboard"+(month?("?month="+month):""));
      if(!r.ok){ document.getElementById("msg").textContent="Could not load ("+r.status+")."; return; }
      DATA=await r.json();
      document.getElementById("msg").classList.add("hidden");
      document.getElementById("body").classList.remove("hidden");
      render();
    }
    function render(){
      document.getElementById("k-value").textContent="$"+money(DATA.total_value);
      document.getElementById("k-value-s").textContent = DATA.total_value?("across "+DATA.total_count+" PRs"):"no priced lines yet";
      document.getElementById("k-count").textContent=DATA.total_count;
      document.getElementById("k-urgent").textContent=DATA.urgent;
      document.getElementById("k-sites").textContent=(DATA.by_site||[]).length;
      drawCharts(); renderLog();
    }
    function drawCharts(){
      Object.values(CH).forEach(c=>c&&c.destroy()); CH={};
      const co={responsive:true,maintainAspectRatio:false};
      const cat=DATA.by_category||{};
      CH.cat=new Chart(document.getElementById("ch-cat"),{type:"doughnut",
        data:{labels:["Asset","Consumable","Rentals"],datasets:[{data:[cat.asset||0,cat.consumable||0,cat.rentals||0],backgroundColor:["#6D28D9","#1D4ED8","#B45309"],borderWidth:0}]},
        options:{...co,cutout:"58%",plugins:{legend:{position:"bottom",labels:{font:{size:11},boxWidth:12,padding:12}}}}});
      const bm=DATA.by_month||[];
      CH.month=new Chart(document.getElementById("ch-month"),{type:"bar",
        data:{labels:bm.map(x=>monLabel(x.month)),datasets:[{data:bm.map(x=>Math.round(x.value)),backgroundColor:"#C00000",borderRadius:6,maxBarThickness:38}]},
        options:{...co,plugins:{legend:{display:false}},scales:{y:{grid:{color:"#EEF2F7"},ticks:{font:{size:10}}},x:{grid:{display:false},ticks:{font:{size:10}}}}}});
      const bs=(DATA.by_site||[]).slice(0,8);
      CH.site=new Chart(document.getElementById("ch-site"),{type:"bar",
        data:{labels:bs.map(x=>x.site),datasets:[{data:bs.map(x=>Math.round(x.value)),backgroundColor:"#0E7490",borderRadius:6,maxBarThickness:24}]},
        options:{...co,indexAxis:"y",plugins:{legend:{display:false}},scales:{x:{grid:{color:"#EEF2F7"},ticks:{font:{size:10}}},y:{grid:{display:false},ticks:{font:{size:11}}}}}});
    }
    function filtered(){
      const q=(document.getElementById("q").value||"").toLowerCase();
      let rows=DATA.log||[];
      if(q) rows=rows.filter(x=>((x.pr_no||"")+" "+(x.site_name||"")+" "+(x.summary||"")+" "+(x.project||"")+" "+(x.requested_by_name||"")).toLowerCase().includes(q));
      return rows;
    }
    function renderLog(){
      const rows=filtered();
      document.getElementById("logempty").classList.toggle("hidden", rows.length>0);
      // desktop table
      document.getElementById("log").innerHTML=rows.map(x=>`
        <tr onclick="location.href='pr-new.html?open=${x.id}'">
          <td style="white-space:nowrap">${fmtDMY(x.pr_date)}</td>
          <td class="prno" style="white-space:nowrap">${esc(x.pr_no||"—")}</td>
          <td>${esc(x.site_name||"—")}</td>
          <td style="white-space:nowrap">${catChip(x)}</td>
          <td style="color:#64748B">${esc(x.requested_by_name||"—")}</td>
          <td style="text-align:right;white-space:nowrap;font-weight:600">${x.value?("$"+money(x.value)):"—"}</td>
          <td style="max-width:380px">${descHTML(x)}</td>
          <td style="text-align:right"><a class="pbtn" style="padding:5px 10px" href="pr-new.html?open=${x.id}&print=1" onclick="event.stopPropagation()">PDF</a></td>
        </tr>`).join("");
      // mobile cards — PR + description + Print/PDF button
      document.getElementById("logm").innerHTML=rows.map(x=>`
        <div class="lcard">
          <div class="flex items-center justify-between">
            <span class="prno">${esc(x.pr_no||"—")}</span>
            <span style="font-weight:700;color:#0F172A">${x.value?("$"+money(x.value)):""}</span>
          </div>
          <div class="text-xs text-gray-500 mt-0.5">${fmtDMY(x.pr_date)} · ${esc(x.site_name||"—")} ${catChip(x)}</div>
          <div class="text-sm mt-2">${descHTML(x)}</div>
          <div class="mt-3"><a class="pbtn" href="pr-new.html?open=${x.id}&print=1">Print / PDF</a></div>
        </div>`).join("");
    }
    load();
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DPR Project Directory · VCMS</title><link rel="stylesheet" href="css/app.css">
<script src="js/core-bundle.js?v=20260828-shell3"></script><script src="js/auth.js?v=20260813-8"></script><script src="js/ui.js?v=20260825-ui5"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#e7eaf0;color:#20242c;font-family:Arial,sans-serif}.page{max-width:1500px;margin:auto;padding:20px 24px 80px}.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.hero h1{margin:0;font-size:25px}.hero p{margin:4px 0 0;color:#667085}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:800;cursor:pointer;background:#252b35;color:#fff}.btn.red{background:#c00000}.btn.light{background:#fff;color:#9f1111;border:1px solid #e0b2b2}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.kpi{background:#fff;border:1px solid #dfe3e8;border-top:3px solid #c00000;border-radius:12px;padding:14px;box-shadow:0 4px 12px #19202b0d}.kpi b{font-size:25px}.kpi span{display:block;margin-top:4px;color:#667085;font-size:12px;font-weight:700}.tools{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;background:#fff;border-radius:12px;padding:12px;margin-bottom:12px}.fld{width:100%;height:42px;border:1px solid #cfd5de;border-radius:8px;padding:0 11px;background:#fff;font:14px Arial}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid #dce1e8;border-radius:13px;padding:15px;box-shadow:0 4px 14px #19202b0c;transition:.16s}.card:hover{transform:translateY(-2px);box-shadow:0 9px 22px #19202b1a}.ctop{display:flex;justify-content:space-between;gap:12px}.card h3{font-size:16px;margin:0 0 5px}.meta{font-size:12px;color:#667085;line-height:1.6}.pill{padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800;text-transform:uppercase;height:max-content}.active{background:#dcfce7;color:#16713a}.temporarily_stopped{background:#fff1c7;color:#95500b}.completed{background:#dbeafe;color:#1d4f91}.draft{background:#eef0f3;color:#5c6676}.cancelled,.archived{background:#fee2e2;color:#991b1b}.dates{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0;padding:10px;background:#f5f6f8;border-radius:9px;font-size:11px}.dates b{display:block;margin-top:3px;font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.actions .btn{padding:7px 10px;font-size:11px}.empty{grid-column:1/-1;background:#fff;padding:35px;text-align:center;border-radius:12px;color:#667085}.modal{display:none;position:fixed;inset:0;background:#0f172a99;z-index:100;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.dialog{background:#fff;border-radius:14px;width:min(820px,100%);max-height:92vh;overflow:auto;padding:20px}.dialog h2{margin:0 0 15px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.wide{grid-column:1/-1}.lbl{display:block;font-size:11px;font-weight:800;color:#667085;margin:0 0 5px;text-transform:uppercase}.dialog textarea{height:75px;padding-top:10px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.history{font-size:12px;margin-top:10px;border-top:1px solid #eee;padding-top:8px}.history div{padding:4px 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#252b35;color:#fff;padding:10px 16px;border-radius:8px;z-index:120;display:none}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:899px){.page{padding:16px 12px 70px}.hero h1{font-size:20px}.kpis{grid-template-columns:repeat(2,1fr)}.tools{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.form{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body>
<header class="bg-red-700 text-white p-4 shadow sticky top-0 z-10"><div class="flex items-center gap-3 max-w-3xl mx-auto w-full"><a href="home.html" class="text-2xl font-bold">‹</a><div class="flex-1"><h1 class="text-lg font-bold">DPR Project Directory</h1><p class="text-red-100 text-xs">Work package lifecycle and reminder control</p></div></div></header>
<main class="page"><div class="hero"><div><h1>Project & work package control</h1><p>Start, pause, resume or complete work without creating incorrect DPR reminders.</p></div><button class="btn red" onclick="openForm()">+ New work package</button></div>
<section class="kpis"><div class="kpi"><b id="k-total">0</b><span>Total</span></div><div class="kpi"><b id="k-active">0</b><span>Active</span></div><div class="kpi"><b id="k-stop">0</b><span>Temporarily stopped</span></div><div class="kpi"><b id="k-done">0</b><span>Completed</span></div></section>
<section class="tools"><input id="search" class="fld" placeholder="Search project, site or item of work" oninput="render()"><select id="siteFilter" class="fld" onchange="render()"><option value="">All sites</option></select><select id="statusFilter" class="fld" onchange="render()"><option value="">All statuses</option><option value="active">Active</option><option value="temporarily_stopped">Stopped</option><option value="completed">Completed</option><option value="draft">Draft</option><option value="cancelled">Cancelled</option></select><button class="btn light" onclick="clearFilters()">Clear</button></section><section id="cards" class="cards"></section></main>
<div id="modal" class="modal"><div class="dialog"><h2 id="formTitle">New work package</h2><div class="form">
<div><label class="lbl">Project / job name *</label><input id="title" class="fld"></div><div><label class="lbl">Project code</label><input id="code" class="fld"></div>
<div><label class="lbl">Site *</label><select id="site" class="fld"></select></div><div><label class="lbl">Client / contract</label><input id="client" class="fld"></div>
<div><label class="lbl">Location</label><input id="location" class="fld"></div><div><label class="lbl">Item of work</label><input id="item" class="fld"></div>
<div><label class="lbl">Start date</label><input id="start" type="date" class="fld"></div><div><label class="lbl">Planned completion</label><input id="planned" type="date" class="fld"></div>
<div><label class="lbl">Actual completion</label><input id="actual" type="date" class="fld"></div><div><label class="lbl">Status</label><select id="status" class="fld"><option value="draft">Draft</option><option value="active">Active</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option><option value="archived">Archived</option></select></div>
<div><label class="lbl">DPR reminder</label><select id="reminder" class="fld"><option value="true">Enabled</option><option value="false">Disabled</option></select></div><div class="wide"><label class="lbl">Remarks</label><textarea id="remarks" class="fld"></textarea></div><div id="history" class="wide history"></div>
</div><div class="foot"><button class="btn light" onclick="closeForm()">Cancel</button><button class="btn red" onclick="save()">Save</button></div></div></div><div id="pcsModal" class="modal"><div class="dialog"><h2>PCS multi-location setup</h2><div class="form"><div class="wide"><label class="lbl">DPR mode</label><select id="pcsMode" class="fld"><option value="standard">Standard DPR</option><option value="multi_location">Multi-location DPR (PCS)</option></select></div><div class="wide" style="display:flex;gap:8px"><input id="pcsLocName" class="fld" placeholder="New work location name"><button class="btn red" onclick="addPcsLoc()">Add</button></div><div class="wide" id="pcsLocList" style="font-size:13px;color:#374151"></div></div><div class="foot"><button class="btn light" onclick="closePcs()">Close</button><button class="btn red" onclick="savePcsMode()">Save mode</button></div></div></div><div id="toast" class="toast"></div>
<script>
requireLogin();const PCS_FEATURE=true;let PCS_PID=null,PCS_SID=null;let PROJECTS=[],SITES=[],EDIT=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function msg(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2300)}function fmt(d){if(!d)return'—';let a=d.split('-');return a.length===3?`${a[2]}/${a[1]}/${a[0]}`:d}
async function boot(){let [rs,rp]=await Promise.all([vmmsApi('/api/v1/sites'),vmmsApi('/api/v1/dpr/project-directory')]);SITES=rs.ok?await rs.json():[];PROJECTS=rp.ok?await rp.json():[];$('site').innerHTML=SITES.map(x=>`<option value="${x.id}">${esc(x.site_name)}</option>`).join('');$('siteFilter').innerHTML='<option value="">All sites</option>'+SITES.map(x=>`<option value="${x.id}">${esc(x.site_name)}</option>`).join('');render()}
function render(){let q=$('search').value.toLowerCase(),sf=$('siteFilter').value,st=$('statusFilter').value;let rows=PROJECTS.filter(p=>(!sf||p.site_id===sf)&&(!st||p.lifecycle_status===st)&&(!q||[p.title,p.item_of_work,p.project_code,(p.sites||{}).site_name].join(' ').toLowerCase().includes(q)));$('k-total').textContent=PROJECTS.length;$('k-active').textContent=PROJECTS.filter(p=>p.lifecycle_status==='active').length;$('k-stop').textContent=PROJECTS.filter(p=>p.lifecycle_status==='temporarily_stopped').length;$('k-done').textContent=PROJECTS.filter(p=>p.lifecycle_status==='completed').length;$('cards').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">No matching work packages</div>'}
function card(p){let s=p.lifecycle_status||'draft';return `<article class="card"><div class="ctop"><div><h3>${esc(p.title)}</h3><div class="meta">${esc((p.sites||{}).site_name||'No site')} · ${esc(p.project_code||'No code')}<br>${esc(p.item_of_work||'No item of work')}</div></div><span class="pill ${s}">${esc(s.replaceAll('_',' '))}</span></div><div class="dates"><div>Started<b>${fmt(p.start_date)}</b></div><div>Planned finish<b>${fmt(p.planned_completion_date)}</b></div><div>Actual finish<b>${fmt(p.actual_completion_date)}</b></div></div><div class="meta">DPR reminder: <b>${p.reminder_enabled?'Enabled':'Disabled'}</b></div><div class="actions"><button class="btn light" onclick="openForm('${p.id}')">Edit</button>${PCS_FEATURE&&p.site_id?`<button class="btn" onclick="openPcs('${p.id}')">Locations</button>`:''}${s==='active'?`<button class="btn" onclick="stopWork('${p.id}')">Pause work</button>`:''}${s==='temporarily_stopped'?`<button class="btn red" onclick="resumeWork('${p.id}')">Resume work</button>`:''}</div></article>`}
function clearFilters(){$('search').value='';$('siteFilter').value='';$('statusFilter').value='';render()}function openForm(id){EDIT=PROJECTS.find(x=>x.id===id)||null;$('formTitle').textContent=EDIT?'Edit work package':'New work package';[['title','title'],['code','project_code'],['site','site_id'],['client','client_contract'],['location','location'],['item','item_of_work'],['start','start_date'],['planned','planned_completion_date'],['actual','actual_completion_date'],['status','lifecycle_status'],['remarks','remarks']].forEach(([a,b])=>$(a).value=EDIT?.[b]|| (a==='status'?'draft':''));$('reminder').value=String(EDIT?.reminder_enabled??true);$('history').innerHTML=EDIT?.pause_history?.length?'<b>Stop / resume history</b>'+EDIT.pause_history.map(x=>`<div>${fmt(x.stop_date)} → ${fmt(x.resume_date)} ${esc(x.reason||'')}</div>`).join(''):'';$('modal').classList.add('open')}function closeForm(){$('modal').classList.remove('open')}
async function save(){let body={title:$('title').value.trim(),to_party:EDIT?.to_party||null,attention:EDIT?.attention||null,project_code:$('code').value.trim()||null,site_id:$('site').value,client_contract:$('client').value.trim()||null,location:$('location').value.trim()||null,item_of_work:$('item').value.trim()||null,start_date:$('start').value||null,planned_completion_date:$('planned').value||null,actual_completion_date:$('actual').value||null,lifecycle_status:$('status').value,reminder_enabled:$('reminder').value==='true',responsible_user_ids:EDIT?.responsible_user_ids||[],remarks:$('remarks').value.trim()||null};if(!body.title||!body.site_id)return msg('Project name and site are required');let url=EDIT?`/api/v1/dpr/project-directory/${EDIT.id}`:'/api/v1/dpr/project-directory',r=await vmmsApi(url,{method:EDIT?'PATCH':'POST',body:JSON.stringify(body)});if(!r.ok){let e=await r.json().catch(()=>({}));return msg(e.detail||'Could not save')}closeForm();msg('Saved');await boot()}
async function stopWork(id){let stop_date=prompt('Stop date (YYYY-MM-DD)',new Date().toISOString().slice(0,10));if(!stop_date)return;let reason=prompt('Reason for temporary stoppage','')||'';let r=await vmmsApi(`/api/v1/dpr/project-directory/${id}/stop`,{method:'POST',body:JSON.stringify({stop_date,reason})});if(!r.ok){let e=await r.json().catch(()=>({}));return msg(e.detail||'Could not pause')}msg('Work paused');await boot()}
async function resumeWork(id){let resume_date=prompt('Resume date (YYYY-MM-DD)',new Date().toISOString().slice(0,10));if(!resume_date)return;let r=await vmmsApi(`/api/v1/dpr/project-directory/${id}/resume`,{method:'POST',body:JSON.stringify({resume_date})});if(!r.ok){let e=await r.json().catch(()=>({}));return msg(e.detail||'Could not resume')}msg('Work resumed');await boot()}async function openPcs(id){const p=PROJECTS.find(x=>x.id===id);if(!p||!p.site_id)return msg('This work package has no site');PCS_SID=p.site_id;PCS_PID=null;$('pcsMode').value='standard';$('pcsLocName').value='';$('pcsModal').classList.add('open');await loadPcs();}function closePcs(){$('pcsModal').classList.remove('open')}async function loadPcs(){try{let r=await vmmsApi('/api/v1/pcs/dpr-config?site_id='+encodeURIComponent(PCS_SID));if(r.ok){let j=await r.json();PCS_PID=j.project_id;$('pcsMode').value=j.dpr_mode||'standard';}}catch(e){}await renderPcsLocs();}async function renderPcsLocs(){let box=$('pcsLocList');box.innerHTML='Loading…';try{let r=await vmmsApi('/api/v1/pcs/locations?site_id='+encodeURIComponent(PCS_SID));let rows=r.ok?await r.json():[];box.innerHTML=rows.length?rows.map(l=>`<div style="padding:6px 0;border-bottom:1px solid #eee">${esc(l.name)} <span class="pill ${l.status}">${esc((l.status||'').replaceAll('_',' '))}</span></div>`).join(''):'<i>No work locations yet</i>';}catch(e){box.innerHTML='Could not load locations'}}async function addPcsLoc(){let name=$('pcsLocName').value.trim();if(!name)return msg('Enter a location name');let r=await vmmsApi('/api/v1/pcs/locations',{method:'POST',body:JSON.stringify({site_id:PCS_SID,name})});if(!r.ok){let e=await r.json().catch(()=>({}));return msg(e.detail||'Could not add location')}$('pcsLocName').value='';msg('Location added');await renderPcsLocs();}async function savePcsMode(){if(!PCS_PID)await loadPcs();if(!PCS_PID)return msg('Project not resolved');let r=await vmmsApi('/api/v1/pcs/dpr-config',{method:'PUT',body:JSON.stringify({project_id:PCS_PID,dpr_mode:$('pcsMode').value})});if(!r.ok){let e=await r.json().catch(()=>({}));return msg(e.detail||'Could not save mode')}msg('DPR mode saved');}boot();
</script></body></html>

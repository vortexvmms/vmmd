<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Photos · VCMS Camera</title><link rel="stylesheet" href="css/app.css"><script src="js/config.js"></script><script src="js/auth.js"></script><style>body{margin:0;background:#eef0f4;font-family:Arial}.top{background:#ae0000;color:#fff;padding:18px}.top h1{margin:0;font-size:19px}.box{margin:18px auto;padding:35px 18px;max-width:650px;background:#fff;border-radius:14px;text-align:center;color:#667085}.btn{display:inline-block;margin-top:15px;background:#c00000;color:#fff;text-decoration:none;padding:11px 15px;border-radius:9px;font-weight:bold;border:0}.status{font-weight:700;color:#20242c}</style></head><body><header class="top"><h1>My Photos</h1></header><main class="box"><h2>Offline queue is active</h2><p id="status" class="status">Checking saved photos…</p><button id="sync" class="btn" onclick="syncNow()">Upload Pending</button><br><a class="btn" href="camera.html">Back to Camera</a></main><script src="js/camera-queue.js?v=20260814-1"></script><script>requireLogin();async function show(){let s=await VCMSCameraQueue.stats();document.getElementById('status').textContent=`Today: ${s.total} photos · ${s.uploaded} uploaded · ${s.pending} pending`;document.getElementById('sync').disabled=!s.pending||!navigator.onLine}async function syncNow(){await VCMSCameraQueue.syncAll();show()}window.addEventListener('vcms-camera-queue',show);show()</script></body></html>

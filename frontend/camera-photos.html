*{box-sizing:border-box}body{margin:0;background:#eef0f4;color:#20242c;font-family:Arial}.top{background:linear-gradient(135deg,#9e0000,#cf0000);color:#fff;padding:max(14px,env(safe-area-inset-top)) 15px 13px;position:sticky;top:0;z-index:10}.topin{max-width:1000px;margin:auto;display:flex;align-items:center;gap:11px}.back{font-size:27px;color:#fff;text-decoration:none}.top h1{font-size:19px;margin:0}.top small{opacity:.8}.page{max-width:1000px;margin:auto;padding:14px 12px 90px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:11px}.k{background:#fff;border-radius:11px;padding:11px;border:1px solid #dce1e8}.k b{display:block;font-size:21px}.k span{font-size:11px;color:#667085}.tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:13px}.ctrl{height:42px;border:1px solid #cbd2dc;border-radius:9px;background:#fff;padding:0 10px}.sync{border:0;border-radius:9px;background:#252b35;color:#fff;font-weight:800;padding:0 12px}.sync:disabled{opacity:.45}.date{font-size:13px;font-weight:800;color:#5d687a;text-transform:uppercase;letter-spacing:.05em;margin:17px 0 7px}.project{background:#fff;border:1px solid #dce1e8;border-radius:13px;overflow:hidden;margin-bottom:11px}.project h2{font-size:15px;margin:0;padding:12px 13px;background:#252b35;color:#fff}.work{padding:11px;border-top:1px solid #edf0f3}.work h3{font-size:14px;margin:0 0 8px;color:#8f0000}.activity{margin:8px 0}.activity h4{font-size:12px;margin:0 0 6px;color:#5c6675}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.photo{position:relative;border-radius:9px;overflow:hidden;background:#e5e7eb;aspect-ratio:4/3}.photo img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;left:5px;bottom:5px;background:#111b;color:#fff;border-radius:99px;padding:4px 7px;font-size:10px;font-weight:800}.failed{background:#9f1111}.pending{background:#996000}.empty{background:#fff;border-radius:13px;padding:42px 15px;text-align:center;color:#667085}.modal{display:none;position:fixed;inset:0;background:#080b10e8;z-index:50;padding:65px 15px 70px;align-items:center;justify-content:center;touch-action:pan-y}.modal.open{display:flex}.modal img{max-width:100%;max-height:calc(100dvh - 135px);border-radius:9px;object-fit:contain}.close{position:absolute;top:max(12px,env(safe-area-inset-top));right:15px;background:#fff;color:#111;border:0;border-radius:50%;width:44px;height:44px;font-size:24px;z-index:2}.viewback{position:absolute;top:max(12px,env(safe-area-inset-top));left:15px;background:#fff;color:#111;border:0;border-radius:9px;height:44px;padding:0 14px;font-weight:800;z-index:2}.viewcount{position:absolute;top:max(25px,calc(env(safe-area-inset-top) + 13px));left:50%;transform:translateX(-50%);color:#fff;font-weight:800}.viewarrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:56px;border:0;border-radius:9px;background:#fffddd;color:#111;font-size:28px;z-index:2}.viewprev{left:8px}.viewnext{right:8px}.viewarrow:disabled{opacity:.25}.retry{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border:0;border-radius:9px;background:#c00000;color:#fff;padding:11px 16px;font-weight:800}.deletephoto{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));right:15px;border:1px solid #ffb3b3;border-radius:9px;background:#fff;color:#a40000;padding:11px 14px;font-weight:800}.deletephoto:disabled{opacity:.5}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d8dde5;padding:8px 12px max(8px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px}.nav{width:min(220px,31%);text-align:center;text-decoration:none;color:#596579;padding:7px;border-radius:9px;font-size:11px;font-weight:700}.nav b{display:block;font-size:18px}.nav.on{background:#fee8e8;color:#a60000}

</style></head><body><header class="top"><div class="topin"><a class="back" href="camera.html">‹</a><div><h1>My Photos</h1><small>Site evidence and synchronization</small></div></div></header><main class="page"><section class="summary"><div class="k"><b id="total">0</b><span>Today</span></div><div class="k"><b id="uploaded">0</b><span>Uploaded</span></div><div class="k"><b id="pending">0</b><span>Pending</span></div></section><div class="tools"><select id="scope" class="ctrl" onchange="load()"><option value="mine">My photos</option><option value="all">All permitted photos</option></select><button id="sync" class="sync" onclick="syncNow()">Upload Pending</button></div><div id="content"><div class="empty">Loading photos…</div></div></main><nav class="bottom"><a class="nav" href="camera.html"><b>◉</b>Camera</a><a class="nav on" href="camera-photos.html"><b>▧</b>My Photos</a><a class="nav" href="home.html"><b>⌂</b>VCMS</a></nav><div id="viewer" class="modal" onclick="if(event.target===this)closeView()"><button class="viewback" onclick="closeView()">‹ Back to photos</button><span id="viewCount" class="viewcount"></span><button class="close" onclick="closeView()">×</button><button id="viewPrev" class="viewarrow viewprev" onclick="moveView(-1)">‹</button><img id="big" alt=""><button id="viewNext" class="viewarrow viewnext" onclick="moveView(1)">›</button><button id="retry" class="retry" onclick="retryCurrent()">Retry upload</button><button id="deletePhoto" class="deletephoto" onclick="deleteCurrent()">Delete</button></div><script src="js/camera-queue.js?v=20260814-2"></script><script>
requireLogin();let ROWS=[],CURRENT=null,URLS=[],VIEWINDEX=-1,VIEWTOUCHX=0;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));function when(x){return x.captured_at||x.imported_at||x.created_at||new Date().toISOString()}function day(x){return when(x).slice(0,10)}function time(x){if(!x.captured_at)return'Capture time unknown';return new Date(x.captured_at).toLocaleTimeString('en-SG',{hour:'2-digit',minute:'2-digit'})}function project(x){return x.project_name||x.metadata?.project_name||x.dpr_projects?.title||'Project'}function work(x){return x.item_of_work_name||x.metadata?.item_of_work_name||'Item of work'}function activity(x){return x.activity_name||x.metadata?.activity_name||'Activity'}function url(x){if(x.public_url)return x.public_url;if(x.blob){let u=URL.createObjectURL(x.blob);URLS.push(u);return u}return''}
async function load(){URLS.forEach(URL.revokeObjectURL);URLS=[];let local=await VCMSCameraQueue.all(),cloud=[];try{let r=await vmmsApi(`/api/v1/camera/photos?mine=${$('scope').value==='mine'}`);if(r.ok)cloud=await r.json()}catch{}let map=new Map(cloud.map(x=>[x.photo_id,{...x,status:'uploaded'}]));local.forEach(x=>map.set(x.photo_id,{...x.metadata,...x,status:x.status,public_url:x.public_url||x.metadata?.public_url}));ROWS=[...map.values()].sort((a,b)=>when(b).localeCompare(when(a)));render();updateStats()}
function render(){if(!ROWS.length){$('content').innerHTML='<div class="empty">No Camera photos yet.<br>Take your first site photo from VCMS Camera.</div>';return}let dates={};ROWS.forEach(x=>{let d=day(x),p=project(x),w=work(x),a=activity(x);((((dates[d]??={})[p]??={})[w]??={})[a]??=[]).push(x)});$('content').innerHTML=Object.entries(dates).map(([d,ps])=>`<div class="date">${fmt(d)}</div>${Object.entries(ps).map(([p,ws])=>`<section class="project"><h2>${esc(p)}</h2>${Object.entries(ws).map(([w,as])=>`<div class="work"><h3>${esc(w)}</h3>${Object.entries(as).map(([a,xs])=>`<div class="activity"><h4>${esc(a)}</h4><div class="photos">${xs.map(photoCard).join('')}</div></div>`).join('')}</div>`).join('')}</section>`).join('')}`).join('')}
function photoCard(x){let st=x.status||x.sync_status||'uploaded',u=url(x);return `<button class="photo" onclick="view('${x.photo_id}')"><img loading="lazy" src="${esc(u)}"><span class="badge ${st}">${st==='uploaded'?'✓ Uploaded':st==='uploading'?'↻ Uploading':st==='failed'?'⚠ Failed':'⏳ Pending'} · ${esc(time(x))}</span></button>`}function fmt(d){let [y,m,a]=d.split('-');return`${a}/${m}/${y}`}
async function updateStats(){let s=await VCMSCameraQueue.stats(),today=ROWS.filter(x=>day(x)===new Date().toISOString().slice(0,10));$('total').textContent=Math.max(s.total,today.length);$('uploaded').textContent=today.filter(x=>(x.status||x.sync_status)==='uploaded').length;$('pending').textContent=s.pending;$('sync').disabled=!s.pending||!navigator.onLine;$('sync').textContent=`Upload Pending (${s.pending})`}
function showView(){CURRENT=ROWS[VIEWINDEX];if(!CURRENT)return;$('big').src=url(CURRENT);$('viewCount').textContent=`${VIEWINDEX+1} / ${ROWS.length}`;$('viewPrev').disabled=VIEWINDEX===0;$('viewNext').disabled=VIEWINDEX===ROWS.length-1;$('retry').style.display=(CURRENT.status&&CURRENT.status!=='uploaded')?'block':'none';$('deletePhoto').disabled=false;$('deletePhoto').textContent='Delete'}function view(id){VIEWINDEX=ROWS.findIndex(x=>x.photo_id===id);showView();$('viewer').classList.add('open')}function moveView(step){let next=VIEWINDEX+step;if(next<0||next>=ROWS.length)return;VIEWINDEX=next;showView()}function closeView(){$('viewer').classList.remove('open')}async function deleteCurrent(){if(!CURRENT||!confirm('Permanently delete this photo from VCMS and R2 storage?'))return;let b=$('deletePhoto');b.disabled=true;b.textContent='Deleting…';try{if((CURRENT.status||CURRENT.sync_status)==='uploaded'){let r=await vmmsApi(`/api/v1/camera/photos/${encodeURIComponent(CURRENT.photo_id)}`,{method:'DELETE'});if(!r.ok){let e=await r.json().catch(()=>({}));throw Error(e.detail||'Could not delete photo')}}await VCMSCameraQueue.remove(CURRENT.photo_id).catch(()=>{});ROWS.splice(VIEWINDEX,1);render();updateStats();if(!ROWS.length)closeView();else{VIEWINDEX=Math.min(VIEWINDEX,ROWS.length-1);showView()}}catch(e){b.disabled=false;b.textContent='Delete';alert(e.message||'Could not delete photo')}}async function retryCurrent(){if(!CURRENT)return;await VCMSCameraQueue.syncOne(CURRENT.photo_id).catch(()=>{});closeView();load()}async function syncNow(){$('sync').disabled=true;await VCMSCameraQueue.syncAll();load()}$('viewer').addEventListener('touchstart',e=>VIEWTOUCHX=e.changedTouches[0].clientX,{passive:true});$('viewer').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-VIEWTOUCHX;if(Math.abs(dx)>45)moveView(dx<0?1:-1)},{passive:true});addEventListener('keydown',e=>{if(e.key==='Escape')closeView();if($('viewer').classList.contains('open')&&e.key==='ArrowLeft')moveView(-1);if($('viewer').classList.contains('open')&&e.key==='ArrowRight')moveView(1)});window.addEventListener('vcms-camera-queue',updateStats);load();
</script></body></html>

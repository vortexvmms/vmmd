# Publishes the /frontend folder to GitHub Pages automatically
# every time files are updated on the main branch.
name: Deploy frontend to GitHub Pages

on:
  # Production is published only after the complete Test workflow succeeds.
  workflow_run:
    workflows: ["Test"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time, but DO NOT cancel a running one.
# Cancelling a Pages deploy mid-flight wedges the queue (deployment_queued
# -> timeout). Queueing instead lets each deploy finish cleanly.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4

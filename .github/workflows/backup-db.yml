# VCMS — automated daily database backup
# ------------------------------------------------------------------
# WHERE THIS GOES:  copy this file to  .github/workflows/backup-db.yml
#
# ONE-TIME SETUP (you do this, I never see the value):
#   1. Supabase dashboard → Project Settings → Database → Connection string
#      → choose "URI". Copy it (starts with postgresql://postgres:...).
#   2. GitHub repo → Settings → Secrets and variables → Actions → New secret
#      Name:  SUPABASE_DB_URL      Value: (paste the URI)
#
# WHAT IT DOES:
#   - Runs every day 02:00 Singapore time (18:00 UTC).
#   - Takes a full compressed dump and schema export; encrypts all artifacts.
#   - Requires VCMS_BACKUP_KEY in Actions secrets; retain its recovery key locally.
#   - Saves it as a downloadable Actions "artifact", kept 90 days.
#   - You (repo admin) can download any day's backup from the Actions tab.
#
# GOOD PRACTICE:  once a month, download one artifact and keep a copy on your
# own laptop / Google Drive. That is your true off-site copy.
# ------------------------------------------------------------------
name: VCMS DB Backup

on:
  schedule:
    - cron: "0 18 * * *"      # 02:00 SGT daily
  workflow_dispatch: {}        # lets you also run it on-demand from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 client
        # Supabase runs Postgres 17; pg_dump must match or be newer, so pull the
        # v17 client from the official PostgreSQL apt repo (PGDG).
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - name: Dump database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_KEY: ${{ secrets.VCMS_BACKUP_KEY }}
        run: |
          set -euo pipefail
          test -n "$DB_URL" && test -n "$BACKUP_KEY"
          # Validate without printing any part of the credential.
          DB_URL=$(python3 - <<'PYURL'
          import os, sys
          from urllib.parse import urlsplit
          value = os.environ["DB_URL"].strip()
          if len(value) > 1 and value[0] == value[-1] and value[0] in ("'", '"', '`'):
              value = value[1:-1].strip()
          try:
              uri = urlsplit(value)
              valid = (uri.scheme in ("postgres", "postgresql") and uri.hostname
                       and uri.username and uri.password and uri.path == "/postgres"
                       and uri.port == 5432 and "YOUR_PASSWORD" not in value
                       and "[YOUR-PASSWORD]" not in value)
          except ValueError:
              valid = False
          if not valid:
              print("SUPABASE_DB_URL must be the full Session pooler URI (postgresql://user:password@host:5432/postgres), with the actual URL-encoded password. Secret value was not displayed.", file=sys.stderr)
              sys.exit(2)
          print(value)
          PYURL
          )
          ts=$(date -u +%Y%m%d_%H%M)
          # The runner's default pg_dump on PATH is v16; use the highest version we
          # installed (v17) explicitly so it matches the Supabase server.
          PGDUMP=$(ls /usr/lib/postgresql/*/bin/pg_dump | sort -V | tail -1)
          echo "Using $PGDUMP"; "$PGDUMP" --version
          # -Fc = compressed custom format (best for pg_restore)
          "$PGDUMP" "$DB_URL" --no-owner --no-privileges -Fc -f "vcms_backup_${ts}.dump"
          # also a plain .sql for easy reading / partial restores
          "$PGDUMP" "$DB_URL" --no-owner --no-privileges     -f "vcms_backup_${ts}.sql"
          gzip "vcms_backup_${ts}.sql"
          "$PGDUMP" "$DB_URL" --schema-only --no-owner --no-privileges -f "vcms_schema_${ts}.sql"
          for export_file in vcms_backup_*.dump vcms_backup_*.sql.gz vcms_schema_*.sql; do
            printf %s "$BACKUP_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 "$export_file"
            rm "$export_file"
          done
          ls -lh *.gpg

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcms-db-backup
          path: |
            vcms_backup_*.dump.gpg
            vcms_backup_*.sql.gz.gpg
            vcms_schema_*.sql.gpg
          retention-days: 90

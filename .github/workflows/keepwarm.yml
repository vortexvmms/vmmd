name: Keep backend warm

# Pings the VMMS backend every ~10 minutes from 06:00 to 23:30 SGT.
# GitHub cron uses UTC: 22:00 UTC = 06:00 SGT the next day, and
# 15:30 UTC = 23:30 SGT. Outside this window Render may sleep.
on:
  schedule:
    - cron: '*/10 22-23,0-14 * * *' # 06:00–22:50 SGT
    - cron: '0,10,20,30 15 * * *'   # 23:00–23:30 SGT
  workflow_dispatch: {}   # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="https://vmms-backend-sg.onrender.com/api/v1/health"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL?z=$(date +%s)" || echo "000")
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Backend is awake."
              exit 0
            fi
            sleep 20
          done
          echo "Health check did not return 200 (backend may be starting)."
          exit 0

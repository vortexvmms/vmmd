name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  phase0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend pytest backend/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check frontend/js/project-context.js
      - run: node --check frontend/js/config.js
      - run: node --check frontend/js/core-bundle.js
      - run: node --check frontend/js/ui.js
      - run: node --check frontend/js/shell.js
      - run: node --check frontend/js/worker-photos.js
      - run: node --check frontend/js/worker-photo-editor.js
      - run: node --check frontend/js/worker-cards.js
      - run: node --check frontend/js/document-masking.js
      - run: node --check frontend/js/lifting.js
      - run: node --check frontend/js/sic-register.js
      - run: node --check frontend/js/sic-card-data.js
      - run: node --check frontend/js/sic-card-reader.js
      - run: node --test frontend/tests/sic-domain.test.cjs frontend/tests/sic-card-data.test.cjs frontend/tests/verification-export.test.cjs
      - run: node --check frontend/js/verification-export.js
      - run: node --check frontend/js/theme-ext.js
      - run: node --check frontend/js/theme-designer.js
      - run: node --check frontend/js/tipper.js
      - run: node --check frontend/js/tipper-shared.js
      - run: node --check frontend/js/driver-upload.js
      - run: python3 scripts/build_frontend_core.py
      - run: git diff --exit-code frontend/js/core-bundle.js

  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser

  lifting-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LIFTING_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: psql "$LIFTING_TEST_DB_URL" -v ON_ERROR_STOP=1 -f backend/tests/lifting_db_foundation.sql -f db/migrations/0020_lifting_directory.sql -f db/migrations/0021_lifting_anonymous_grants.sql -f db/migrations/0022_lifting_manufacture_year.sql
      - run: PYTHONPATH=backend pytest backend/tests/test_lifting_db.py -q

  tipper-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TIPPER_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt 'psycopg[binary]==3.2.12'
      - run: psql "$TIPPER_TEST_DB_URL" -v ON_ERROR_STOP=1 -f backend/tests/tipper_db_foundation.sql -f db/migrations/0016_tipper_truck_supply.sql -f supabase/migrations/20261007092400_tipper_driver_portal_and_billing.sql
      - run: PYTHONPATH=backend pytest backend/tests/test_tipper_db.py -q

  attendance-removal-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ATTENDANCE_REMOVAL_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: psql "$ATTENDANCE_REMOVAL_TEST_DB_URL" -v ON_ERROR_STOP=1 -f backend/tests/attendance_removal_db_foundation.sql -f db/schema.sql -f db/migrate_attendance_shifts_partial_leave.sql -f backend/tests/attendance_removal_db_live_contract.sql -f supabase/migrations/20261003005943_attendance_day_removal.sql -f supabase/migrations/20261005094040_site_work_schedules.sql
      - run: PYTHONPATH=backend pytest backend/tests/test_attendance_removal_db.py -q


  sic-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: SIC migration, permissions, duplicates and renewal rollback
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f backend/tests/sic_db_foundation.sql -f db/migrations/0023_sic_register.sql -f db/migrations/0024_sic_storage_record_key.sql -f db/migrations/0025_recoverable_site_removal.sql -f supabase/migrations/20261021083812_sic_designation_snapshot.sql
          (echo 'begin;'; cat backend/tests/sic_rollback_checks.sql backend/tests/site_removal_checks.sql backend/tests/sic_designation_checks.sql; echo 'rollback;') | psql -h localhost -U postgres -v ON_ERROR_STOP=1

  worker-documents-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Worker document migration and supervisor permissions
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f backend/tests/worker_documents_db_foundation.sql -f supabase/migrations/20261020134501_restore_worker_documents.sql -f backend/tests/worker_documents_db_checks.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "create function public.is_full() returns boolean language sql stable as \$\$select public.my_role() in ('admin','general_manager','operation_manager','hr_assistant')\$\$;"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261022060000_worker_profile_photos.sql -f backend/tests/worker_photos_db_checks.sql

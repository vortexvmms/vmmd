name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  phase0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend pytest backend/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check frontend/js/project-context.js
      - run: node --check frontend/js/config.js
      - run: node --check frontend/js/core-bundle.js
      - run: node --check frontend/js/ui.js
      - run: node --check frontend/js/shell.js
      - run: node --check frontend/js/lifting.js
      - run: node --check frontend/js/theme-ext.js
      - run: node --check frontend/js/theme-designer.js
      - run: python3 scripts/build_frontend_core.py
      - run: git diff --exit-code frontend/js/core-bundle.js

  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser

  lifting-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LIFTING_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: psql "$LIFTING_TEST_DB_URL" -v ON_ERROR_STOP=1 -f backend/tests/lifting_db_foundation.sql -f db/migrations/0020_lifting_directory.sql
      - run: PYTHONPATH=backend pytest backend/tests/test_lifting_db.py -q

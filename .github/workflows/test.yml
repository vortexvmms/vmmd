name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  phase0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend pytest backend/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check frontend/js/project-context.js
      - run: node --check frontend/js/config.js
      - run: node --check frontend/js/core-bundle.js
      - run: node --check frontend/js/ui.js
      - run: node --check frontend/js/shell.js
      - run: node --check frontend/js/schedule-wbs.js
      - run: node --check frontend/js/wbs-tree.js
      - run: node --check frontend/js/schedule-activities.js
      - run: node --check frontend/js/schedule-logic.js
      - run: node --check frontend/js/schedule-calendars.js
      - run: node --check frontend/js/schedule-resources.js
      - run: node --check frontend/js/schedule-gantt.js
      - run: node frontend/tests/wbs-tree.test.js
      - run: python3 scripts/build_frontend_core.py
      - run: git diff --exit-code frontend/js/core-bundle.js

  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
